<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1628">
<title>Venue Scout · The Surf Sequence®</title>
<link rel="icon" href="tss-logo-wave.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="tss-logo-wave.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;700&family=Work+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#061C2B; --bg2:#0A2438; --bg3:#123049;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#E8F0F5; --text-soft:#B8CCDF; --grey:#6B7E8F;
  --cyan:#00D2FF; --purple:#A855F7; --amber:#FFD166; --foam:#06D6A0; --coral:#FF6B6B;
  --gold:#F59E0B; --silver:#9CA3AF; --bronze:#B45309;
  --gold-text:#FCD34D; --silver-text:#D1D5DB; --bronze-text:#FBBF24;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Work Sans',system-ui,sans-serif; min-height:100vh; min-height:100dvh; overscroll-behavior:none; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Archivo',sans-serif; font-stretch:125%; text-transform:uppercase; margin:0; font-weight:800;}
.serif{font-family:'Archivo',sans-serif; font-stretch:110%; font-weight:600; letter-spacing:.01em;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- Layout ---------- */
.app{max-width:100%; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
.topbar{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(10,22,40,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:10;}
.brand-block{display:flex; align-items:center; gap:14px;}
.brand-logo{height:44px; width:auto; opacity:1;}
.brand-divider{width:1px; height:32px; background:var(--border2);}
.brand-tool{font-family:'Archivo',sans-serif; font-stretch:125%; font-weight:700; font-size:13px; color:var(--text-soft); letter-spacing:.6px; text-transform:uppercase;}
.brand-tool strong{color:var(--cyan); font-weight:700;}
.brand-ctx{font-family:'Work Sans',sans-serif; font-size:12px; color:var(--text-soft); display:none;}
.brand-ctx strong{color:var(--text); font-weight:600;}
@media(min-width:600px){ .brand-ctx{display:inline;} }
.menu-btn{padding:7px; border:1px solid var(--border2); border-radius:12px; color:var(--text-soft); display:inline-flex; align-items:center; justify-content:center; transition:all .15s;}
.menu-btn:hover{border-color:var(--cyan); color:var(--cyan);}
.menu-btn svg{width:16px; height:16px;}
.screen{padding:16px; flex:1; display:flex; flex-direction:column; gap:14px;}

/* ---------- Inputs ---------- */
.label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); font-weight:500; margin-bottom:6px;}
.inp,.sel,.ta{width:100%; background:rgba(255,255,255,.04); border:1px solid var(--border2); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px;}
.inp:focus,.sel:focus,.ta:focus{outline:none; border-color:var(--cyan); background:rgba(0,210,255,.04);}
.ta{resize:vertical; min-height:64px; font-family:inherit;}

/* ---------- Chips ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; padding:8px 16px; border-radius:999px; background:rgba(0,210,255,.1); border:1.5px solid rgba(0,210,255,.3); color:var(--cyan); font-weight:500; cursor:pointer; user-select:none; transition:all .12s;}
.chip:active{transform:scale(.96);}
.chip.off{background:transparent; border:1px solid var(--border2); color:var(--grey);}
.chip.amber{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.4); color:var(--gold-text);}
.chip.purple{background:rgba(168,85,247,.12); border-color:rgba(168,85,247,.4); color:#C9B9E8;}

/* ---------- Buttons ---------- */
.btn{padding:13px 18px; border-radius:999px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; transition:all .15s; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn:active{transform:scale(.97);}
.btn-cyan{background:var(--cyan); color:var(--bg);}
.btn-ghost{background:transparent; border:1px solid var(--border2); color:var(--text-soft);}
.btn-coral{background:rgba(252,165,165,.12); border:1px solid rgba(252,165,165,.4); color:var(--coral);}
.btn-block{width:100%;}
.btn-lg{padding:14px 18px; font-size:14px;}

/* ---------- Categories ---------- */
.cat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.cat{padding:14px 6px; border-radius:12px; text-align:center; cursor:pointer; user-select:none; transition:all .15s; border:2.5px solid transparent;}
.cat:active{transform:scale(.97);}
.cat.on{transform:scale(1.03); box-shadow:0 0 0 3px rgba(255,255,255,.18);}
.cat-mejor{background:rgba(245,158,11,.18); border-color:var(--gold);}
.cat-media{background:rgba(156,163,175,.16); border-color:var(--silver);}
.cat-otra{background:rgba(180,83,9,.18); border-color:var(--bronze);}
.cat-lbl{font-size:11px; font-weight:700; letter-spacing:.8px;}
.cat-num{font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace; margin-top:4px; line-height:1;}
.cat-mejor .cat-lbl,.cat-mejor .cat-num{color:var(--gold-text);}
.cat-media .cat-lbl,.cat-media .cat-num{color:var(--silver-text);}
.cat-otra .cat-lbl,.cat-otra .cat-num{color:var(--bronze-text);}

/* ---------- Toolbar ---------- */
.toolbar{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;} .toolbar>*{flex:0 0 auto; min-width:62px;}
.tool{padding:9px 4px; border-radius:12px; text-align:center; font-size:10px; font-weight:700; border:1px solid var(--border2); color:var(--text-soft); cursor:pointer; user-select:none; letter-spacing:.4px; transition:all .12s; line-height:1.1;}
.tool:active{transform:scale(.96);}
.tool svg{display:block; margin:0 auto 3px; width:16px; height:16px;}
.tool.on{background:rgba(255,255,255,.08); border-color:currentColor;}
.tool.out{color:var(--purple);}
.tool.in{color:var(--gold);}
.tool.ori{color:var(--cyan);}
.tool.del{color:var(--coral);}
.tool.misma{color:var(--cyan); border-color:rgba(0,210,255,.4); background:rgba(0,210,255,.08);}

/* ---------- Timer ---------- */
.timer-bar{display:flex; justify-content:space-between; align-items:center; gap:12px;}
.timer-big{font-size:40px; font-weight:800; color:var(--text); font-family:'Archivo',sans-serif; font-stretch:125%; line-height:1;}
.timer-sub{font-size:11px; color:var(--grey); margin-top:3px;}
.timer-stop{font-size:13px; color:var(--coral); font-weight:600; padding:8px 14px; border:1px solid rgba(252,165,165,.4); border-radius:12px;}
.timer-warn{color:var(--gold-text) !important;}

/* ---------- Map ---------- */
.map-wrap{position:relative; background:#021126; border-radius:14px; overflow:hidden; touch-action:pan-y;}
.map-wrap svg{display:block; width:100%; height:auto; touch-action:pan-y; max-height:52vh;}
.map-wrap.drawing-mode, .map-wrap.drawing-mode svg{touch-action:none;}
.map-meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--grey); padding:4px 2px; font-family:'IBM Plex Mono',monospace;}
@media (min-width:1024px){
  .map-wrap svg{max-height:none;}
}

/* ---------- Section ---------- */
.section{background:rgba(247,249,250,.03); border:1px solid var(--border); border-radius:20px; padding:16px;}
.section-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.section-t{font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.16em; font-weight:500; font-size:10px; color:var(--cyan); margin-bottom:10px;}

/* ---------- Recent waves list ---------- */
.recent{max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;}
.recent-item{display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:rgba(255,255,255,.04); border-radius:6px; font-size:12px;}
.recent-coord{font-family:'IBM Plex Mono',monospace; font-weight:700;}
.recent-time{color:var(--grey); font-size:11px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; z-index:200; backdrop-filter:blur(8px); padding:20px;}
.modal{background:var(--bg2); border:1px solid rgba(0,210,255,.2); border-radius:24px; padding:20px 20px 22px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto;}
.modal-h{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
.modal-t{font-family:'Archivo',sans-serif; font-stretch:125%; text-transform:uppercase; font-size:17px; font-weight:800;}
.modal-x{font-size:22px; color:var(--grey); padding:0 6px;}

/* ---------- Report ---------- */
.report-block{background:rgba(255,255,255,.025); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:0 12px 12px 0; padding:0; margin-bottom:10px; overflow:hidden;}
.report-block.silver{border-left-color:var(--silver);}
.report-block.bronze{border-left-color:var(--bronze);}
.report-cat-banner{display:flex; justify-content:space-between; align-items:center; padding:8px 14px; background:rgba(245,158,11,.08); border-bottom:1px solid var(--border);}
.report-block.silver .report-cat-banner{background:rgba(156,163,175,.06);}
.report-block.bronze .report-cat-banner{background:rgba(180,83,9,.06);}
.report-cat-lbl{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--gold-text);}
.report-block.silver .report-cat-lbl{color:var(--silver-text);}
.report-block.bronze .report-cat-lbl{color:var(--bronze-text);}
.report-cat-meta{font-size:11px; color:var(--text-soft); font-family:'IBM Plex Mono',monospace;}
.report-hero{padding:18px 16px 14px; text-align:center;}
.report-hero-coord{font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:700; color:var(--gold-text); line-height:.95; letter-spacing:-.02em;}
.report-block.silver .report-hero-coord{color:var(--silver-text);}
.report-block.bronze .report-hero-coord{color:var(--bronze-text);}
.report-hero-arrow{color:var(--text-soft); font-size:22px; font-weight:300; margin:0 12px;}
.report-hero-time{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--text);}
.report-hero-row{display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap;}
.report-hero-sub{font-size:13px; color:var(--text-soft); margin-top:6px; line-height:1.4;}
.report-hero-sub strong{color:var(--text); font-weight:500;}
.report-strip{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); flex-wrap:wrap;}
.report-pill{font-size:11px; padding:4px 10px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--border); color:var(--text-soft);}
.report-pill strong{color:var(--text); font-weight:600;}
.report-pill.foam{background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.3); color:var(--foam);}
.report-pill.amber{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.3); color:var(--gold-text);}
.report-pill.coral{background:rgba(252,165,165,.12); border-color:rgba(252,165,165,.3); color:var(--coral);}
.report-alt-section{padding:10px 14px 14px; border-top:1px solid var(--border);}
.report-alt-title{font-size:10px; font-weight:700; letter-spacing:1.2px; color:var(--cyan); margin-bottom:8px;}
.report-alt-row{display:flex; align-items:center; gap:10px; padding:8px 0; font-size:12px; color:var(--text-soft);}
.report-alt-row + .report-alt-row{border-top:1px dashed var(--border);}
.report-alt-num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; background:rgba(0,210,255,.15); color:var(--cyan); border-radius:50%; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; flex-shrink:0;}
.report-alt-coord{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--text); min-width:42px;}
.report-alt-refs{flex:1; min-width:0; color:var(--grey); font-size:11px;}
.report-alt-data{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-soft);}
.plan-card{background:rgba(0,210,255,.08); border:1px solid rgba(0,210,255,.3); border-radius:12px; padding:14px 16px; margin-top:14px;}
.plan-h{font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:1px; margin-bottom:8px;}
.plan-line{font-size:13px; color:var(--text-soft); margin-top:5px; line-height:1.5;}
.plan-line strong{color:var(--text); font-weight:600;}
.plan-line.win strong{color:var(--foam);}

/* ---------- Score sliders ---------- */
.score-row{display:grid; grid-template-columns:30px 1fr 50px; align-items:center; gap:12px; margin-bottom:10px;}
.score-row input[type=range]{width:100%; -webkit-appearance:none; background:transparent;}
.score-row input[type=range]::-webkit-slider-runnable-track{height:8px; background:rgba(255,255,255,.08); border-radius:4px;}
.score-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--cyan); margin-top:-6px; box-shadow:0 0 0 3px rgba(0,210,255,.18);}
.score-val{font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:right; font-size:15px;}

/* ---------- Empty ---------- */
.empty{text-align:center; padding:40px 20px; color:var(--grey);}

/* ---------- Tablet landscape (≥1024px, landscape) ---------- */
@media (min-width:1024px){
  .app{flex-direction:column;}
  .topbar{padding:14px 24px;}
  .brand{font-size:14px;}
  .screen{padding:20px 24px 32px; max-width:1280px; width:100%; margin:0 auto;}
  .screen.observe{display:grid; grid-template-columns:minmax(440px, 1fr) minmax(520px, 1.05fr); gap:20px; align-items:start;}
  .screen.observe > .section:first-of-type{grid-column:1; grid-row:1;}
  .screen.observe > .map-wrap{grid-column:2; grid-row:1 / span 2; position:sticky; top:80px; max-height:calc(100vh - 100px); display:flex; align-items:center;}
  .screen.observe > .map-wrap svg{max-height:calc(100vh - 100px); width:100%; height:auto; max-width:none;}
  .screen.observe > .section:last-of-type{grid-column:1; grid-row:2;}
  .screen.setup, .screen.report{max-width:780px;}
  .cat{padding:18px 6px;}
  .cat-lbl{font-size:13px;}
  .cat-num{font-size:28px; margin-top:6px;}
  .tool{padding:11px 4px; font-size:11px;}
  .tool svg{width:18px; height:18px;}
  .timer-big{font-size:52px;}
  .timer-stop{font-size:14px; padding:10px 18px;}
}
@media (min-width:1280px){
  .screen.observe{grid-template-columns:minmax(480px, 1fr) minmax(620px, 1.15fr);}
}

/* Hide scrollbar */
.recent::-webkit-scrollbar{width:5px;}
.recent::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1); border-radius:5px;}

/* SVG cell highlight on tap */
.cell-hit{fill:rgba(0,210,255,.18); transition:opacity .2s; pointer-events:none;}

/* Toast */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--cyan); color:var(--text); padding:10px 18px; border-radius:24px; font-size:13px; font-weight:600; z-index:500; box-shadow:0 6px 24px rgba(0,0,0,.4); animation:toastIn .3s ease-out;}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}

/* Box breathing screen */
.breath-screen{position:fixed; inset:0; background:radial-gradient(ellipse at center, #0a3a5c 0%, #021126 70%, #000a18 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:900; padding:24px;}
.breath-intro{font-family:'Instrument Serif',serif; font-style:italic; font-size:22px; color:var(--text); text-align:center; line-height:1.4; max-width:480px; margin-bottom:28px; opacity:.95;}
.breath-circle-wrap{position:relative; width:240px; height:240px; display:flex; align-items:center; justify-content:center;}
.breath-circle{position:absolute; width:120px; height:120px; border-radius:50%; background:rgba(0,210,255,.12); border:2px solid rgba(0,210,255,.55); transition:transform 4s cubic-bezier(.5,.0,.5,1), background 4s ease, border-color 4s ease;}
.breath-circle.in{transform:scale(1.9); background:rgba(34,211,238,.25); border-color:#22D3EE;}
.breath-circle.hold{transform:scale(1.9); background:rgba(34,211,238,.18); border-color:#22D3EE;}
.breath-circle.out{transform:scale(1); background:rgba(0,210,255,.12); border-color:rgba(0,210,255,.55);}
.breath-circle.holdout{transform:scale(1); background:rgba(0,210,255,.08); border-color:rgba(0,210,255,.4);}
.breath-phase{position:absolute; font-family:'Archivo',sans-serif; font-weight:300; font-size:24px; color:var(--text); letter-spacing:2px; text-transform:uppercase; pointer-events:none;}
.breath-meta{margin-top:32px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-soft); letter-spacing:1.5px;}
.breath-skip{margin-top:24px; font-size:12px; color:var(--text-soft); padding:8px 18px; border:1px solid var(--border2); border-radius:20px; transition:all .15s;}
.breath-skip:hover{color:var(--text); border-color:var(--text-soft);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ════════════════════════════════════════════════════════════════════
   VENUE SCOUT · TSS — standalone v1
   Una herramienta de análisis de spots para coach/atleta de surf comp.
   Estado en localStorage. Sin red. Funciona offline en la beach.
   ════════════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'tss_venue_scout_v1';
const GRID_ROWS = 17;
const GRID_COLS = 15;
const ROW_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R'].slice(0, GRID_ROWS);

/* Catálogo de hazards. Cada uno tiene: id (persistente), label, svg (paths Lucide-style
   dentro de un viewBox 24×24), color, cat (agrupación en el modal). El svg se renderiza
   escalado dentro de un círculo del color en el mapa. */
const HAZARDS = [
  { id:'rip',      label:'Corriente',    cat:'Peligros físicos',   color:'#00D2FF', directional:true, svg:'<line x1="12" y1="21" x2="12" y2="6"/><polyline points="6 12 12 6 18 12"/><polyline points="6 18 12 12 18 18"/>' },
  { id:'rocks',    label:'Piedras',      cat:'Peligros físicos',   color:'#B8CCDF', svg:'<ellipse cx="7" cy="17" rx="4.5" ry="3.5"/><ellipse cx="15" cy="13" rx="6" ry="4.5"/><ellipse cx="20" cy="18" rx="3" ry="2.5"/>' },
  { id:'coral',    label:'Coral / fondo',cat:'Peligros físicos',   color:'#FCA5A5', svg:'<path d="M12 22V10"/><path d="M12 14c-2-2-4-2-5 0"/><path d="M12 14c2-2 4-2 5 0"/><path d="M12 18c-2-2-3.5-2-5 0"/><path d="M12 18c2-2 3.5-2 5 0"/><circle cx="12" cy="8" r="2"/>' },
  { id:'danger',   label:'Peligro',      cat:'Peligros físicos',   color:'#F59E0B', svg:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
  { id:'crowd',    label:'Crowd',        cat:'Otros humanos',      color:'#A855F7', svg:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
  { id:'judges',   label:'Jueces',       cat:'Otros humanos',      color:'#00D2FF', svg:'<path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9"/><path d="M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z"/>' },

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowMs(){ return Date.now(); }
function fmtMMSS(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtHM(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60); const sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
function fmtClock(d){ d=new Date(d); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function colToLetter(c){ /* placeholder, columnas siguen siendo numéricas */ return c; }
function rowToLetter(r){ return ROW_LETTERS[r-1] || '?'; }
function pointToCell(pt){
  if(!pt) return null;
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;
  const col = Math.max(1, Math.min(GRID_COLS, Math.floor(pt.x / cellW) + 1));
  const row = Math.max(1, Math.min(GRID_ROWS, Math.floor(pt.y / cellH) + 1));
  return rowToLetter(row) + col;
}
function coordLbl(w){ return rowToLetter(w.gridRow)+w.gridCol; }

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn(e); } }
function load(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(!s) return;
    const parsed = JSON.parse(s);
    if(!parsed || !parsed.screen) return;
    // Migración v1 → v1.1: condiciones de string a slider numérico
    const c = parsed.config && parsed.config.conditions;
    if(c){
      if(c.size !== undefined && c.sizeFt === undefined){
        const m = String(c.size).match(/([\d.]+)/);
        const meters = m ? parseFloat(m[1]) : 1.5;
        c.sizeFt = Math.max(1, Math.min(12, Math.round(meters * 3.28)));
        delete c.size;
      }
      if(c.tide !== undefined && c.tideLevel === undefined){
        const tideMap = { 'baja':10, 'media':50, 'alta':90 };
        c.tideLevel = tideMap[c.tide] !== undefined ? tideMap[c.tide] : 50;
        c.tideDir = c.tide === 'subiendo' ? 'subiendo' : c.tide === 'bajando' ? 'bajando' : 'parada';
        delete c.tide;
      }
      if(c.sizeFt === undefined) c.sizeFt = 5;
      if(c.tideLevel === undefined) c.tideLevel = 60;
      if(c.tideDir === undefined) c.tideDir = 'bajando';
    }
    // Migración v1.4 → v1.5: agregar map.hazards si no existe
    if(parsed.map && !Array.isArray(parsed.map.hazards)) parsed.map.hazards = [];
    // Migración v1.5 → v1.6: modo de análisis + perfil del surfista
    if(parsed.config){
      if(!parsed.config.mode) parsed.config.mode = 'comp';
      if(!parsed.config.surferProfile) parsed.config.surferProfile = { name:'', belt:null };
      const sp = parsed.config.surferProfile;
      // Migración v1.7 → v1.8: colapsar el perfil a solo name+belt. Los campos
      // level/focus/intention/goal/conditionsMatch/hazards se descartan (el belt
      // ya lleva implícito el nivel según método TSS). Los hazards del reporte
      // vienen de state.map.hazards, no del setup.
      if(sp.belt === undefined) sp.belt = null;
      ['level','focus','intention','goal','conditionsMatch','hazards','concerns'].forEach(k => { if(k in sp) delete sp[k]; });
    }
    state = parsed;
  } catch(e){ console.warn('load() failed', e); }
}

function sizeLabel(ft){
  ft = Number(ft) || 0;
  let qual = '';
  if(ft<=1.5) qual = 'ankle';
  else if(ft<=2.5) qual = 'knee';
  else if(ft<=3.5) qual = 'waist';
  else if(ft<=5) qual = 'chest';
  else if(ft<=7) qual = 'overhead';
  else if(ft<=10) qual = 'double overhead';
  else qual = 'XXL';
  return `${ft} ft · ${qual}`;
}
function tideLabel(level, dir){
  level = Number(level)||0;
  let where = '';
  if(level<=12) where = 'baja';
  else if(level<=30) where = 'media-baja';
  else if(level<=45) where = 'media';
  else if(level<=60) where = 'media';
  else if(level<=80) where = 'media-alta';
  else if(level<=92) where = 'casi alta';
  else where = 'alta';
  return dir==='parada' ? `${where} (parada)` : `${where} ${dir}`;
}

/* ════════════════════════════════════════════════════════════════════
   BOX BREATHING · 4-4-4-4 × 4 ciclos · 64s total
   Antes de observar: calmar sistema nervioso, abrir visión periférica
   ════════════════════════════════════════════════════════════════════ */
function startBreathingThenObserve(){
  if(!state.config.spotName.trim()){ toast('Poné un nombre al spot'); return; }
  showBreathingScreen();
}
function showBreathingScreen(){
  let scr = document.getElementById('breathScreen'); if(scr) scr.remove();
  scr = document.createElement('div');
  scr.id = 'breathScreen';
  scr.className = 'breath-screen';
  scr.innerHTML = `
    <div class="breath-intro">Es hora de conectar con el aquí y ahora · sentí el océano antes de leerlo</div>
    <div class="breath-circle-wrap">
      <div class="breath-circle" id="breathCircle"></div>
      <div class="breath-phase" id="breathPhase">Listo</div>
    </div>
    <div class="breath-meta" id="breathMeta">Ciclo 1 de 4 · 4-4-4-4</div>
    <button class="breath-skip" onclick="endBreathing(false)">Saltar →</button>
  `;
  document.body.appendChild(scr);
  // Empezamos después de 500ms para que la pantalla aparezca antes de la primera inhalación
  setTimeout(()=> runBreathingCycle(1), 500);
}
let _breathTimers = [];
function runBreathingCycle(cycle){
  if(cycle > 4){ endBreathing(true); return; }
  const meta = document.getElementById('breathMeta');
  if(meta) meta.textContent = `Ciclo ${cycle} de 4 · 4-4-4-4`;
  const phases = [
    { lbl:'Inhalá', cls:'in',      ms:4000 },
    { lbl:'Mantené', cls:'hold',    ms:4000 },
    { lbl:'Exhalá', cls:'out',     ms:4000 },
    { lbl:'Mantené', cls:'holdout', ms:4000 },
  ];
  let elapsed = 0;
  phases.forEach((p, i) => {
    const t = setTimeout(()=>{
      const c = document.getElementById('breathCircle');
      const lbl = document.getElementById('breathPhase');
      if(c){ c.classList.remove('in','hold','out','holdout'); c.classList.add(p.cls); }
      if(lbl) lbl.textContent = p.lbl;
    }, elapsed);
    _breathTimers.push(t);
    elapsed += p.ms;
  });
  const nextT = setTimeout(()=> runBreathingCycle(cycle+1), elapsed);
  _breathTimers.push(nextT);
}
function endBreathing(completed){
  _breathTimers.forEach(t => clearTimeout(t));
  _breathTimers = [];
  const scr = document.getElementById('breathScreen'); if(scr) scr.remove();
  if(completed) toast('🌊 Listo · conectado');
  // Arranca observación
  if(!state.timer.startedAt){
    state.timer.startedAt = nowMs();
    state.timer.durationMs = state.config.durationMin * 60 * 1000;
  }
  state.screen = 'observe';
  save(); render();
  startTimerLoop();
}

let _timerInterval = null;
function startTimerLoop(){
  if(_timerInterval) clearInterval(_timerInterval);
  _timerInterval = setInterval(()=>{
    if(state.screen !== 'observe') return;
    if(state.timer.finished || state.timer.paused) return;
    const el = document.getElementById('timerDisplay');
    if(!el) return;
    const remaining = state.timer.startedAt + state.timer.durationMs - nowMs();
    el.textContent = fmtMMSS(remaining);
    if(remaining < 60000) el.classList.add('timer-warn'); else el.classList.remove('timer-warn');
    const elapsed = nowMs() - state.timer.startedAt;
    const subEl = document.getElementById('timerSub');
    if(subEl) subEl.textContent = `restante · ${fmtMMSS(elapsed)} transc.`;
    if(remaining <= 0){
      state.timer.finished = true;
      save();
      toast('⏰ Análisis terminado');
      goToReport();
    }
  }, 250);
}

function modeHint(mode){
  switch(mode){
    case 'mejor': case 'media': case 'otra': return state.rapidMode
      ? `tap el mapa donde salió la ola · después le asignás score 1-10 y se clasifica sola`
      : `tap una celda del mapa para plantar pin ${mode.toUpperCase()} con timestamp`;
    case 'line-out': return state.pendingLineStart ? 'tap el segundo punto de la línea OUTSIDE' : 'tap el primer punto de la línea OUTSIDE';
    case 'line-in': return state.pendingLineStart ? 'tap el segundo punto de la línea INSIDE' : 'tap el primer punto de la línea INSIDE';
    case 'line-ori': return state.pendingLineStart ? 'tap el segundo punto de la línea ORILLA' : 'tap el primer punto de la línea ORILLA';
    case 'ref': return 'tap donde quieras plantar la referencia (palmera, casa, poste...)';
    case 'erase': return 'tap un pin para borrarlo';
    case 'draw': return 'dibujá con el dedo sobre la cuadrícula (esbozá orilla, banco, lineup...)';
    case 'predict': return '🎯 tap la celda donde predecís que sale la PRÓXIMA mejor';
    case 'entry': return 'tap el punto por donde el atleta ENTRA al agua (canal, orilla, etc.)';
    case 'exit': return 'tap el punto por donde el atleta SALE del agua después de la ola';
  }
  if(typeof mode === 'string' && mode.startsWith('hazard-')){
    const h = HAZARD_MAP[mode.slice(7)];
    if(!h) return '';
    if(h.directional){
      return state.pendingRipStart
        ? `tap el DESTINO de la ${h.label.toLowerCase()} (hacia dónde fluye)`
        : `tap el ORIGEN de la ${h.label.toLowerCase()} (dos taps: origen → destino)`;
    }
    return `tap el mapa donde va: ${h.label}`;
  }
  return '';
}

      ${ps.hit} aciertos · ${ps.near} cerca · ${ps.tried} intentos · <strong style="color:#22D3EE;">${accuracy}%</strong>

function checkPredictionAgainst(col, row){
  if(!state.activePrediction) return;
  const p = state.activePrediction;
  const dist = Math.max(Math.abs(p.col - col), Math.abs(p.row - row));
  state.predictionStats = state.predictionStats || { tried:0, hit:0, near:0 };
  state.predictionStats.tried++;
  if(dist === 0){
    state.predictionStats.hit++;
    toast(`🎯 ¡ACERTASTE ${rowToLetter(row)}${col}! Estás leyendo el mar.`, 2800);
  } else if(dist <= 1){
    state.predictionStats.near++;
    toast(`Cerca · predijiste ${rowToLetter(p.row)}${p.col} · salió ${rowToLetter(row)}${col} (a 1 celda)`, 2800);
  } else {
    toast(`Lejos · predijiste ${rowToLetter(p.row)}${p.col} · salió ${rowToLetter(row)}${col}`, 2800);
  }
  state.activePrediction = null;
}
function renderRecentItem(w){
  const colorMap = { mejor:'var(--gold-text)', media:'var(--silver-text)', otra:'var(--bronze-text)' };
  const c = colorMap[w.category];
  const dirChip = w.direction === 'L'
    ? `<span style="font-size:10px;color:#22D3EE;font-weight:700;">IZQ→</span>`
    : w.direction === 'R'
    ? `<span style="font-size:10px;color:#FBBF24;font-weight:700;">←DER</span>`
    : '';
  return `<div class="recent-item" onclick="openEditWaveModal('${w.id}')" style="cursor:pointer;">
    <span class="mono" style="color:var(--grey);font-size:10px;min-width:26px;">#${waveSeq(w)}</span>
    <span style="color:${c};font-weight:700;">● ${w.category==='pending'?'SIN SCORE':w.category.toUpperCase()}</span>
    <span class="recent-coord">${coordLbl(w)}</span>
    ${dirChip}
    ${w.score?`<span style="font-size:10px;background:rgba(255,255,255,.08);color:var(--text);padding:1px 6px;border-radius:12px;font-weight:700;">${w.score}/10</span>`:''}
    <span class="recent-time mono">+${fmtMMSS(w.ts)}</span>
    <button onclick="event.stopPropagation();removeWave('${w.id}')" style="color:var(--coral);font-size:14px;padding:0 4px;line-height:1;" title="Borrar">×</button>
  </div>`;
}

function countByCategory(){
  const c = {mejor:0,media:0,otra:0,ola:0};
  state.waves.forEach(w=>{ if(c[w.category]!==undefined) c[w.category]++; });
  return c;
}

/* ════════════════════════════════════════════════════════════════════
   MAP RENDER (SVG)
   ════════════════════════════════════════════════════════════════════ */
const MAP_W = 600, MAP_H = 600;
// Top-2 zonas por potencial (proxy: promedio de scores × cantidad) → A y B
function waitSpots(){
  const zs = computeZonesV2();
  if(!zs.length) return [];
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  return zs.slice().sort((a,b)=> (avg(b.scores)*b.waves.length) - (avg(a.scores)*a.waves.length))
    .slice(0,2).map((z,i)=>({ col:z.col, row:z.row, label: i===0?'A':'B' }));
}
function renderMapSVG(opts){
  // 600x600 SVG (responsive via viewBox). Grid uniform.
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;

  // Background: foto si hay, o gradient Ocean Tropical
  const hasPhoto = !!state.map.photoDataUrl;
  let spotsLayer = '';
  if(opts && opts.waitSpots){
    const cw = MAP_W / GRID_COLS, ch = MAP_H / GRID_ROWS;
    waitSpots().forEach(sp => {
      const cx=(sp.col-0.5)*cw, cy=(sp.row-0.5)*ch;
      const col = sp.label==='A' ? '#FFD166' : '#B8CCDF';
      spotsLayer += `<g style="pointer-events:none;">

        <circle cx="${cx}" cy="${cy}" r="17" fill="rgba(4,20,31,.85)" stroke="${col}" stroke-width="2.5"/>
        <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="800" fill="${col}" font-family="Archivo,sans-serif">${sp.label}</text>

  }
  const bg = `<defs>
    <linearGradient id="oc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>

      <stop offset="88%" stop-color="#1a2842"/>
      <stop offset="100%" stop-color="#2a3a2e"/>

  </defs>
  ${hasPhoto
    ? `<rect width="${MAP_W}" height="${MAP_H}" fill="#021126"/><image id="mapPhoto" href="${state.map.photoDataUrl}" x="0" y="0" width="${MAP_W}" height="${MAP_H}" preserveAspectRatio="xMidYMid slice" opacity="${state.map.photoOpacity||0.7}" ${photoTransform()}/>`
    : `<rect width="${MAP_W}" height="${MAP_H}" fill="url(#oc)"/>`}`;

  // Sin línea decorativa — fondo limpio
  const wave = '';

  // Trazos libres
  const freehandPaths = (state.map.freehand||[]).map((p,i)=>
    `<path class="freehand-path" data-fh="${i}" d="${p.d}" stroke="${p.color||'#ffffff'}" stroke-width="${p.width||2.8}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" style="pointer-events:${state.activeMode==='erase'?'auto':'none'};cursor:${state.activeMode==='erase'?'pointer':'default'};"/>`
  ).join('') + '<path id="drawPreview" d="" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" style="pointer-events:none;"/>';

  // Líneas de grilla en fucsia
  let grid = '<g stroke="rgba(0,210,255,0.12)" stroke-width="0.7">';
  for(let r=1; r<GRID_ROWS; r++) grid += `<line x1="0" y1="${r*cellH}" x2="${MAP_W}" y2="${r*cellH}"/>`;
  for(let c=1; c<GRID_COLS; c++) grid += `<line x1="${c*cellW}" y1="0" x2="${c*cellW}" y2="${MAP_H}"/>`;
  grid += '</g>';

  // Labels en chips oscuros · letras cyan eléctrico · números amarillo eléctrico
  const chipBg = 'rgba(0,0,0,0.7)';
  let labels = '<g font-family="IBM Plex Mono,monospace" font-weight="700">';
  // Letras (eje vertical, A-Q)
  for(let r=1; r<=GRID_ROWS; r++){
    const y = (r-0.5)*cellH;
    labels += `<rect x="2" y="${y-9}" width="20" height="18" rx="4" fill="${chipBg}"/>`;
    labels += `<text x="12" y="${y+5}" text-anchor="middle" font-size="12" fill="#22D3EE">${rowToLetter(r)}</text>`;
  }
  // Números (eje horizontal, 1-15)

    labels += `<rect x="${x-w/2}" y="${MAP_H-22}" width="${w}" height="18" rx="4" fill="${chipBg}"/>`;

  // Líneas de referencia (outside/inside/orilla)
  let refLines = '';
  if(state.map.lines.outside) refLines += renderLine(state.map.lines.outside, '#A855F7', 'OUTSIDE');
  if(state.map.lines.inside)  refLines += renderLine(state.map.lines.inside,  '#F59E0B', 'INSIDE');

  if(state.pendingLineStart){

  }

  // Entry / Exit points (verde para entrada, coral para salida)
  let entryExit = '';
  if(state.map.entryPoint){
    const ep = state.map.entryPoint;
    // arrow-up-from-line · flecha sube desde la orilla hacia el mar (entra al agua)
    entryExit += `<g class="entry-pin" data-kind="entry" style="cursor:pointer;">

      </g>

  }
  if(state.map.exitPoint){

    // arrow-down-to-line · flecha baja desde el mar y llega a la orilla (sale del agua)
    entryExit += `<g class="exit-pin" data-kind="exit" style="cursor:pointer;">
      <circle cx="${xp.x}" cy="${xp.y}" r="16" fill="rgba(252,165,165,0.25)" stroke="#FCA5A5" stroke-width="3"/>
      <g transform="translate(${xp.x-10} ${xp.y-10})" style="pointer-events:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FCA5A5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17V3"/>
          <path d="m6 11 6 6 6-6"/>
          <path d="M19 21H5"/>
        </svg>
      </g>
      <rect x="${xp.x-20}" y="${xp.y+18}" width="40" height="16" rx="4" fill="rgba(0,0,0,0.75)"/>
      <text x="${xp.x}" y="${xp.y+30}" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="700">SALIDA</text>
    </g>`;
  }

  // Referencias en tierra
  let refs = '';
  state.map.refs.forEach(r=>{
    refs += `<g class="ref-pin" data-id="${r.id}">
      <circle cx="${r.x}" cy="${r.y}" r="13" fill="#00D2FF" stroke="#fff" stroke-width="2.5"/>
      <text x="${r.x}" y="${r.y+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">${esc(r.label.charAt(0).toUpperCase())}</text>
      <rect x="${r.x-30}" y="${r.y+14}" width="60" height="16" rx="4" fill="rgba(0,0,0,0.55)"/>
      <text x="${r.x}" y="${r.y+26}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${esc(r.label.slice(0,12))}</text>
    </g>`;
  });

  // Pins de olas, agrupados por celda+categoría
  const grouped = groupWavesByCell();
  let pins = '';
  Object.values(grouped).forEach(g=>{
    const cx = (g.col - 0.5) * cellW;
    const cy = (g.row - 0.5) * cellH;
    const colors = { mejor:'#F59E0B', media:'#9CA3AF', otra:'#B45309', ola:'#34D399' };
    const c = colors[g.category];
    const baseR = g.category==='mejor' ? 16 : g.category==='media' ? 14 : g.category==='ola' ? 15 : 12;
    const r = baseR + Math.min(8, (g.count-1) * 2);
    // Dirección dominante del grupo (solo si ≥70% de las olas marcadas tienen una dirección)
    const dirCounts = { L:0, R:0, none:0 };
    g.waves.forEach(w => {
      if(w.direction === 'L') dirCounts.L++;
      else if(w.direction === 'R') dirCounts.R++;
      else dirCounts.none++;
    });
    const totalDir = dirCounts.L + dirCounts.R;
    let dom = null;
    if(totalDir > 0){
      if(dirCounts.L / totalDir >= 0.7) dom = 'L';
      else if(dirCounts.R / totalDir >= 0.7) dom = 'R';
      else if(dirCounts.L > 0 && dirCounts.R > 0) dom = 'mixed';
    }
    const label = g.count > 1 ? '×'+g.count : '1';
    // Convención surf: ola IZQUIERDA (surfista) se VE visualmente yendo a la derecha desde la playa.
    // Por eso la flecha visual del pin se invierte respecto al nombre.
    const arrow = dom === 'L' ? '→' : dom === 'R' ? '←' : dom === 'mixed' ? '⇄' : '';
    const displayText = arrow ? `${arrow} ${label}` : label;
    pins += `<g class="wave-pin" data-cell="${g.col}-${g.row}-${g.category}" style="cursor:pointer;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2.5"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="${displayText.length>2?10:11}" font-weight="700" fill="#0A1628">${displayText}</text>
    </g>`;
  });

  // Pins PENDING (modo rápido tap-first · gris con "?", clickeables para categorizar)
  let pendingPins = '';
  pendingWaves().forEach(w => {
    const cx = (typeof w.px==='number') ? w.px : (w.gridCol - 0.5) * cellW;
    const cy = (typeof w.py==='number') ? w.py : (w.gridRow - 0.5) * cellH;
    pendingPins += `<g class="pending-pin" data-wave-id="${w.id}" style="cursor:pointer;">
      <circle cx="${cx}" cy="${cy}" r="14" fill="rgba(180,180,180,0.35)" stroke="#B8CCDF" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">?</text>
    </g>`;
  });

  // Pin de predicción pendiente (cyan punteado pulsante)
  let predictionPin = '';
  if(state.activePrediction){
    const p = state.activePrediction;
    const pcx = (p.col - 0.5) * cellW;
    const pcy = (p.row - 0.5) * cellH;
    predictionPin = `<g style="pointer-events:none;">
      <circle cx="${pcx}" cy="${pcy}" r="18" fill="rgba(34,211,238,0.18)" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="4,3">
        <animate attributeName="r" values="18;22;18" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="${pcx}" y="${pcy+4}" text-anchor="middle" font-size="14" font-weight="700" fill="#22D3EE">🎯</text>
    </g>`;
  }
  // Hazards (corrientes, piedras, crowd, etc)
  // opts.enumerateHazards: si true, agrega badge numérico ①②③ al lado de cada pin
  // para conectar visualmente con la lista de EVITAR del reporte.
  const enumerate = opts && opts.enumerateHazards;
  let hazards = '';
  (state.map.hazards||[]).forEach((h, idx) => {
    const meta = HAZARD_MAP[h.type];
    if(!meta) return;
    // Si el hazard tiene angle (ej. corriente direccional), rotamos el icono alrededor del centro.
    const rot = (typeof h.angle === 'number') ? ` transform="rotate(${h.angle} 12 12)"` : '';
    hazards += `<g class="hazard-pin" data-id="${h.id}" style="cursor:pointer;pointer-events:all;">
      <circle cx="${h.x}" cy="${h.y}" r="15" fill="${meta.color}22" stroke="${meta.color}" stroke-width="2"/>
      <g transform="translate(${h.x-10} ${h.y-10})">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${meta.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><g${rot}>${meta.svg}</g></svg>
      </g>
      ${enumerate ? `<g style="pointer-events:none;">
        <circle cx="${h.x+13}" cy="${h.y-13}" r="9" fill="#0A1628" stroke="${meta.color}" stroke-width="2"/>
        <text x="${h.x+13}" y="${h.y-10}" text-anchor="middle" font-size="11" font-weight="800" fill="${meta.color}" font-family="IBM Plex Mono,monospace">${idx+1}</text>
      </g>` : ''}
    </g>`;
  });
  // Preview del origen de corriente en curso (durante el 2do tap)
  if(state.pendingRipStart){
    const p = state.pendingRipStart;
    hazards += `<g style="pointer-events:none;">
      <circle cx="${p.x}" cy="${p.y}" r="10" fill="rgba(0,210,255,0.2)" stroke="#00D2FF" stroke-width="2" stroke-dasharray="3,3">
        <animate attributeName="r" values="10;14;10" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="${p.x}" y="${p.y-16}" text-anchor="middle" font-size="10" fill="#00D2FF" font-weight="700">tap destino →</text>
    </g>`;
  }
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    ${bg}${wave}${grid}${labels}${refLines}${freehandPaths}${entryExit}${refs}${hazards}${pins}${pendingPins}${predictionPin}${spotsLayer}
  </svg>`;
}
function renderLine(line, color, label){
  return `<g>
    <line x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" stroke="${color}" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>
    <text x="${Math.max(line.x1,line.x2)-4}" y="${Math.min(line.y1,line.y2)-6}" text-anchor="end" font-size="13" font-weight="700" fill="${color}">${label}</text>
  </g>`;
}
function groupWavesByCell(){
  const g = {};
  state.waves.forEach(w=>{
    if(w.category === 'pending') return;  // pending no cuentan hasta categorizar
    const k = `${w.gridCol}-${w.gridRow}-${w.category}`;
    if(!g[k]) g[k] = { col:w.gridCol, row:w.gridRow, category:w.category, count:0, waves:[] };
    g[k].count++; g[k].waves.push(w);
  });
  return g;
}
function pendingWaves(){
  return state.waves.filter(w => w.category === 'pending');
}

/* ════════════════════════════════════════════════════════════════════
   MAP INTERACTION
   ════════════════════════════════════════════════════════════════════ */
function attachMapHandlers(){
  const svg = document.querySelector('#mapWrap svg'); if(!svg) return;
  svg.addEventListener('click', handleMapTap);
  svg.addEventListener('pointerdown', handleDrawStart);
  svg.addEventListener('pointermove', handleDrawMove);
  svg.addEventListener('pointerup', handleDrawEnd);
  svg.addEventListener('pointercancel', handleDrawEnd);
  svg.addEventListener('pointerleave', handleDrawEnd);
}

let _drawing = false;
let _drawingPath = '';
function svgCoordsFromEvent(e){
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const sx = MAP_W / rect.width;
  const sy = MAP_H / rect.height;
  return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
}
function handleDrawStart(e){
  if(state.activeMode !== 'draw') return;
  e.preventDefault();
  const {x,y} = svgCoordsFromEvent(e);
  _drawing = true;
  _drawingPath = `M ${x.toFixed(1)} ${y.toFixed(1)}`;
  const prev = document.getElementById('drawPreview');
  if(prev) prev.setAttribute('d', _drawingPath);
  e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
}
function handleDrawMove(e){
  if(!_drawing) return;
  e.preventDefault();
  const {x,y} = svgCoordsFromEvent(e);
  _drawingPath += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  const prev = document.getElementById('drawPreview');
  if(prev) prev.setAttribute('d', _drawingPath);
}
function handleDrawEnd(e){
  if(!_drawing) return;
  _drawing = false;
  // Solo guardar si tiene al menos un L (más de 1 punto)
  if(_drawingPath.includes(' L ')){
    state.map.freehand = state.map.freehand || [];
    state.map.freehand.push({ d: _drawingPath, color: '#ffffff', width: 2.8 });
    save();
    render();
  } else {
    const prev = document.getElementById('drawPreview');
    if(prev) prev.setAttribute('d', '');
  }
  _drawingPath = '';
}

function triggerPhotoUpload(){
  const inp = document.getElementById('photoInput');
  if(inp) inp.click();
}
function handlePhotoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 6 * 1024 * 1024){
    if(!confirm('La foto pesa '+(file.size/1024/1024).toFixed(1)+'MB. Puede ser lenta. ¿Continuar?')) return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    state.map.photoDataUrl = e.target.result;
    if(!state.map.photoOpacity) state.map.photoOpacity = 0.7;
    save();
    render();
    toast('Foto agregada');
  };
  reader.onerror = () => toast('Error leyendo la foto');
  reader.readAsDataURL(file);
  input.value = '';  // reset para poder re-subir la misma foto
}
function nudgePhoto(dx,dy){
  state.map.photoX = (state.map.photoX||0) + dx*24;
  state.map.photoY = (state.map.photoY||0) + dy*24;
  save(); render();
}
// translate+scale centrado para que el zoom no "escape" la foto
function photoTransform(){
  const sc = state.map.photoScale||1, cx=MAP_W/2, cy=MAP_H/2;
  const tx = (state.map.photoX||0) + cx*(1-sc);
  const ty = (state.map.photoY||0) + cy*(1-sc);
  return `transform="translate(${tx} ${ty}) scale(${sc})"`;
}
function updatePhotoOpacity(){
  const img = document.getElementById('mapPhoto');
  if(img) img.setAttribute('opacity', state.map.photoOpacity || 0.7);
  const pct = document.getElementById('photoPct');
  if(pct) pct.textContent = Math.round((state.map.photoOpacity||0.7)*100)+'%';
}
function handleMapTap(e){
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = MAP_W / rect.width;
  const scaleY = MAP_H / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  if(x<0||y<0||x>MAP_W||y>MAP_H) return;

  const mode = state.activeMode;

  if(mode==='mejor' || mode==='media' || mode==='otra'){
    const cellW = MAP_W / GRID_COLS;
    const cellH = MAP_H / GRID_ROWS;
    let col, row;
    // Si tap sobre pin PENDING → abrir modal para categorizar
    const hitPendingPin = e.target.closest('.pending-pin');
    if(hitPendingPin){
      categorizePendingModal(hitPendingPin.dataset.waveId);
      return;
    }
    // Si tap sobre pin existente categorizado, plantamos OTRA ola en la MISMA celda
    const hitPin = e.target.closest('.wave-pin');
    if(hitPin){
      const [c,r] = hitPin.dataset.cell.split('-');
      col = parseInt(c); row = parseInt(r);
    } else {
      col = Math.floor(x / cellW) + 1;
      row = Math.floor(y / cellH) + 1;
      if(col<1||col>GRID_COLS||row<1||row>GRID_ROWS) return;
    }
    // Modo comp score-only: SIEMPRE tap-first · el score se asigna después y clasifica solo.
    plantPendingWave(col, row, x, y);
    return;
  }

  // Modo SESIÓN LIBRE: un solo pin genérico 'ola'
  if(mode==='ola'){
    const cellW = MAP_W / GRID_COLS;
    const cellH = MAP_H / GRID_ROWS;
    const hitPin = e.target.closest('.wave-pin');
    let col, row;
    if(hitPin){
      const [c,r] = hitPin.dataset.cell.split('-');
      col = parseInt(c); row = parseInt(r);
    } else {
      col = Math.floor(x / cellW) + 1;
      row = Math.floor(y / cellH) + 1;
      if(col<1||col>GRID_COLS||row<1||row>GRID_ROWS) return;
    }
    plantWave(col, row, 'ola');
    return;
  }

  if(mode==='predict'){
    const cellW = MAP_W / GRID_COLS;
    const cellH = MAP_H / GRID_ROWS;
    const col = Math.floor(x / cellW) + 1;
    const row = Math.floor(y / cellH) + 1;
    if(col<1||col>GRID_COLS||row<1||row>GRID_ROWS) return;
    recordPrediction(col, row);
    return;
  }

  if(mode==='line-out' || mode==='line-in' || mode==='line-ori'){
    if(!state.pendingLineStart){
      state.pendingLineStart = {x, y};
      save(); render();
    } else {
      const lineKey = mode==='line-out'?'outside':mode==='line-in'?'inside':'orilla';
      state.map.lines[lineKey] = { x1:state.pendingLineStart.x, y1:state.pendingLineStart.y, x2:x, y2:y };
      state.pendingLineStart = null;
      // Volver al modo MEJOR después de trazar línea
      state.activeMode = 'mejor';
      save(); render();
      toast(`Línea ${lineKey.toUpperCase()} marcada`);
    }
    return;
  }

  if(mode==='ref'){
    openRefNameModal(x, y);
    return;
  }

  if(mode==='entry'){
    state.map.entryPoint = { x, y };
    state.activeMode = 'mejor';
    save(); render();
    toast('Punto de ENTRADA marcado');
    return;
  }

  if(mode==='exit'){
    state.map.exitPoint = { x, y };
    state.activeMode = 'mejor';
    save(); render();
    toast('Punto de SALIDA marcado');
    return;
  }

  if(typeof mode === 'string' && mode.startsWith('hazard-')){
    const hazardId = mode.slice(7);
    const meta = HAZARD_MAP[hazardId];
    // Hazards direccionales (ej. corriente) usan flujo de 2 taps
    if(meta && meta.directional){
      if(!state.pendingRipStart){
        state.pendingRipStart = { x, y, hazardId };
        save(); render();
        toast('Ahora tap el destino de la corriente →');
      } else {
        const ori = state.pendingRipStart;
        const dx = x - ori.x, dy = y - ori.y;
        // atan2(dy,dx) da 0 para vector hacia el este; sumamos 90 porque el
        // chevron por default apunta al norte (0° del rotate).
        const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
        plantHazard(ori.hazardId, ori.x, ori.y, angle);
        state.pendingRipStart = null;
        save(); render();
      }
      return;
    }
    plantHazard(hazardId, x, y);
    return;
  }

  if(mode==='erase'){
    // Tap sobre entry/exit pin → borrar
    if(e.target.closest('.entry-pin')){
      if(confirm('¿Borrar punto de ENTRADA?')){ state.map.entryPoint = null; save(); render(); }
      return;
    }
    if(e.target.closest('.exit-pin')){
      if(confirm('¿Borrar punto de SALIDA?')){ state.map.exitPoint = null; save(); render(); }
      return;
    }
    // Tap sobre trazo libre → borrar ese trazo
    if(e.target.classList && e.target.classList.contains('freehand-path')){
      const idx = parseInt(e.target.dataset.fh);
      if(!isNaN(idx)){
        state.map.freehand.splice(idx, 1);
        save(); render();
        toast('Trazo borrado');
      }
      return;
    }
    // Si tap sobre pin → borrar todo el cluster (con confirm)
    if(e.target.closest('.wave-pin')){
      const cell = e.target.closest('.wave-pin').dataset.cell;
      const [c,r,cat] = cell.split('-');
      const matching = state.waves.filter(w=>w.gridCol==c && w.gridRow==r && w.category==cat);
      if(confirm(`¿Borrar ${matching.length} ola(s) ${cat.toUpperCase()} en ${rowToLetter(parseInt(r))}${c}?`)){
        state.waves = state.waves.filter(w=>!(w.gridCol==c && w.gridRow==r && w.category==cat));
        save(); render();
      }
      return;
    }
    // Tap sobre referencia → borrar
    if(e.target.closest('.ref-pin')){
      const id = e.target.closest('.ref-pin').dataset.id;
      const r = state.map.refs.find(x=>x.id===id);
      if(r && confirm(`¿Borrar referencia "${r.label}"?`)){
        state.map.refs = state.map.refs.filter(x=>x.id!==id);
        save(); render();
      }
      return;
    }
    // Tap sobre hazard → borrar
    if(e.target.closest('.hazard-pin')){
      const id = e.target.closest('.hazard-pin').dataset.id;
      const h = (state.map.hazards||[]).find(x=>x.id===id);
      if(h){
        const meta = HAZARD_MAP[h.type];
        if(confirm(`¿Borrar hazard "${meta?meta.label:h.type}"?`)){
          state.map.hazards = state.map.hazards.filter(x=>x.id!==id);
          save(); render();
        }
      }
      return;
    }
  }
}

/* Auto-clasifica una ola según su score y los scores potenciales del análisis.
   En días perfectos (MEJOR=9), los thresholds suben automáticamente.
   En días malos (MEJOR=5), bajan. La categoría se adapta al día. */
function scoreToCategory(score, scores){
  if(!score || score <= 0) return null;
  // RELATIVO AL DÍA: con 4+ olas puntuadas, los tercios de TUS scores de hoy
  // definen mejor/media/otra. Un 4 puede ser MEJOR en un día flojo.
  const todays = state.waves.filter(w=>typeof w.score==='number' && w.score>0).map(w=>w.score);
  if(todays.length >= 4){
    const sorted = todays.slice().sort((a,b)=>b-a);
    const t1 = sorted[Math.max(0, Math.ceil(sorted.length/3)-1)];
    const t2 = sorted[Math.max(0, Math.ceil(2*sorted.length/3)-1)];
    if(score >= t1) return 'mejor';
    if(score >= t2) return 'media';
    return 'otra';
  }
  scores = scores || (state.closing?.scores || { mejor:8.5, media:6.5, otra:5.0 });
  const midMejorMedia = (scores.mejor + scores.media) / 2;
  const midMediaOtra  = (scores.media + scores.otra) / 2;
  if(score >= midMejorMedia) return 'mejor';
  if(score >= midMediaOtra) return 'media';
  return 'otra';
}
// Re-clasifica TODAS las olas puntuadas (los percentiles cambian con cada score)
function recomputeCategories(){
  state.waves.forEach(w => { if(typeof w.score==='number' && w.score>0) w.category = scoreToCategory(w.score); });

// ── SETS · olas a <60s y ≤2 celdas se agrupan solas ──
const SET_GAP_MS = 60000;
function computeSets(){
  const ws = state.waves.slice().sort((a,b)=>a.ts-b.ts);
  const sets = []; let cur = [];
  for(const w of ws){
    if(!cur.length){ cur=[w]; continue; }
    const last = cur[cur.length-1];
    const near = Math.abs(w.gridCol-last.gridCol)<=2 && Math.abs(w.gridRow-last.gridRow)<=2;
    if((w.ts-last.ts) <= SET_GAP_MS && near) cur.push(w);
    else { if(cur.length>=2) sets.push(cur); cur=[w]; }
  }
  if(cur.length>=2) sets.push(cur);
  return sets;
}
// Insight de patrón: solo habla cuando el patrón SE REPITE (≥2 sets)
function setInsight(){
  const sets = computeSets();
  if(!sets.length) return null;
  const typical = Math.round(sets.reduce((a,s)=>a+s.length,0)/sets.length);
  const scored = sets.filter(st => st.filter(w=>w.score>0).length >= 2);
  let best = null;
  if(scored.length >= 2){
    const counts = {};
    scored.forEach(st => {
      let bi=0, bs=-1;
      st.forEach((w,i)=>{ const sc=w.score||0; if(sc>bs){bs=sc;bi=i;} });
      counts[bi+1]=(counts[bi+1]||0)+1;
    });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if(top && top[1] >= 2) best = { pos:+top[0], n:top[1], total:scored.length };
  }
  return { count: sets.length, typical, best };
}
function ordinal(n){ return n===1?'1ª':n===2?'2ª':n===3?'3ª':n+'ª'; }
function renderSetInsightChip(){
  const si = setInsight();
  if(!si || si.count < 1) return '';
  let txt = `🌀 ${si.count} set${si.count===1?'':'s'} detectado${si.count===1?'':'s'} · ~${si.typical} olas por set`;
  if(si.best) txt += ` · la ${ordinal(si.best.pos)} suele ser la mejor (${si.best.n} de ${si.best.total} sets)`;
  return `<div style="margin-top:8px;padding:9px 12px;background:rgba(0,210,255,.06);border:1px solid rgba(0,210,255,.25);border-radius:12px;font-size:11px;color:var(--text-soft);">${txt}</div>`;
}

/* ════════════════════════════════════════════════════════════════════
   MOTOR TÁCTICO v2 · zonas por vecindad + simulación Monte Carlo
   La premisa: en un heat contás tus 2 mejores olas, no el promedio.
   Por eso no comparamos zonas por score medio — simulamos el heat
   completo miles de veces por estrategia y elegimos la que más
   puntos produce, con probabilidad real de alcanzar el objetivo.
   ════════════════════════════════════════════════════════════════════ */
const WAVE_COST_MIN = 2.5;      // min que consume cada ola surfeada (ride + remada de vuelta al pico)
const MOVE_MIN_PER_CELL = 0.5;  // min de remada por celda de distancia entre zonas
const MC_TRIALS = 1200;         // simulaciones por estrategia

function obsMinutes(){
  const ms = state.timer.finished
    ? ((state.timer.endedAt||nowMs()) - state.timer.startedAt)
    : (nowMs() - (state.timer.startedAt||nowMs()));
  return Math.max(1, ms/60000);
}

function pctile(arr, p){
  const s = [...arr].sort((a,b)=>a-b);
  return s[Math.min(s.length-1, Math.floor(p*s.length))];
}

/* Zonas = clusters de celdas ADYACENTES con olas (vecindad Chebyshev ≤1).
   D7 y D8 son la misma zona si ambas tienen olas — un pico real no respeta
   los bordes de la grilla. */
function computeZonesV2(){
  const done = state.waves.filter(w => w.category !== 'pending');
  if(!done.length) return [];
  const sc = state.closing?.scores || {};
  const estFor = w => w.category==='mejor' ? (sc.mejor||8) : w.category==='media' ? (sc.media||6.5) : (sc.otra||5);
  const byCell = {};
  done.forEach(w => { const k = w.gridCol+'-'+w.gridRow; (byCell[k]=byCell[k]||[]).push(w); });
  const cells = Object.keys(byCell);
  const seen = new Set();
  const zones = [];
  cells.forEach(start => {
    if(seen.has(start)) return;
    const comp = []; const stack = [start]; seen.add(start);
    while(stack.length){
      const c = stack.pop(); comp.push(c);
      const [cc,cr] = c.split('-').map(Number);
      cells.forEach(o => {
        if(seen.has(o)) return;
        const [oc,or] = o.split('-').map(Number);
        if(Math.abs(oc-cc)<=1 && Math.abs(or-cr)<=1){ seen.add(o); stack.push(o); }
      });
    }
    const zw = comp.flatMap(k=>byCell[k]).sort((a,b)=>a.ts-b.ts);
    const top = comp.map(k=>({k, n:byCell[k].length})).sort((a,b)=>b.n-a.n)[0];
    const [tc,tr] = top.k.split('-').map(Number);
    // Score real si lo tiene · estimado por categoría si es ola vieja sin score
    const scores = zw.map(w => (typeof w.score==='number' && w.score>0) ? w.score : estFor(w));
    zones.push({ cells:comp, waves:zw, col:tc, row:tr, scores });
  });
  const tObs = obsMinutes();
  zones.forEach(z => {
    z.n = z.waves.length;
    z.label = rowToLetter(z.row)+z.col;
    z.refs = nearestRefs(z.col, z.row);
    z.ratePerMin = z.n / tObs;
    z.meanIntervalMs = 60000 * tObs / z.n;
    z.avgScore = z.scores.reduce((s,x)=>s+x,0)/z.n;
    z.bestScore = Math.max(...z.scores);
    const desc = [...z.scores].sort((a,b)=>b-a);
    const half = Math.max(1, Math.ceil(desc.length/2));
    z.topHalfAvg = desc.slice(0, half).reduce((s,x)=>s+x,0)/half;  // "potencial de sus mejores"
    const d = {L:0, R:0};
    z.waves.forEach(w => { if(w.direction==='L') d.L++; else if(w.direction==='R') d.R++; });
    const td = d.L + d.R;
    z.dirDominant = td>0 ? (d.L/td>=0.7 ? 'L' : d.R/td>=0.7 ? 'R' : 'mixed') : null;
  });
  // Ranking preliminar: frecuencia × calidad-de-sus-mejores
  zones.sort((a,b) => (b.ratePerMin*b.topHalfAvg) - (a.ratePerMin*a.topHalfAvg));
  return zones;
}

/* Costo de remada entre dos zonas, en minutos, por distancia entre centros. */
function moveCostMin(a, b){
  const cellW = MAP_W/GRID_COLS, cellH = MAP_H/GRID_ROWS;
  const distCells = Math.hypot((a.col-b.col)*cellW, (a.row-b.row)*cellH) / ((cellW+cellH)/2);
  return Math.max(0.5, Math.round(distCells*MOVE_MIN_PER_CELL*2)/2);
}

/* Un heat simulado: las olas llegan a cada zona como proceso de Poisson con
   el ritmo medido; cada ola agarrada consume WAVE_COST_MIN del reloj;
   los scores se sortean de los que el coach anotó en esa zona (bootstrap).
   El puntaje del heat = suma de las 2 mejores olas del trial. */
function simulateStrategy(stints, target, trials){
  let sum = 0, hit = 0;
  const totals = new Array(trials);
  for(let t=0; t<trials; t++){
    const caught = [];
    for(const st of stints){
      if(st.minutes <= 0 || !st.zone.ratePerMin) continue;
      const z = st.zone;
      let clock = 0;
      while(true){
        clock += -Math.log(1-Math.random())/z.ratePerMin;   // llegada exponencial
        if(clock > st.minutes) break;
        caught.push(z.scores[(Math.random()*z.scores.length)|0]);
        clock += WAVE_COST_MIN;
      }
    }
    caught.sort((a,b)=>b-a);
    const tot = (caught[0]||0) + (caught[1]||0);
    totals[t] = tot; sum += tot; if(target>0 && tot>=target) hit++;
  }
  totals.sort((a,b)=>a-b);
  return {
    expected: sum/trials,
    probTarget: target>0 ? hit/trials : null,
    p25: totals[(trials*0.25)|0],
    p75: totals[(trials*0.75)|0],
  };
}

/* Genera y compite estrategias: quedarse en cada zona, o split A→B con el
   cambio al 33% / 50% / 66% del heat (descontando la remada). */
function buildTacticalPlan(zones){
  const T = state.closing.heatDurationMin || 20;
  const target = state.closing.heatObjective || 0;
  const usable = zones.filter(z => z.n >= 2).slice(0, 4);
  if(!usable.length) return null;
  const strategies = [];
  usable.forEach(z => {
    const s = { type:'stay', zones:[z], stints:[{zone:z, minutes:T}] };
    strategies.push(s);
    z._stay = s;   // el ranking de zonas ordena por este valor simulado
  });
  for(let i=0; i<usable.length; i++) for(let j=0; j<usable.length; j++){
    if(i===j) continue;
    const A = usable[i], B = usable[j];
    const mv = moveCostMin(A, B);
    [0.33, 0.5, 0.66].forEach(f => {
      const t1 = Math.round(T*f);
      const t2 = T - t1 - mv;
      if(t2 < 3) return;
      strategies.push({ type:'split', zones:[A,B], t1, mv, stints:[{zone:A, minutes:t1},{zone:B, minutes:t2}] });
    });
  }
  strategies.forEach(s => { s.sim = simulateStrategy(s.stints, target, MC_TRIALS); });
  strategies.sort((a,b) => b.sim.expected - a.sim.expected);
  const best = strategies[0];
  const alt = strategies.find(s => s !== best && (s.zones[0] !== best.zones[0] || s.type !== best.type)) || null;
  const totalWaves = usable.reduce((s,z)=>s+z.n, 0);
  return { T, target, best, alt, usable, lowConfidence: totalWaves < 10 };
}

/* Card ejecutiva del plan táctico: la estrategia ganadora del Monte Carlo,
   en pasos que cualquiera entiende. */
function renderTacticalPlanCard(plan){
  if(!plan){
    return `<section class="section" style="border:1.5px dashed var(--amber);background:rgba(245,158,11,.05);">
      <div style="font-size:13px;color:var(--amber);text-align:center;line-height:1.5;">Marcá al menos 2 olas con score en una misma zona para generar el plan del heat.</div>
    </section>`;
  }
  const b = plan.best;
  const target = plan.target;
  const prob = b.sim.probTarget;
  const statusColor = prob===null ? 'var(--cyan)' : prob>=0.6 ? 'var(--foam)' : prob>=0.35 ? 'var(--amber)' : 'var(--coral)';
  const refStr = z => z.refs && z.refs.length ? ` (${esc(z.refs[0].label)})` : '';
  const steps = [];
  if(b.type === 'stay'){
    const z = b.zones[0];
    const expectedWaves = Math.round(z.ratePerMin * plan.T);
    steps.push(`Andá a <strong style="color:var(--cyan);">${z.label}</strong>${refStr(z)} y quedate todo el heat.`);
    steps.push(`Ahí sale una ola cada <strong>${fmtMMSS(z.meanIntervalMs)}</strong> · esperás ~<strong>${expectedWaves}</strong> en ${plan.T} min.`);
    steps.push(`Sé selectivo: esta zona da olas de <strong>${(Math.round(z.avgScore*2)/2).toFixed(1)}</strong> promedio — no la malgastes con menos.`);
  } else {
    const [A, B2] = b.zones;
    const sStar = Math.round(pctile(A.scores, 0.7)*2)/2;
    steps.push(`Arrancá en <strong style="color:var(--cyan);">${A.label}</strong>${refStr(A)}.`);
    steps.push(`Si a los <strong>${b.t1} min</strong> no agarraste ola de <strong>${sStar}+</strong> → movete a <strong style="color:var(--cyan);">${B2.label}</strong>${refStr(B2)} (~${b.mv} min de remada).`);
    steps.push(`Cerrá el heat en ${B2.label}: ahí sale una cada <strong>${fmtMMSS(B2.meanIntervalMs)}</strong>.`);
  }
  const probLine = prob===null ? '' :
    `<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;">
      <span style="font-size:12px;color:var(--text-soft);">Probabilidad de llegar a ${target}:</span>
      <span style="font-size:20px;font-weight:800;color:${statusColor};font-family:'IBM Plex Mono',monospace;">${Math.round(prob*100)}%</span>
    </div>`;
  const altLine = plan.alt ? (() => {
    const a = plan.alt;
    const desc = a.type==='stay'
      ? `quedate en ${a.zones[0].label} todo el heat`
      : `${a.zones[0].label} → ${a.zones[1].label} al min ${a.t1}`;
    return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text-soft);">Plan B: ${desc} · esperado <strong style="color:var(--text);">${a.sim.expected.toFixed(1)} pts</strong>${a.sim.probTarget!==null?` · ${Math.round(a.sim.probTarget*100)}%`:''}</div>`;
  })() : '';
  return `<section class="section" style="background:linear-gradient(135deg,rgba(0,210,255,.08),rgba(0,210,255,.02));border:1.5px solid ${statusColor};">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:${statusColor};">Plan para tu heat · ${plan.T} min</div>
      <div style="font-size:11px;font-weight:800;color:${statusColor};padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-family:'IBM Plex Mono',monospace;">${b.sim.expected.toFixed(1)} pts esperados</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${steps.map((s,i)=>`<div style="display:flex;gap:10px;align-items:baseline;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:${statusColor};flex-shrink:0;">${i+1}.</span>
        <span style="font-size:14px;color:var(--text);line-height:1.55;">${s}</span>
      </div>`).join('')}
    </div>
    ${probLine}
    <div style="margin-top:8px;font-size:11px;color:var(--text-soft);font-family:'IBM Plex Mono',monospace;">Rango típico: ${b.sim.p25.toFixed(1)} – ${b.sim.p75.toFixed(1)} pts · heat simulado ${MC_TRIALS.toLocaleString()} veces por estrategia</div>
    ${altLine}
    ${plan.lowConfidence ? `<div style="margin-top:8px;font-size:11px;color:var(--amber);font-style:italic;">Confianza baja · menos de 10 olas observadas — el plan mejora con más datos</div>` : ''}
    <div style="margin-top:8px;font-size:10px;color:var(--grey);line-height:1.4;">Supuestos: cada ola surfeada consume ~${WAVE_COST_MIN} min · remada ~${MOVE_MIN_PER_CELL} min/celda · no modela prioridad de rivales.</div>
  </section>`;
}

/* Ranking de zonas: dónde salen los mejores puntos y cada cuánto. */
function renderZoneRanking(zones, cl){
  // Ordenar por lo que la SIMULACIÓN dice que vale la zona en un heat
  // (no por frecuencia×calidad — una zona élite escasa puede valer más).
  const ranked = [...zones]
    .sort((a,b) => ((b._stay?.sim.expected)||0) - ((a._stay?.sim.expected)||0) || (b.ratePerMin*b.topHalfAvg)-(a.ratePerMin*a.topHalfAvg))
    .slice(0, 3);
  if(!ranked.length) return '';
  const T = cl.heatDurationMin || 25;
  const medals = ['#F5C518', '#B8CCDF', '#B45309'];
  const rows = ranked.map((z, i) => {
    const refStr = z.refs && z.refs.length ? ` · ${z.refs.map(r=>esc(r.label)).join(' y ')}` : '';
    const dirStr = z.dirDominant==='L' ? ' · IZQUIERDAS' : z.dirDominant==='R' ? ' · DERECHAS' : z.dirDominant==='mixed' ? ' · mixtas' : '';
    const expected = Math.round(z.ratePerMin * T);
    return `<div style="display:flex;gap:12px;padding:12px 4px;border-top:1px solid var(--border);align-items:flex-start;">
      <span style="width:26px;height:26px;border-radius:50%;border:2px solid ${medals[i]};color:${medals[i]};font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</span>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:800;color:var(--white);letter-spacing:1px;">${z.label}</span>
          <span style="font-size:12px;color:${medals[i]};font-weight:700;">potencial ${(Math.round(z.topHalfAvg*10)/10).toFixed(1)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:3px;line-height:1.5;">
          ${z.n} ola${z.n===1?'':'s'} anotada${z.n===1?'':'s'}${refStr}${dirStr}<br>
          Sale una cada <strong style="color:var(--text);">${fmtMMSS(z.meanIntervalMs)}</strong> · en ${T} min esperás ~<strong style="color:var(--text);">${expected}</strong> acá · la mejor que viste: <strong style="color:var(--text);">${z.bestScore}</strong>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<section class="section">
    ${(()=>{ const si=setInsight(); if(!si||si.count<1) return ''; return `
    <div class="section" style="margin-bottom:14px;">
      <div class="section-t">Comportamiento de sets</div>
      <div style="font-size:13px;color:var(--text-soft);line-height:1.6;">
        🌀 ${si.count} set${si.count===1?'':'s'} · tamaño típico ~${si.typical} olas
        ${si.best ? `<br><strong style="color:var(--gold-text);">La ${ordinal(si.best.pos)} ola del set suele traer el mejor score</strong> (visto en ${si.best.n} de ${si.best.total} sets) — dejá pasar las primeras.` : `<br><span style="color:var(--grey);">Aún sin patrón repetido de qué ola del set rinde más.</span>`}
      </div>
    </div>`; })()}
    <div class="section-h"><div class="section-t">Dónde salen los puntos hoy</div></div>
    ${rows}
  </section>`;
}

/* Plan ejecutivo simple: dónde pararse, cuándo cambiar, si alcanza el objetivo */



function nearestRefs(col, row){
  if(!state.map.refs.length) return [];
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;
  const cx = (col - 0.5) * cellW;
  const cy = (row - 0.5) * cellH;
  const withDist = state.map.refs.map(r=>({ ...r, d: Math.hypot(r.x-cx, r.y-cy) }));
  withDist.sort((a,b)=>a.d-b.d);
  return withDist.slice(0, 2).filter(r=>r.d < MAP_W*0.4);
}

/* ════════════════════════════════════════════════════════════════════
   REPLAY TEMPORAL · ver los pins apareciendo en orden de tiempo (30 seg)
   ════════════════════════════════════════════════════════════════════ */
let _replayTimers = [];
let _replayInterval = null;
function openReplay(){
  if(!state.waves.length){ toast('No hay olas para reproducir'); return; }
  const sorted = [...state.waves].sort((a,b)=>a.ts-b.ts);
  const maxTs = sorted[sorted.length-1].ts;
  const REPLAY_DURATION = 30000; // 30 segundos total
  let m = document.querySelector('.modal-overlay'); if(m) m.remove();
  m = document.createElement('div'); m.className='modal-overlay'; m.id='replayModal';
  m.innerHTML = `<div class="modal" style="max-width:560px;max-height:92vh;overflow-y:auto;">
    <div class="modal-h">
      <div>
        <div class="modal-t">▶ Replay del análisis</div>
        <div style="font-size:11px;color:var(--grey);margin-top:2px;font-family:'IBM Plex Mono',monospace;">${state.waves.length} olas en 30 seg · ${Math.round(maxTs/60000)} min reales</div>
      </div>
      <button class="modal-x" onclick="closeReplay()">×</button>
    </div>
    <div id="replayMapWrap" style="position:relative;background:#021126;border-radius:12px;overflow:hidden;">
      ${renderReplayMapEmpty()}
    </div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;">
      <span style="color:var(--text-soft);">Min reales: <strong id="replayMinReal" style="color:var(--text);font-size:14px;">0:00</strong></span>
      <span style="color:var(--text-soft);">Olas: <strong id="replayCount" style="color:var(--text);font-size:14px;">0 / ${state.waves.length}</strong></span>
    </div>
    <div style="height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:8px;overflow:hidden;">
      <div id="replayBar" style="height:100%;background:linear-gradient(90deg,#22D3EE,#FBBF24);width:0%;transition:width .1s linear;"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-ghost btn-block" onclick="closeReplay()">Cerrar</button>
      <button class="btn btn-cyan btn-block" onclick="openReplay()">↺ Repetir</button>
    </div>
  </div>`;
  m.onclick = e => { if(e.target===m) closeReplay(); };
  document.body.appendChild(m);
  // Schedule cada pin en su tiempo proporcional
  _replayTimers.forEach(t => clearTimeout(t));
  _replayTimers = [];
  if(_replayInterval) clearInterval(_replayInterval);
  const svg = document.querySelector('#replayMapWrap svg');
  const pinsLayer = svg ? svg.querySelector('#replayPins') : null;
  const startedAt = Date.now();
  sorted.forEach((w, idx) => {
    const proportion = maxTs > 0 ? (w.ts / maxTs) : 0;
    const delay = proportion * (REPLAY_DURATION - 200) + 100;  // 100ms primero, último a 29.9s
    const t = setTimeout(() => {
      if(!pinsLayer) return;
      const cellW = MAP_W / GRID_COLS;
      const cellH = MAP_H / GRID_ROWS;
      const cx = (w.gridCol - 0.5) * cellW;
      const cy = (w.gridRow - 0.5) * cellH;
      const colors = { mejor:'#F59E0B', media:'#9CA3AF', otra:'#B45309' };
      const c = colors[w.category];
      const r = w.category==='mejor' ? 14 : w.category==='media' ? 11 : 9;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze"/>
          <animate attributeName="r" from="${r*1.6}" to="${r}" dur="0.3s" fill="freeze"/>
        </circle>`;
      pinsLayer.appendChild(g);
      const countEl = document.getElementById('replayCount');
      if(countEl) countEl.textContent = `${idx+1} / ${state.waves.length}`;
    }, delay);
    _replayTimers.push(t);
  });
  // Update progress + min real cada 100ms
  _replayInterval = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    if(elapsed >= REPLAY_DURATION){ clearInterval(_replayInterval); _replayInterval = null; }
    const pct = Math.min(100, (elapsed / REPLAY_DURATION) * 100);
    const bar = document.getElementById('replayBar');
    if(bar) bar.style.width = pct + '%';
    const minReal = (elapsed / REPLAY_DURATION) * (maxTs / 60000);
    const minRealEl = document.getElementById('replayMinReal');
    if(minRealEl) minRealEl.textContent = fmtMMSS(elapsed / REPLAY_DURATION * maxTs);
  }, 80);
}

      <circle cx="${ep.x}" cy="${ep.y}" r="13" fill="rgba(52,211,153,0.3)" stroke="#34D399" stroke-width="2.5"/>
      <g transform="translate(${ep.x-8} ${ep.y-8})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
      </g>
    </g>`;
  }
  if(state.map.exitPoint){
    const xp = state.map.exitPoint;
    replayEE += `<g style="pointer-events:none;">
      <circle cx="${xp.x}" cy="${xp.y}" r="13" fill="rgba(252,165,165,0.3)" stroke="#FCA5A5" stroke-width="2.5"/>
      <g transform="translate(${xp.x-8} ${xp.y-8})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCA5A5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
      </g>
    </g>`;
  }
  // Hazards también en el replay (contexto del análisis)
  let hazards = '';
  (state.map.hazards||[]).forEach(h => {
    const meta = HAZARD_MAP[h.type];
    if(!meta) return;
    const rot = (typeof h.angle === 'number') ? ` transform="rotate(${h.angle} 12 12)"` : '';
    hazards += `<g style="pointer-events:none;opacity:0.85;">
      <circle cx="${h.x}" cy="${h.y}" r="13" fill="${meta.color}22" stroke="${meta.color}" stroke-width="1.8"/>
      <g transform="translate(${h.x-9} ${h.y-9})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${meta.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g${rot}>${meta.svg}</g></svg>
      </g>
    </g>`;
  });
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;">
    ${bg}${grid}${refLines}${replayEE}${refs}${hazards}<g id="replayPins"></g>
  </svg>`;
}
function closeReplay(){
  _replayTimers.forEach(t => clearTimeout(t));
  _replayTimers = [];
  if(_replayInterval){ clearInterval(_replayInterval); _replayInterval = null; }
  document.querySelector('.modal-overlay')?.remove();
}

function goBackToObserve(){
  if(!confirm('Volver a marcar olas? El cronómetro se reanuda donde estaba.')) return;
  state.screen = 'observe';
  state.timer.finished = false;
  save(); render();
  startTimerLoop();
}

/* ════════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════════ */
load();
render();
if(state.screen === 'observe' && state.timer.startedAt && !state.timer.finished){
  startTimerLoop();
}

</script>
