<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1628">
<title>Venue Scout · The Surf Sequence®</title>
<link rel="icon" href="tss-logo-wave.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="tss-logo-wave.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Work+Sans:wght@400;500;600&family=DM+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1628; --bg2:#0E1F3D; --bg3:#1a2842;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#E8F0F5; --text-soft:#B8CCDF; --grey:#6B7E8F;
  --cyan:#00D2FF; --purple:#A855F7; --amber:#F59E0B; --foam:#34D399; --coral:#FCA5A5;
  --gold:#F59E0B; --silver:#9CA3AF; --bronze:#B45309;
  --gold-text:#FCD34D; --silver-text:#D1D5DB; --bronze-text:#FBBF24;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Work Sans',system-ui,sans-serif; min-height:100vh; min-height:100dvh; overscroll-behavior:none; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Outfit',sans-serif; margin:0; font-weight:700;}
.serif{font-family:'Instrument Serif',serif; font-weight:400; font-style:italic; letter-spacing:-.01em;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit;}
.mono{font-family:'DM Mono',monospace;}

/* ---------- Layout ---------- */
.app{max-width:100%; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
.topbar{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(10,22,40,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:10;}
.brand-block{display:flex; align-items:center; gap:14px;}
.brand-logo{height:22px; width:auto; opacity:.95;}
.brand-divider{width:1px; height:18px; background:var(--border2);}
.brand-tool{font-family:'Outfit',sans-serif; font-weight:500; font-size:12px; color:var(--text-soft); letter-spacing:.6px; text-transform:uppercase;}
.brand-tool strong{color:var(--cyan); font-weight:700;}
.brand-ctx{font-family:'Work Sans',sans-serif; font-size:12px; color:var(--text-soft); display:none;}
.brand-ctx strong{color:var(--text); font-weight:600;}
@media(min-width:600px){ .brand-ctx{display:inline;} }
.menu-btn{padding:7px; border:1px solid var(--border2); border-radius:8px; color:var(--text-soft); display:inline-flex; align-items:center; justify-content:center; transition:all .15s;}
.menu-btn:hover{border-color:var(--cyan); color:var(--cyan);}
.menu-btn svg{width:16px; height:16px;}
.screen{padding:16px; flex:1; display:flex; flex-direction:column; gap:14px;}

/* ---------- Inputs ---------- */
.label{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:6px;}
.inp,.sel,.ta{width:100%; background:rgba(255,255,255,.04); border:1px solid var(--border2); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px;}
.inp:focus,.sel:focus,.ta:focus{outline:none; border-color:var(--cyan); background:rgba(0,210,255,.04);}
.ta{resize:vertical; min-height:64px; font-family:inherit;}

/* ---------- Chips ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{font-size:13px; padding:7px 14px; border-radius:18px; background:rgba(0,210,255,.1); border:1px solid rgba(0,210,255,.3); color:var(--cyan); font-weight:600; cursor:pointer; user-select:none; transition:all .12s;}
.chip:active{transform:scale(.96);}
.chip.off{background:transparent; border:1px solid var(--border2); color:var(--grey);}
.chip.amber{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.4); color:var(--gold-text);}
.chip.purple{background:rgba(168,85,247,.12); border-color:rgba(168,85,247,.4); color:#C9B9E8;}

/* ---------- Buttons ---------- */
.btn{padding:12px 16px; border-radius:10px; font-size:13px; font-weight:600; transition:all .15s; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn:active{transform:scale(.97);}
.btn-cyan{background:var(--cyan); color:var(--bg);}
.btn-ghost{background:transparent; border:1px solid var(--border2); color:var(--text-soft);}
.btn-coral{background:rgba(252,165,165,.12); border:1px solid rgba(252,165,165,.4); color:var(--coral);}
.btn-block{width:100%;}
.btn-lg{padding:14px 18px; font-size:14px;}

/* ---------- Categories ---------- */
.cat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.cat{padding:14px 6px; border-radius:12px; text-align:center; cursor:pointer; user-select:none; transition:all .15s; border:2.5px solid transparent;}
.cat:active{transform:scale(.97);}
.cat.on{transform:scale(1.03); box-shadow:0 0 0 3px rgba(255,255,255,.18);}
.cat-mejor{background:rgba(245,158,11,.18); border-color:var(--gold);}
.cat-media{background:rgba(156,163,175,.16); border-color:var(--silver);}
.cat-otra{background:rgba(180,83,9,.18); border-color:var(--bronze);}
.cat-lbl{font-size:11px; font-weight:700; letter-spacing:.8px;}
.cat-num{font-size:22px; font-weight:700; font-family:'DM Mono',monospace; margin-top:4px; line-height:1;}
.cat-mejor .cat-lbl,.cat-mejor .cat-num{color:var(--gold-text);}
.cat-media .cat-lbl,.cat-media .cat-num{color:var(--silver-text);}
.cat-otra .cat-lbl,.cat-otra .cat-num{color:var(--bronze-text);}

/* ---------- Toolbar ---------- */
.toolbar{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
.tool{padding:9px 4px; border-radius:8px; text-align:center; font-size:10px; font-weight:700; border:1px solid var(--border2); color:var(--text-soft); cursor:pointer; user-select:none; letter-spacing:.4px; transition:all .12s; line-height:1.1;}
.tool:active{transform:scale(.96);}
.tool svg{display:block; margin:0 auto 3px; width:16px; height:16px;}
.tool.on{background:rgba(255,255,255,.08); border-color:currentColor;}
.tool.out{color:var(--purple);}
.tool.in{color:var(--gold);}
.tool.ori{color:var(--cyan);}
.tool.del{color:var(--coral);}
.tool.misma{color:var(--cyan); border-color:rgba(0,210,255,.4); background:rgba(0,210,255,.08);}

/* ---------- Timer ---------- */
.timer-bar{display:flex; justify-content:space-between; align-items:center; gap:12px;}
.timer-big{font-size:28px; font-weight:700; color:var(--text); font-family:'DM Mono',monospace; line-height:1;}
.timer-sub{font-size:11px; color:var(--grey); margin-top:3px;}
.timer-stop{font-size:13px; color:var(--coral); font-weight:600; padding:8px 14px; border:1px solid rgba(252,165,165,.4); border-radius:8px;}
.timer-warn{color:var(--gold-text) !important;}

/* ---------- Map ---------- */
.map-wrap{position:relative; background:#021126; border-radius:14px; overflow:hidden; touch-action:pan-y;}
.map-wrap svg{display:block; width:100%; height:auto; touch-action:pan-y; max-height:52vh;}
.map-wrap.drawing-mode, .map-wrap.drawing-mode svg{touch-action:none;}
.map-meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--grey); padding:4px 2px; font-family:'DM Mono',monospace;}
@media (min-width:1024px){
  .map-wrap svg{max-height:none;}
}

/* ---------- Section ---------- */
.section{background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:14px; padding:14px 14px;}
.section-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.section-t{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--cyan); font-weight:700;}

/* ---------- Recent waves list ---------- */
.recent{max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;}
.recent-item{display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:rgba(255,255,255,.04); border-radius:6px; font-size:12px;}
.recent-coord{font-family:'DM Mono',monospace; font-weight:700;}
.recent-time{color:var(--grey); font-size:11px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; z-index:200; backdrop-filter:blur(8px); padding:20px;}
.modal{background:var(--bg2); border:1px solid var(--border2); border-radius:16px; padding:18px 18px 20px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto;}
.modal-h{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
.modal-t{font-size:16px; font-weight:700;}
.modal-x{font-size:22px; color:var(--grey); padding:0 6px;}

/* ---------- Report ---------- */
.report-block{background:rgba(255,255,255,.025); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:0 12px 12px 0; padding:0; margin-bottom:10px; overflow:hidden;}
.report-block.silver{border-left-color:var(--silver);}
.report-block.bronze{border-left-color:var(--bronze);}
.report-cat-banner{display:flex; justify-content:space-between; align-items:center; padding:8px 14px; background:rgba(245,158,11,.08); border-bottom:1px solid var(--border);}
.report-block.silver .report-cat-banner{background:rgba(156,163,175,.06);}
.report-block.bronze .report-cat-banner{background:rgba(180,83,9,.06);}
.report-cat-lbl{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--gold-text);}
.report-block.silver .report-cat-lbl{color:var(--silver-text);}
.report-block.bronze .report-cat-lbl{color:var(--bronze-text);}
.report-cat-meta{font-size:11px; color:var(--text-soft); font-family:'DM Mono',monospace;}
.report-hero{padding:18px 16px 14px; text-align:center;}
.report-hero-coord{font-family:'DM Mono',monospace; font-size:44px; font-weight:700; color:var(--gold-text); line-height:.95; letter-spacing:-.02em;}
.report-block.silver .report-hero-coord{color:var(--silver-text);}
.report-block.bronze .report-hero-coord{color:var(--bronze-text);}
.report-hero-arrow{color:var(--text-soft); font-size:22px; font-weight:300; margin:0 12px;}
.report-hero-time{font-family:'DM Mono',monospace; font-size:24px; font-weight:600; color:var(--text);}
.report-hero-row{display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap;}
.report-hero-sub{font-size:13px; color:var(--text-soft); margin-top:6px; line-height:1.4;}
.report-hero-sub strong{color:var(--text); font-weight:500;}
.report-strip{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); flex-wrap:wrap;}
.report-pill{font-size:11px; padding:4px 10px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--border); color:var(--text-soft);}
.report-pill strong{color:var(--text); font-weight:600;}
.report-pill.foam{background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.3); color:var(--foam);}
.report-pill.amber{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.3); color:var(--gold-text);}
.report-pill.coral{background:rgba(252,165,165,.12); border-color:rgba(252,165,165,.3); color:var(--coral);}
.report-alt-section{padding:10px 14px 14px; border-top:1px solid var(--border);}
.report-alt-title{font-size:10px; font-weight:700; letter-spacing:1.2px; color:var(--cyan); margin-bottom:8px;}
.report-alt-row{display:flex; align-items:center; gap:10px; padding:8px 0; font-size:12px; color:var(--text-soft);}
.report-alt-row + .report-alt-row{border-top:1px dashed var(--border);}
.report-alt-num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; background:rgba(0,210,255,.15); color:var(--cyan); border-radius:50%; font-family:'DM Mono',monospace; font-size:11px; font-weight:700; flex-shrink:0;}
.report-alt-coord{font-family:'DM Mono',monospace; font-weight:700; color:var(--text); min-width:42px;}
.report-alt-refs{flex:1; min-width:0; color:var(--grey); font-size:11px;}
.report-alt-data{font-family:'DM Mono',monospace; font-size:11px; color:var(--text-soft);}
.plan-card{background:rgba(0,210,255,.08); border:1px solid rgba(0,210,255,.3); border-radius:12px; padding:14px 16px; margin-top:14px;}
.plan-h{font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:1px; margin-bottom:8px;}
.plan-line{font-size:13px; color:var(--text-soft); margin-top:5px; line-height:1.5;}
.plan-line strong{color:var(--text); font-weight:600;}
.plan-line.win strong{color:var(--foam);}

/* ---------- Score sliders ---------- */
.score-row{display:grid; grid-template-columns:30px 1fr 50px; align-items:center; gap:12px; margin-bottom:10px;}
.score-row input[type=range]{width:100%; -webkit-appearance:none; background:transparent;}
.score-row input[type=range]::-webkit-slider-runnable-track{height:8px; background:rgba(255,255,255,.08); border-radius:4px;}
.score-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--cyan); margin-top:-6px; box-shadow:0 0 0 3px rgba(0,210,255,.18);}
.score-val{font-family:'DM Mono',monospace; font-weight:700; text-align:right; font-size:15px;}

/* ---------- Empty ---------- */
.empty{text-align:center; padding:40px 20px; color:var(--grey);}

/* ---------- Tablet landscape (≥1024px, landscape) ---------- */
@media (min-width:1024px){
  .app{flex-direction:column;}
  .topbar{padding:14px 24px;}
  .brand{font-size:14px;}
  .screen{padding:20px 24px 32px; max-width:1280px; width:100%; margin:0 auto;}
  .screen.observe{display:grid; grid-template-columns:minmax(440px, 1fr) minmax(520px, 1.05fr); gap:20px; align-items:start;}
  .screen.observe > .section:first-of-type{grid-column:1; grid-row:1;}
  .screen.observe > .map-wrap{grid-column:2; grid-row:1 / span 2; position:sticky; top:80px; max-height:calc(100vh - 100px); display:flex; align-items:center;}
  .screen.observe > .map-wrap svg{max-height:calc(100vh - 100px); width:100%; height:auto; max-width:none;}
  .screen.observe > .section:last-of-type{grid-column:1; grid-row:2;}
  .screen.setup, .screen.report{max-width:780px;}
  .cat{padding:18px 6px;}
  .cat-lbl{font-size:13px;}
  .cat-num{font-size:28px; margin-top:6px;}
  .tool{padding:11px 4px; font-size:11px;}
  .tool svg{width:18px; height:18px;}
  .timer-big{font-size:36px;}
  .timer-stop{font-size:14px; padding:10px 18px;}
}
@media (min-width:1280px){
  .screen.observe{grid-template-columns:minmax(480px, 1fr) minmax(620px, 1.15fr);}
}

/* Hide scrollbar */
.recent::-webkit-scrollbar{width:5px;}
.recent::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1); border-radius:5px;}

/* SVG cell highlight on tap */
.cell-hit{fill:rgba(0,210,255,.18); transition:opacity .2s; pointer-events:none;}

/* Toast */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--cyan); color:var(--text); padding:10px 18px; border-radius:24px; font-size:13px; font-weight:600; z-index:500; box-shadow:0 6px 24px rgba(0,0,0,.4); animation:toastIn .3s ease-out;}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}

/* Box breathing screen */
.breath-screen{position:fixed; inset:0; background:radial-gradient(ellipse at center, #0a3a5c 0%, #021126 70%, #000a18 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:900; padding:24px;}
.breath-intro{font-family:'Instrument Serif',serif; font-style:italic; font-size:22px; color:var(--text); text-align:center; line-height:1.4; max-width:480px; margin-bottom:28px; opacity:.95;}
.breath-circle-wrap{position:relative; width:240px; height:240px; display:flex; align-items:center; justify-content:center;}
.breath-circle{position:absolute; width:120px; height:120px; border-radius:50%; background:rgba(0,210,255,.12); border:2px solid rgba(0,210,255,.55); transition:transform 4s cubic-bezier(.5,.0,.5,1), background 4s ease, border-color 4s ease;}
.breath-circle.in{transform:scale(1.9); background:rgba(34,211,238,.25); border-color:#22D3EE;}
.breath-circle.hold{transform:scale(1.9); background:rgba(34,211,238,.18); border-color:#22D3EE;}
.breath-circle.out{transform:scale(1); background:rgba(0,210,255,.12); border-color:rgba(0,210,255,.55);}
.breath-circle.holdout{transform:scale(1); background:rgba(0,210,255,.08); border-color:rgba(0,210,255,.4);}
.breath-phase{position:absolute; font-family:'Outfit',sans-serif; font-weight:300; font-size:24px; color:var(--text); letter-spacing:2px; text-transform:uppercase; pointer-events:none;}
.breath-meta{margin-top:32px; font-family:'DM Mono',monospace; font-size:12px; color:var(--text-soft); letter-spacing:1.5px;}
.breath-skip{margin-top:24px; font-size:12px; color:var(--text-soft); padding:8px 18px; border:1px solid var(--border2); border-radius:20px; transition:all .15s;}
.breath-skip:hover{color:var(--text); border-color:var(--text-soft);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ════════════════════════════════════════════════════════════════════
   VENUE SCOUT · TSS — standalone v1
   Una herramienta de análisis de spots para coach/atleta de surf comp.
   Estado en localStorage. Sin red. Funciona offline en la beach.
   ════════════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'tss_venue_scout_v1';
const GRID_ROWS = 17;
const GRID_COLS = 15;
const ROW_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R'].slice(0, GRID_ROWS);

let state = {
  screen: 'setup',
  config: { spotName: '', date: todayStr(), conditions: { sizeFt:5, tideLevel:60, tideDir:'bajando', wind:'offshore suave', period:'14s' }, durationMin: 20 },
  map: { lines: { outside:null, inside:null, orilla:null }, refs: [], photoDataUrl:null, photoOpacity:0.7, freehand:[], entryPoint:null, exitPoint:null },
  waves: [],   // { id, gridCol(1-12), gridRow(1-N), category('mejor'|'media'|'otra'), ts(ms desde inicio), absTime }
  timer: { startedAt:null, durationMs:null, paused:false, finished:false },
  activeMode: 'mejor',  // mejor | media | otra | line-out | line-in | line-ori | ref | erase | draw
  activeDirection: null,  // 'L' | 'R' | null — sticky modifier; cada wave hereda este valor
  activePrediction: null, // {col, row} — predicción pendiente esperando próxima MEJOR
  predictionStats: { tried:0, hit:0, near:0 },
  pendingLineStart: null,
  closing: { description:'', scores: { mejor:8.5, media:6.5, otra:5.0 }, heatObjective:14.5 }
};

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowMs(){ return Date.now(); }
function fmtMMSS(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtHM(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60); const sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
function fmtClock(d){ d=new Date(d); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function colToLetter(c){ /* placeholder, columnas siguen siendo numéricas */ return c; }
function rowToLetter(r){ return ROW_LETTERS[r-1] || '?'; }
function pointToCell(pt){
  if(!pt) return null;
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;
  const col = Math.max(1, Math.min(GRID_COLS, Math.floor(pt.x / cellW) + 1));
  const row = Math.max(1, Math.min(GRID_ROWS, Math.floor(pt.y / cellH) + 1));
  return rowToLetter(row) + col;
}
function coordLbl(w){ return rowToLetter(w.gridRow)+w.gridCol; }

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn(e); } }
function load(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(!s) return;
    const parsed = JSON.parse(s);
    if(!parsed || !parsed.screen) return;
    // Migración v1 → v1.1: condiciones de string a slider numérico
    const c = parsed.config && parsed.config.conditions;
    if(c){
      if(c.size !== undefined && c.sizeFt === undefined){
        const m = String(c.size).match(/([\d.]+)/);
        const meters = m ? parseFloat(m[1]) : 1.5;
        c.sizeFt = Math.max(1, Math.min(12, Math.round(meters * 3.28)));
        delete c.size;
      }
      if(c.tide !== undefined && c.tideLevel === undefined){
        const tideMap = { 'baja':10, 'media':50, 'alta':90 };
        c.tideLevel = tideMap[c.tide] !== undefined ? tideMap[c.tide] : 50;
        c.tideDir = c.tide === 'subiendo' ? 'subiendo' : c.tide === 'bajando' ? 'bajando' : 'parada';
        delete c.tide;
      }
      if(c.sizeFt === undefined) c.sizeFt = 5;
      if(c.tideLevel === undefined) c.tideLevel = 60;
      if(c.tideDir === undefined) c.tideDir = 'bajando';
    }
    state = parsed;
  } catch(e){ console.warn('load() failed', e); }

function sizeLabel(ft){
  ft = Number(ft) || 0;
  let qual = '';
  if(ft<=1.5) qual = 'ankle';
  else if(ft<=2.5) qual = 'knee';
  else if(ft<=3.5) qual = 'waist';
  else if(ft<=5) qual = 'chest';
  else if(ft<=7) qual = 'overhead';
  else if(ft<=10) qual = 'double overhead';
  else qual = 'XXL';
  return `${ft} ft · ${qual}`;
}
function tideLabel(level, dir){
  level = Number(level)||0;
  let where = '';
  if(level<=12) where = 'baja';
  else if(level<=30) where = 'media-baja';
  else if(level<=45) where = 'media';
  else if(level<=60) where = 'media';
  else if(level<=80) where = 'media-alta';
  else if(level<=92) where = 'casi alta';
  else where = 'alta';
  return dir==='parada' ? `${where} (parada)` : `${where} ${dir}`;
}

/* ════════════════════════════════════════════════════════════════════
   BOX BREATHING · 4-4-4-4 × 4 ciclos · 64s total
   Antes de observar: calmar sistema nervioso, abrir visión periférica
   ════════════════════════════════════════════════════════════════════ */
function startBreathingThenObserve(){
  if(!state.config.spotName.trim()){ toast('Poné un nombre al spot'); return; }
  showBreathingScreen();
}
function showBreathingScreen(){
  let scr = document.getElementById('breathScreen'); if(scr) scr.remove();
  scr = document.createElement('div');
  scr.id = 'breathScreen';
  scr.className = 'breath-screen';
  scr.innerHTML = `
    <div class="breath-intro">Es hora de conectar con el aquí y ahora · sentí el océano antes de leerlo</div>
    <div class="breath-circle-wrap">
      <div class="breath-circle" id="breathCircle"></div>
      <div class="breath-phase" id="breathPhase">Listo</div>
    </div>
    <div class="breath-meta" id="breathMeta">Ciclo 1 de 4 · 4-4-4-4</div>
    <button class="breath-skip" onclick="endBreathing(false)">Saltar →</button>
  `;
  document.body.appendChild(scr);
  // Empezamos después de 500ms para que la pantalla aparezca antes de la primera inhalación
  setTimeout(()=> runBreathingCycle(1), 500);
}
let _breathTimers = [];
function runBreathingCycle(cycle){
  if(cycle > 4){ endBreathing(true); return; }
  const meta = document.getElementById('breathMeta');
  if(meta) meta.textContent = `Ciclo ${cycle} de 4 · 4-4-4-4`;
  const phases = [
    { lbl:'Inhalá', cls:'in',      ms:4000 },
    { lbl:'Mantené', cls:'hold',    ms:4000 },
    { lbl:'Exhalá', cls:'out',     ms:4000 },
    { lbl:'Mantené', cls:'holdout', ms:4000 },
  ];
  let elapsed = 0;
  phases.forEach((p, i) => {
    const t = setTimeout(()=>{
      const c = document.getElementById('breathCircle');
      const lbl = document.getElementById('breathPhase');
      if(c){ c.classList.remove('in','hold','out','holdout'); c.classList.add(p.cls); }
      if(lbl) lbl.textContent = p.lbl;
    }, elapsed);
    _breathTimers.push(t);
    elapsed += p.ms;
  });
  const nextT = setTimeout(()=> runBreathingCycle(cycle+1), elapsed);
  _breathTimers.push(nextT);
}
function endBreathing(completed){
  _breathTimers.forEach(t => clearTimeout(t));
  _breathTimers = [];
  const scr = document.getElementById('breathScreen'); if(scr) scr.remove();
  if(completed) toast('🌊 Listo · conectado');
  // Arranca observación
  if(!state.timer.startedAt){
    state.timer.startedAt = nowMs();
    state.timer.durationMs = state.config.durationMin * 60 * 1000;
  }
  state.screen = 'observe';
  save(); render();
  startTimerLoop();
}

let _timerInterval = null;
function startTimerLoop(){
  if(_timerInterval) clearInterval(_timerInterval);
  _timerInterval = setInterval(()=>{
    if(state.screen !== 'observe') return;
    if(state.timer.finished || state.timer.paused) return;
    const el = document.getElementById('timerDisplay');
    if(!el) return;
    const remaining = state.timer.startedAt + state.timer.durationMs - nowMs();
    el.textContent = fmtMMSS(remaining);
    if(remaining < 60000) el.classList.add('timer-warn'); else el.classList.remove('timer-warn');
    const elapsed = nowMs() - state.timer.startedAt;
    const subEl = document.getElementById('timerSub');
    if(subEl) subEl.textContent = `restante · ${fmtMMSS(elapsed)} transc.`;
    if(remaining <= 0){
      state.timer.finished = true;
      save();
      toast('⏰ Análisis terminado');
      goToReport();
    }
  }, 250);
}

      ${(state.map.freehand && state.map.freehand.length) ? `<div style="margin-top:6px;text-align:right;"><button onclick="if(confirm('¿Borrar todos los trazos?')){state.map.freehand=[];save();render();}" style="font-size:11px;color:var(--coral);font-weight:600;">× Limpiar ${state.map.freehand.length} trazo${state.map.freehand.length===1?'':'s'}</button></div>` : ''}

      ${renderPredictionWidget()}
      <div style="font-size:10px;color:var(--grey);text-align:center;margin-top:6px;line-height:1.4;">
        ${modeHint(state.activeMode)}
      </div>
    </section>

    <section class="map-wrap${state.activeMode==='draw'?' drawing-mode':''}" id="mapWrap">
      ${renderMapSVG()}
    </section>

    <section class="section">
      <div class="section-h">
        <div class="section-t">Últimas olas (${state.waves.length})</div>
        ${state.waves.length?`<button class="btn btn-ghost" style="padding:4px 10px;font-size:10px;" onclick="openAllWavesModal()">Ver todas</button>`:''}
      </div>
      <div class="recent">
        ${state.waves.slice(-7).reverse().map(w=>renderRecentItem(w)).join('') || '<div class="empty" style="padding:20px;font-size:12px;">Tap una celda con MEJOR/MEDIA/OTRA activa para plantar la primera ola.</div>'}
      </div>
    </section>
  </main>`;
}
function modeHint(mode){
  switch(mode){
    case 'mejor': case 'media': case 'otra': return `tap una celda del mapa para plantar pin ${mode.toUpperCase()} con timestamp`;
    case 'line-out': return state.pendingLineStart ? 'tap el segundo punto de la línea OUTSIDE' : 'tap el primer punto de la línea OUTSIDE';
    case 'line-in': return state.pendingLineStart ? 'tap el segundo punto de la línea INSIDE' : 'tap el primer punto de la línea INSIDE';
    case 'line-ori': return state.pendingLineStart ? 'tap el segundo punto de la línea ORILLA' : 'tap el primer punto de la línea ORILLA';
    case 'ref': return 'tap donde quieras plantar la referencia (palmera, casa, poste...)';
    case 'erase': return 'tap un pin para borrarlo';
    case 'draw': return 'dibujá con el dedo sobre la cuadrícula (esbozá orilla, banco, lineup...)';
    case 'predict': return '🎯 tap la celda donde predecís que sale la PRÓXIMA mejor';
    case 'entry': return 'tap el punto por donde el atleta ENTRA al agua (canal, orilla, etc.)';
    case 'exit': return 'tap el punto por donde el atleta SALE del agua después de la ola';
  }
  return '';
}

function renderPredictionWidget(){
  const ps = state.predictionStats || {tried:0, hit:0, near:0};
  const hasStats = ps.tried > 0;
  const accuracy = hasStats ? Math.round(((ps.hit + ps.near*0.5) / ps.tried) * 100) : 0;
  if(state.activePrediction){
    const p = state.activePrediction;
    return `<div style="margin-top:10px;padding:10px 12px;background:rgba(34,211,238,.1);border:1.5px dashed #22D3EE;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="font-size:11px;color:#22D3EE;font-weight:700;line-height:1.4;">🎯 Predijiste <strong style="font-family:'DM Mono',monospace;font-size:13px;">${rowToLetter(p.row)}${p.col}</strong> · esperando próxima MEJOR...</div>
      <button onclick="cancelPrediction()" style="font-size:11px;color:var(--text-soft);padding:4px 10px;border:1px solid var(--border2);border-radius:6px;flex-shrink:0;">Cancelar</button>
    </div>`;
  }
  if(state.activeMode === 'predict'){
    return `<div style="margin-top:10px;padding:10px 12px;background:rgba(34,211,238,.08);border:1.5px solid #22D3EE;border-radius:10px;text-align:center;">
      <div style="font-size:11px;color:#22D3EE;font-weight:700;">🎯 Tap la celda donde predecís la próxima MEJOR</div>
      <button onclick="setMode('mejor')" style="margin-top:6px;font-size:11px;color:var(--text-soft);padding:4px 12px;border:1px solid var(--border2);border-radius:6px;">Cancelar</button>
    </div>`;
  }
  return `<div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px;">
    <button onclick="startPrediction()" style="font-size:12px;color:#22D3EE;padding:8px 14px;border:1.5px solid rgba(34,211,238,.4);border-radius:9px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
      🎯 Predecir próxima MEJOR
    </button>
    ${hasStats ? `<div style="font-size:11px;color:var(--text-soft);font-family:'DM Mono',monospace;">
      ${ps.hit} aciertos · ${ps.near} cerca · ${ps.tried} intentos · <strong style="color:#22D3EE;">${accuracy}%</strong>
    </div>` : `<div style="font-size:11px;color:var(--grey);font-style:italic;">opt-in · entrenar lectura del mar</div>`}
  </div>`;
}

function startPrediction(){
  if(state.activePrediction){ toast('Ya tenés una predicción pendiente'); return; }
  state.activeMode = 'predict';
  save(); render();
}
function cancelPrediction(){
  state.activePrediction = null;
  state.activeMode = 'mejor';
  save(); render();
}
function recordPrediction(col, row){
  state.activePrediction = { col, row };
  state.activeMode = 'mejor';  // vuelve al modo MEJOR automáticamente
  save(); render();
  toast(`🎯 Predijiste ${rowToLetter(row)}${col} · plantá la próxima MEJOR donde realmente salga`);
}
function checkPredictionAgainst(col, row){
  if(!state.activePrediction) return;
  const p = state.activePrediction;
  const dist = Math.max(Math.abs(p.col - col), Math.abs(p.row - row));
  state.predictionStats = state.predictionStats || { tried:0, hit:0, near:0 };
  state.predictionStats.tried++;
  if(dist === 0){
    state.predictionStats.hit++;
    toast(`🎯 ¡ACERTASTE ${rowToLetter(row)}${col}! Estás leyendo el mar.`, 2800);
  } else if(dist <= 1){
    state.predictionStats.near++;
    toast(`Cerca · predijiste ${rowToLetter(p.row)}${p.col} · salió ${rowToLetter(row)}${col} (a 1 celda)`, 2800);
  } else {
    toast(`Lejos · predijiste ${rowToLetter(p.row)}${p.col} · salió ${rowToLetter(row)}${col}`, 2800);
  }
  state.activePrediction = null;
}
function renderRecentItem(w){
  const colorMap = { mejor:'var(--gold-text)', media:'var(--silver-text)', otra:'var(--bronze-text)' };
  const c = colorMap[w.category];
  const dirChip = w.direction === 'L'
    ? `<span style="font-size:10px;color:#22D3EE;font-weight:700;">IZQ→</span>`
    : w.direction === 'R'
    ? `<span style="font-size:10px;color:#FBBF24;font-weight:700;">←DER</span>`
    : '';
  return `<div class="recent-item" onclick="openEditWaveModal('${w.id}')" style="cursor:pointer;">
    <span style="color:${c};font-weight:700;">● ${w.category.toUpperCase()}</span>
    <span class="recent-coord">${coordLbl(w)}</span>
    ${dirChip}
    ${w.score?`<span style="font-size:10px;background:rgba(255,255,255,.08);color:var(--text);padding:1px 6px;border-radius:8px;font-weight:700;">${w.score}/10</span>`:''}
    <span class="recent-time mono">+${fmtMMSS(w.ts)}</span>
    <button onclick="event.stopPropagation();removeWave('${w.id}')" style="color:var(--coral);font-size:14px;padding:0 4px;line-height:1;" title="Borrar">×</button>
  </div>`;
}

function countByCategory(){
  const c = {mejor:0,media:0,otra:0};
  state.waves.forEach(w=>{ if(c[w.category]!==undefined) c[w.category]++; });
  return c;
}

/* ════════════════════════════════════════════════════════════════════
   MAP RENDER (SVG)
   ════════════════════════════════════════════════════════════════════ */
const MAP_W = 600, MAP_H = 600;
function renderMapSVG(){
  // 600x600 SVG (responsive via viewBox). Grid uniform.
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;

  // Background: foto si hay, o gradient Ocean Tropical
  const hasPhoto = !!state.map.photoDataUrl;
  const bg = `<defs>
    <linearGradient id="oc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031b3d"/>
      <stop offset="35%" stop-color="#0a5a8a"/>
      <stop offset="55%" stop-color="#19a3c4"/>
      <stop offset="72%" stop-color="#a8e4d3"/>
      <stop offset="85%" stop-color="#e6c889"/>
      <stop offset="100%" stop-color="#5a7a3c"/>
    </linearGradient>
  </defs>
  ${hasPhoto
    ? `<rect width="${MAP_W}" height="${MAP_H}" fill="#021126"/><image id="mapPhoto" href="${state.map.photoDataUrl}" x="0" y="0" width="${MAP_W}" height="${MAP_H}" preserveAspectRatio="xMidYMid slice" opacity="${state.map.photoOpacity||0.7}"/>`
    : `<rect width="${MAP_W}" height="${MAP_H}" fill="url(#oc)"/>`}`;

  // Sin línea decorativa — fondo limpio
  const wave = '';

  // Trazos libres
  const freehandPaths = (state.map.freehand||[]).map((p,i)=>
    `<path class="freehand-path" data-fh="${i}" d="${p.d}" stroke="${p.color||'#ffffff'}" stroke-width="${p.width||2.8}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" style="pointer-events:${state.activeMode==='erase'?'auto':'none'};cursor:${state.activeMode==='erase'?'pointer':'default'};"/>`
  ).join('') + '<path id="drawPreview" d="" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" style="pointer-events:none;"/>';

  // Líneas de grilla en fucsia
  let grid = '<g stroke="rgba(236,72,153,0.55)" stroke-width="0.7">';
  for(let r=1; r<GRID_ROWS; r++) grid += `<line x1="0" y1="${r*cellH}" x2="${MAP_W}" y2="${r*cellH}"/>`;
  for(let c=1; c<GRID_COLS; c++) grid += `<line x1="${c*cellW}" y1="0" x2="${c*cellW}" y2="${MAP_H}"/>`;
  grid += '</g>';

  // Labels en chips oscuros · letras cyan eléctrico · números amarillo eléctrico
  const chipBg = 'rgba(0,0,0,0.7)';
  let labels = '<g font-family="DM Mono,monospace" font-weight="700">';
  // Letras (eje vertical, A-Q)
  for(let r=1; r<=GRID_ROWS; r++){
    const y = (r-0.5)*cellH;
    labels += `<rect x="2" y="${y-9}" width="20" height="18" rx="4" fill="${chipBg}"/>`;
    labels += `<text x="12" y="${y+5}" text-anchor="middle" font-size="12" fill="#22D3EE">${rowToLetter(r)}</text>`;
  }
  // Números (eje horizontal, 1-15)
  for(let c=1; c<=GRID_COLS; c++){
    const x = (c-0.5)*cellW;
    const w = c >= 10 ? 24 : 20;
    labels += `<rect x="${x-w/2}" y="${MAP_H-22}" width="${w}" height="18" rx="4" fill="${chipBg}"/>`;
    labels += `<text x="${x}" y="${MAP_H-8}" text-anchor="middle" font-size="12" fill="#FBBF24">${c}</text>`;
  }
  labels += '</g>';

  // Líneas de referencia (outside/inside/orilla)
  let refLines = '';
  if(state.map.lines.outside) refLines += renderLine(state.map.lines.outside, '#A855F7', 'OUTSIDE');
  if(state.map.lines.inside)  refLines += renderLine(state.map.lines.inside,  '#F59E0B', 'INSIDE');
  if(state.map.lines.orilla)  refLines += renderLine(state.map.lines.orilla,  '#00D2FF', 'ORILLA');
  if(state.pendingLineStart){
    const p = state.pendingLineStart;
    const colors = {'line-out':'#A855F7','line-in':'#F59E0B','line-ori':'#00D2FF'};
    const c = colors[state.activeMode] || '#fff';
    refLines += `<circle cx="${p.x}" cy="${p.y}" r="8" fill="${c}" stroke="#fff" stroke-width="2"/>`;
  }

  // Entry / Exit points (verde para entrada, coral para salida)
  let entryExit = '';
  if(state.map.entryPoint){
    const ep = state.map.entryPoint;
    entryExit += `<g class="entry-pin" data-kind="entry" style="cursor:pointer;">
      <circle cx="${ep.x}" cy="${ep.y}" r="16" fill="rgba(52,211,153,0.25)" stroke="#34D399" stroke-width="3"/>
      <path d="M ${ep.x-6} ${ep.y} L ${ep.x+6} ${ep.y} M ${ep.x+2} ${ep.y-4} L ${ep.x+6} ${ep.y} L ${ep.x+2} ${ep.y+4}" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="${ep.x-24}" y="${ep.y+18}" width="48" height="16" rx="4" fill="rgba(0,0,0,0.75)"/>
      <text x="${ep.x}" y="${ep.y+30}" text-anchor="middle" font-size="11" fill="#34D399" font-weight="700">ENTRADA</text>
    </g>`;
  }
  if(state.map.exitPoint){
    const xp = state.map.exitPoint;
    entryExit += `<g class="exit-pin" data-kind="exit" style="cursor:pointer;">
      <circle cx="${xp.x}" cy="${xp.y}" r="16" fill="rgba(252,165,165,0.25)" stroke="#FCA5A5" stroke-width="3"/>
      <path d="M ${xp.x-6} ${xp.y} L ${xp.x+6} ${xp.y} M ${xp.x+2} ${xp.y-4} L ${xp.x+6} ${xp.y} L ${xp.x+2} ${xp.y+4}" stroke="#FCA5A5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="${xp.x-20}" y="${xp.y+18}" width="40" height="16" rx="4" fill="rgba(0,0,0,0.75)"/>
      <text x="${xp.x}" y="${xp.y+30}" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="700">SALIDA</text>
    </g>`;
  }

  // Referencias en tierra
  let refs = '';
  state.map.refs.forEach(r=>{
    refs += `<g class="ref-pin" data-id="${r.id}">
      <circle cx="${r.x}" cy="${r.y}" r="13" fill="#00D2FF" stroke="#fff" stroke-width="2.5"/>
      <text x="${r.x}" y="${r.y+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">${esc(r.label.charAt(0).toUpperCase())}</text>
      <rect x="${r.x-30}" y="${r.y+14}" width="60" height="16" rx="4" fill="rgba(0,0,0,0.55)"/>
      <text x="${r.x}" y="${r.y+26}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${esc(r.label.slice(0,12))}</text>
    </g>`;
  });

  // Pins de olas, agrupados por celda+categoría
  const grouped = groupWavesByCell();
  let pins = '';
  Object.values(grouped).forEach(g=>{
    const cx = (g.col - 0.5) * cellW;
    const cy = (g.row - 0.5) * cellH;
    const colors = { mejor:'#F59E0B', media:'#9CA3AF', otra:'#B45309' };
    const c = colors[g.category];
    const baseR = g.category==='mejor' ? 16 : g.category==='media' ? 14 : 12;
    const r = baseR + Math.min(8, (g.count-1) * 2);
    // Dirección dominante del grupo (solo si ≥70% de las olas marcadas tienen una dirección)
    const dirCounts = { L:0, R:0, none:0 };
    g.waves.forEach(w => {
      if(w.direction === 'L') dirCounts.L++;
      else if(w.direction === 'R') dirCounts.R++;
      else dirCounts.none++;
    });
    const totalDir = dirCounts.L + dirCounts.R;
    let dom = null;
    if(totalDir > 0){
      if(dirCounts.L / totalDir >= 0.7) dom = 'L';
      else if(dirCounts.R / totalDir >= 0.7) dom = 'R';
      else if(dirCounts.L > 0 && dirCounts.R > 0) dom = 'mixed';
    }
    const label = g.count > 1 ? '×'+g.count : '1';
    // Convención surf: ola IZQUIERDA (surfista) se VE visualmente yendo a la derecha desde la playa.
    // Por eso la flecha visual del pin se invierte respecto al nombre.
    const arrow = dom === 'L' ? '→' : dom === 'R' ? '←' : dom === 'mixed' ? '⇄' : '';
    const displayText = arrow ? `${arrow} ${label}` : label;
    pins += `<g class="wave-pin" data-cell="${g.col}-${g.row}-${g.category}" style="cursor:pointer;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2.5"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="${displayText.length>2?10:11}" font-weight="700" fill="#0A1628">${displayText}</text>
    </g>`;
  });

  // Pin de predicción pendiente (cyan punteado pulsante)
  let predictionPin = '';
  if(state.activePrediction){
    const p = state.activePrediction;
    const pcx = (p.col - 0.5) * cellW;
    const pcy = (p.row - 0.5) * cellH;
    predictionPin = `<g style="pointer-events:none;">
      <circle cx="${pcx}" cy="${pcy}" r="18" fill="rgba(34,211,238,0.18)" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="4,3">
        <animate attributeName="r" values="18;22;18" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="${pcx}" y="${pcy+4}" text-anchor="middle" font-size="14" font-weight="700" fill="#22D3EE">🎯</text>
    </g>`;
  }
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    ${bg}${wave}${grid}${labels}${refLines}${freehandPaths}${entryExit}${refs}${pins}${predictionPin}
  </svg>`;
}
function renderLine(line, color, label){
  return `<g>
    <line x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" stroke="${color}" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>
    <text x="${Math.max(line.x1,line.x2)-4}" y="${Math.min(line.y1,line.y2)-6}" text-anchor="end" font-size="13" font-weight="700" fill="${color}">${label}</text>
  </g>`;
}
function groupWavesByCell(){
  const g = {};
  state.waves.forEach(w=>{
    const k = `${w.gridCol}-${w.gridRow}-${w.category}`;
    if(!g[k]) g[k] = { col:w.gridCol, row:w.gridRow, category:w.category, count:0, waves:[] };
    g[k].count++; g[k].waves.push(w);
  });
  return g;
}

/* ════════════════════════════════════════════════════════════════════
   MAP INTERACTION
   ════════════════════════════════════════════════════════════════════ */
function attachMapHandlers(){
  const svg = document.querySelector('#mapWrap svg'); if(!svg) return;
  svg.addEventListener('click', handleMapTap);
  svg.addEventListener('pointerdown', handleDrawStart);
  svg.addEventListener('pointermove', handleDrawMove);
  svg.addEventListener('pointerup', handleDrawEnd);
  svg.addEventListener('pointercancel', handleDrawEnd);
  svg.addEventListener('pointerleave', handleDrawEnd);
}

let _drawing = false;
let _drawingPath = '';
function svgCoordsFromEvent(e){
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const sx = MAP_W / rect.width;
  const sy = MAP_H / rect.height;
  return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
}
function handleDrawStart(e){
  if(state.activeMode !== 'draw') return;
  e.preventDefault();
  const {x,y} = svgCoordsFromEvent(e);
  _drawing = true;
  _drawingPath = `M ${x.toFixed(1)} ${y.toFixed(1)}`;
  const prev = document.getElementById('drawPreview');
  if(prev) prev.setAttribute('d', _drawingPath);
  e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
}
function handleDrawMove(e){
  if(!_drawing) return;
  e.preventDefault();
  const {x,y} = svgCoordsFromEvent(e);
  _drawingPath += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  const prev = document.getElementById('drawPreview');
  if(prev) prev.setAttribute('d', _drawingPath);
}
function handleDrawEnd(e){
  if(!_drawing) return;
  _drawing = false;
  // Solo guardar si tiene al menos un L (más de 1 punto)
  if(_drawingPath.includes(' L ')){
    state.map.freehand = state.map.freehand || [];
    state.map.freehand.push({ d: _drawingPath, color: '#ffffff', width: 2.8 });
    save();
    render();
  } else {
    const prev = document.getElementById('drawPreview');
    if(prev) prev.setAttribute('d', '');
  }
  _drawingPath = '';
}

function triggerPhotoUpload(){
  const inp = document.getElementById('photoInput');
  if(inp) inp.click();
}
function handlePhotoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 6 * 1024 * 1024){
    if(!confirm('La foto pesa '+(file.size/1024/1024).toFixed(1)+'MB. Puede ser lenta. ¿Continuar?')) return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    state.map.photoDataUrl = e.target.result;
    if(!state.map.photoOpacity) state.map.photoOpacity = 0.7;
    save();
    render();
    toast('Foto agregada');
  };
  reader.onerror = () => toast('Error leyendo la foto');
  reader.readAsDataURL(file);
  input.value = '';  // reset para poder re-subir la misma foto
}
function updatePhotoOpacity(){
  const img = document.getElementById('mapPhoto');
  if(img) img.setAttribute('opacity', state.map.photoOpacity || 0.7);
  const pct = document.getElementById('photoPct');
  if(pct) pct.textContent = Math.round((state.map.photoOpacity||0.7)*100)+'%';
}
function handleMapTap(e){
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = MAP_W / rect.width;
  const scaleY = MAP_H / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  if(x<0||y<0||x>MAP_W||y>MAP_H) return;

  const mode = state.activeMode;

  if(mode==='mejor' || mode==='media' || mode==='otra'){
    const cellW = MAP_W / GRID_COLS;
    const cellH = MAP_H / GRID_ROWS;
    let col, row;
    // Si el tap cayó sobre un pin existente, plantamos OTRA ola en la MISMA celda
    // (varias olas pueden romper en el mismo lugar; el contador ×N sube)
    const hitPin = e.target.closest('.wave-pin');
    if(hitPin){
      const [c,r] = hitPin.dataset.cell.split('-');
      col = parseInt(c); row = parseInt(r);
    } else {
      col = Math.floor(x / cellW) + 1;
      row = Math.floor(y / cellH) + 1;
      if(col<1||col>GRID_COLS||row<1||row>GRID_ROWS) return;
    }
    plantWave(col, row, mode);
    return;
  }

  if(mode==='predict'){
    const cellW = MAP_W / GRID_COLS;
    const cellH = MAP_H / GRID_ROWS;
    const col = Math.floor(x / cellW) + 1;
    const row = Math.floor(y / cellH) + 1;
    if(col<1||col>GRID_COLS||row<1||row>GRID_ROWS) return;
    recordPrediction(col, row);
    return;
  }

  if(mode==='line-out' || mode==='line-in' || mode==='line-ori'){
    if(!state.pendingLineStart){
      state.pendingLineStart = {x, y};
      save(); render();
    } else {
      const lineKey = mode==='line-out'?'outside':mode==='line-in'?'inside':'orilla';
      state.map.lines[lineKey] = { x1:state.pendingLineStart.x, y1:state.pendingLineStart.y, x2:x, y2:y };
      state.pendingLineStart = null;
      // Volver al modo MEJOR después de trazar línea
      state.activeMode = 'mejor';
      save(); render();
      toast(`Línea ${lineKey.toUpperCase()} marcada`);
    }
    return;
  }

  if(mode==='ref'){
    openRefNameModal(x, y);
    return;
  }

  if(mode==='entry'){
    state.map.entryPoint = { x, y };
    state.activeMode = 'mejor';
    save(); render();
    toast('Punto de ENTRADA marcado');
    return;
  }

  if(mode==='exit'){
    state.map.exitPoint = { x, y };
    state.activeMode = 'mejor';
    save(); render();
    toast('Punto de SALIDA marcado');
    return;
  }

  if(mode==='erase'){
    // Tap sobre entry/exit pin → borrar
    if(e.target.closest('.entry-pin')){
      if(confirm('¿Borrar punto de ENTRADA?')){ state.map.entryPoint = null; save(); render(); }
      return;
    }
    if(e.target.closest('.exit-pin')){
      if(confirm('¿Borrar punto de SALIDA?')){ state.map.exitPoint = null; save(); render(); }
      return;
    }
    // Tap sobre trazo libre → borrar ese trazo
    if(e.target.classList && e.target.classList.contains('freehand-path')){
      const idx = parseInt(e.target.dataset.fh);
      if(!isNaN(idx)){
        state.map.freehand.splice(idx, 1);
        save(); render();
        toast('Trazo borrado');
      }
      return;
    }
    // Si tap sobre pin → borrar todo el cluster (con confirm)
    if(e.target.closest('.wave-pin')){
      const cell = e.target.closest('.wave-pin').dataset.cell;
      const [c,r,cat] = cell.split('-');
      const matching = state.waves.filter(w=>w.gridCol==c && w.gridRow==r && w.category==cat);
      if(confirm(`¿Borrar ${matching.length} ola(s) ${cat.toUpperCase()} en ${rowToLetter(parseInt(r))}${c}?`)){
        state.waves = state.waves.filter(w=>!(w.gridCol==c && w.gridRow==r && w.category==cat));
        save(); render();
      }
      return;
    }
    // Tap sobre referencia → borrar
    if(e.target.closest('.ref-pin')){
      const id = e.target.closest('.ref-pin').dataset.id;
      const r = state.map.refs.find(x=>x.id===id);
      if(r && confirm(`¿Borrar referencia "${r.label}"?`)){
        state.map.refs = state.map.refs.filter(x=>x.id!==id);
        save(); render();
      }
      return;
    }
  }
}

function plantWave(col, row, category){
  const ts = nowMs() - state.timer.startedAt;
  state.waves.push({ id: uid(), gridCol: col, gridRow: row, category, ts, absTime: nowMs(), direction: state.activeDirection || null });
  // Si había una predicción pendiente y plantamos MEJOR, comparamos
  if(category === 'mejor' && state.activePrediction){
    checkPredictionAgainst(col, row);
  }
  save(); render();
}
function toggleDirection(dir){
  state.activeDirection = (state.activeDirection === dir) ? null : dir;
  save(); render();
}
function plantSameAsLast(){
  if(!state.waves.length){ toast('No hay olas aún'); return; }
  const last = state.waves[state.waves.length-1];
  plantWave(last.gridCol, last.gridRow, state.activeMode);
  toast(`+ misma · ${state.activeMode.toUpperCase()} en ${rowToLetter(last.gridRow)}${last.gridCol}`);
}
function setMode(mode){
  if(state.pendingLineStart && !mode.startsWith('line-')){
    state.pendingLineStart = null;  // cancela línea en proceso
  }
  state.activeMode = mode;
  save(); render();
}
function removeWave(id){
  state.waves = state.waves.filter(w=>w.id!==id);
  save(); render();
}

  if(waves.length<2) return '—';
  const intervals = [];
  for(let i=1; i<waves.length; i++) intervals.push(waves[i].ts - waves[i-1].ts);
  const avg = intervals.reduce((s,x)=>s+x,0) / intervals.length;
  return fmtMMSS(avg);
}

function renderNarrativeSummary(stats, cl){
  if(stats.mejor.count === 0 && stats.media.count === 0 && stats.otra.count === 0){
    return '';
  }
  const m = stats.mejor;
  const sp = state.config.spotName || 'el spot';
  const intro = `Hoy <strong>${esc(sp)}</strong> habló.`;
  let lines = [intro];

  if(m.count > 0){
    const mainCoord = `${rowToLetter(m.topCell.row)}${m.topCell.col}`;
    const refs = nearestRefs(m.topCell.col, m.topCell.row);
    const refLine = refs.length
      ? `alineadas con <strong>${refs.map(r=>r.label).join(' y ')}</strong>`
      : `en zona <strong>${mainCoord}</strong>`;
    const dirLine = m.dirDominant === 'L' ? ', casi siempre <strong>izquierdas</strong>'
                  : m.dirDominant === 'R' ? ', casi siempre <strong>derechas</strong>'
                  : m.dirDominant === 'mixed' ? ', mixtas izq/der'
                  : '';
    const intervalLine = m.avgInterval ? `, cada <strong>${fmtMMSS(m.avgInterval)}</strong>` : '';
    const setsLine = m.setsDetected ? ` Vienen en sets de <strong>${m.avgPerSet}</strong> olas cada <strong>${fmtMMSS(m.avgBetweenSets)}</strong>.` : '';
    lines.push(`Las <strong>mejores</strong> rompen ${refLine}${dirLine}${intervalLine}.${setsLine}`);
  }

  // Entrada / salida al agua
  const entryCell = state.map.entryPoint ? pointToCell(state.map.entryPoint) : null;
  const exitCell = state.map.exitPoint ? pointToCell(state.map.exitPoint) : null;
  if(entryCell || exitCell){
    const parts = [];
    if(entryCell) parts.push(`entrás por <strong style="color:#34D399;">${entryCell}</strong>`);
    if(exitCell) parts.push(`salís por <strong style="color:#FCA5A5;">${exitCell}</strong>`);
    lines.push(`Al agua ${parts.join(', ')}.`);
  }

  // Frase táctica final
  const obj = cl.heatObjective || 0;
  if(obj && m.count > 0){
    const score = (m.scoredCount >= 2 ? m.avgScore : cl.scores.mejor) || 0;
    const scoreMed = stats.media.scoredCount >= 2 ? stats.media.avgScore : cl.scores.media || 0;
    if(score + scoreMed >= obj){
      lines.push(`Para batir el heat de <strong>${obj}</strong> alcanza con una mejor + una media. Tu trabajo es estar donde están.`);
    } else if(stats.otra.count > 0){
      lines.push(`El heat de <strong>${obj}</strong> está apretado hoy. Mejor combinar volumen: dos medias + una otra.`);
    }
  } else if(m.count > 0 && stats.media.count > 0){
    lines.push(`Si la <strong>mejor</strong> no aparece, las <strong>medias</strong> en ${rowToLetter(stats.media.topCell.row)}${stats.media.topCell.col} salen seguido.`);
  }

  return `<section class="section" style="background:linear-gradient(135deg,rgba(0,210,255,.06),rgba(168,85,247,.04));border:1px solid rgba(0,210,255,.2);">
    <div class="section-h"><div class="section-t" style="color:#22D3EE;">Lo que el spot habló hoy</div></div>
    <div class="serif" style="font-size:18px;line-height:1.6;color:var(--text);font-style:italic;">
      ${lines.join(' ')}
    </div>
  </section>`;
}

function renderScoreSlider(key, val, color, lbl){
  return `<div class="score-row">
    <span style="color:${color};font-weight:700;font-size:14px;">${lbl.charAt(0)}</span>
    <input type="range" min="0" max="10" step="0.5" value="${val}" oninput="state.closing.scores.${key}=parseFloat(this.value);save();document.getElementById('sv_${key}').textContent=this.value;">
    <span class="score-val" id="sv_${key}" style="color:${color};">${val}</span>
  </div>`;
}
function renderReportBlock(cat, s, lbl, score){
  const cls = cat==='mejor'?'':cat==='media'?'silver':'bronze';
  if(!s.count) return `<div class="report-block ${cls}">
    <div class="report-cat-banner"><span class="report-cat-lbl">${lbl}</span><span class="report-cat-meta">sin olas</span></div>
    <div style="padding:14px;text-align:center;font-style:italic;color:var(--grey);font-size:12px;">No marcaste ninguna ola en esta categoría.</div>
  </div>`;

  // Zona principal con sus refs
  const mainCoord = `${rowToLetter(s.topCell.row)}${s.topCell.col}`;
  const refsForZone = nearestRefs(s.topCell.col, s.topCell.row);
  const refsText = refsForZone.length
    ? `entre <strong>${refsForZone.map(r=>r.label).join(' y ')}</strong>`
    : `coordenada <strong>${mainCoord}</strong>`;

  // Score real vs estimado
  let realScorePill = '';
  if(s.scoredCount > 0){
    const real = s.avgScore.toFixed(1);
    const diff = s.avgScore - score;
    const cls2 = Math.abs(diff) < 0.3 ? 'foam' : diff > 0 ? 'amber' : 'coral';
    const diffLbl = Math.abs(diff) < 0.3 ? '≈ coincide con estimado' : diff > 0 ? `+${diff.toFixed(1)} sobre estimado` : `${diff.toFixed(1)} bajo estimado`;
    realScorePill = `<span class="report-pill ${cls2}"><strong>${real}/10</strong> real · ${diffLbl}</span>`;
  }

  // Ritmo / sets
  let rhythmPill = '';
  if(s.setsDetected){
    rhythmPill = `<span class="report-pill"><strong>${s.setsDetected} set${s.setsDetected===1?'':'s'}</strong> · ${s.avgPerSet} olas/set · entre sets ${fmtMMSS(s.avgBetweenSets)}</span>`;
  }

  // Zonas alternativas (solo si hay 2+)
  let altsBlock = '';
  if(s.zones && s.zones.length >= 2){
    const alts = s.zones.slice(1);  // saltamos la primera (ya está en hero)
    altsBlock = `<div class="report-alt-section">
      <div class="report-alt-title">🎯 OTRAS ${alts.length} ZONA${alts.length===1?'':'S'} POSIBLE${alts.length===1?'':'S'} · el atleta elige según sus tools</div>
      ${alts.map((z,i)=>{
        const zRefs = nearestRefs(z.col, z.row);
        const zRefStr = zRefs.length ? zRefs.map(r=>r.label).join(', ') : 'sin referencia cerca';
        const scoreStr = z.avgScore !== null ? `score ${z.avgScore.toFixed(1)}` : 'sin score';
        const intStr = z.avgInterval ? `cada ${fmtMMSS(z.avgInterval)}` : 'ola única';
        const dirStr = z.dirDom === 'L' ? ` · <span style="color:#22D3EE;font-weight:700;">IZQ→</span>`
                      : z.dirDom === 'R' ? ` · <span style="color:#FBBF24;font-weight:700;">←DER</span>`
                      : z.dirDom === 'mixed' ? ` · <span style="color:var(--text-soft);">mixta</span>`
                      : '';
        return `<div class="report-alt-row">
          <span class="report-alt-num">${i+2}</span>
          <span class="report-alt-coord">${rowToLetter(z.row)}${z.col}</span>
          <span class="report-alt-refs">${esc(zRefStr)}</span>
          <span class="report-alt-data">${z.count} ola${z.count===1?'':'s'} · ${scoreStr} · ${intStr}${dirStr}</span>
        </div>`;
      }).join('')}
    </div>`;
  }

  // Dirección dominante de la categoría
  const dirLabel = s.dirDominant === 'L' ? 'OLAS IZQUIERDAS'
                  : s.dirDominant === 'R' ? 'OLAS DERECHAS'
                  : s.dirDominant === 'mixed' ? `Mixto (${s.dirCounts.L} izq · ${s.dirCounts.R} der)`
                  : '';
  const dirColor = s.dirDominant === 'L' ? '#22D3EE' : s.dirDominant === 'R' ? '#FBBF24' : 'var(--text-soft)';
  const dirPill = s.dirDominant
    ? `<span class="report-pill" style="background:${s.dirDominant==='L'?'rgba(34,211,238,.15)':s.dirDominant==='R'?'rgba(251,191,36,.15)':'rgba(255,255,255,.06)'};border-color:${dirColor};color:${dirColor};font-weight:700;">${s.dirDominant==='R'?'← ':''}${dirLabel}${s.dirDominant==='L'?' →':''}${s.dirDominant!=='mixed'?` · ${Math.round(s.dirRatio*100)}%`:''}</span>`
    : '';

  return `<div class="report-block ${cls}">
    <div class="report-cat-banner">
      <span class="report-cat-lbl">${lbl}</span>
      <span class="report-cat-meta">${s.count} ola${s.count===1?'':'s'} · estimado ${score}/10</span>
    </div>

    <div class="report-hero">
      <div class="report-hero-row">
        <span class="report-hero-coord">${mainCoord}</span>
        <span class="report-hero-arrow">→</span>
        <span class="report-hero-time">cada ${fmtMMSS(s.avgInterval)}</span>
      </div>
      <div class="report-hero-sub">Aquí salen las ${lbl.toLowerCase()} · ${refsText}${s.dirDominant && s.dirDominant!=='mixed' ? ` · son <strong style="color:${dirColor};">${s.dirDominant==='L'?'OLAS IZQUIERDAS →':'← OLAS DERECHAS'}</strong>` : ''}</div>
    </div>

    ${(realScorePill || rhythmPill || dirPill) ? `<div class="report-strip">
      ${dirPill}
      ${realScorePill}
      ${rhythmPill}
    </div>` : ''}

    ${altsBlock}
  </div>`;
}
function renderPlan(stats, cl){
  const obj = cl.heatObjective || 0;
  if(!obj || stats.mejor.count + stats.media.count + stats.otra.count === 0){
    return `<div class="plan-card"><div class="plan-h">🏁 Plan táctico</div><div class="report-stat">Definí un objetivo de heat para generar el plan.</div></div>`;
  }
  // Si hay suficientes scores reales (≥2 por categoría), usamos avg real en vez del estimado
  const MIN_SCORED = 2;
  const score = {
    mejor: (stats.mejor.scoredCount >= MIN_SCORED) ? stats.mejor.avgScore : cl.scores.mejor,
    media: (stats.media.scoredCount >= MIN_SCORED) ? stats.media.avgScore : cl.scores.media,
    otra:  (stats.otra.scoredCount  >= MIN_SCORED) ? stats.otra.avgScore  : cl.scores.otra,
  };
  const usingReal = {
    mejor: stats.mejor.scoredCount >= MIN_SCORED,
    media: stats.media.scoredCount >= MIN_SCORED,
    otra:  stats.otra.scoredCount  >= MIN_SCORED,
  };
  const realityChip = (cat) => usingReal[cat] ? `<span style="font-size:9px;background:rgba(52,211,153,.18);color:var(--foam);padding:1px 5px;border-radius:6px;font-weight:700;margin-left:3px;">REAL</span>` : '';
  const combos = [
    { name:`1 MEJOR${realityChip('mejor')} + 1 MEDIA${realityChip('media')}`, total: score.mejor + score.media, requires:{mejor:1,media:1} },
    { name:`2 MEJOR${realityChip('mejor')}`, total: score.mejor*2, requires:{mejor:2} },
    { name:`2 MEDIA${realityChip('media')} + 1 OTRA${realityChip('otra')}`, total: score.media*2 + score.otra, requires:{media:2,otra:1} },
    { name:`1 MEJOR${realityChip('mejor')} + 1 OTRA${realityChip('otra')}`, total: score.mejor + score.otra, requires:{mejor:1,otra:1} },
    { name:`3 OTRA${realityChip('otra')}`, total: score.otra*3, requires:{otra:3} },
  ];
  const validForData = combos.filter(c=>{
    return (c.requires.mejor||0) <= stats.mejor.count
        && (c.requires.media||0) <= stats.media.count
        && (c.requires.otra||0)  <= stats.otra.count;
  });
  const sufficient = validForData.filter(c=>c.total >= obj);
  if(!sufficient.length){
    const best = validForData.sort((a,b)=>b.total-a.total)[0];
    return `<div class="plan-card" style="border-color:rgba(252,165,165,.4);background:rgba(252,165,165,.06);">
      <div class="plan-h" style="color:var(--coral);">⚠ HEAT OBJETIVO ${obj} · NO FACTIBLE HOY</div>
      ${best?`<div class="plan-line">El mejor combo posible da <strong>${best.total.toFixed(1)}</strong> (faltan <strong>${(obj-best.total).toFixed(1)}</strong>).</div>`:''}
      <div class="plan-line" style="color:var(--gold-text);">Subí el score potencial si la ola lo justifica, o ajustá el objetivo.</div>
    </div>`;
  }
  const primary = sufficient[0];
  const backup = sufficient[1] || sufficient[0];
  return `<div class="plan-card">
    <div class="plan-h">🏁 PLAN PARA EL HEAT · OBJETIVO ${obj}</div>
    <div class="plan-line win">✓ Plan A: <strong>${primary.name}</strong> = ${primary.total.toFixed(1)} · factible</div>
    ${backup !== primary ? `<div class="plan-line">↺ Plan B: <strong>${backup.name}</strong> = ${backup.total.toFixed(1)}</div>` : ''}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   STATS
   ════════════════════════════════════════════════════════════════════ */
function computeStats(){
  const totalMs = state.timer.finished
    ? (state.timer.endedAt || nowMs()) - state.timer.startedAt
    : nowMs() - (state.timer.startedAt || nowMs());
  const totalMin = Math.max(1, Math.round(totalMs / 60000));
  return {
    totalMin,
    totalMs,
    mejor: statsForCategory('mejor'),
    media: statsForCategory('media'),
    otra:  statsForCategory('otra'),
  };
}
function statsForCategory(category){
  const waves = state.waves.filter(w=>w.category===category).sort((a,b)=>a.ts-b.ts);
  if(!waves.length) return { count:0 };
  // Top cell: la celda con más pins
  const cellCount = {};
  waves.forEach(w=>{
    const k = `${w.gridCol}-${w.gridRow}`;
    cellCount[k] = (cellCount[k]||0) + 1;
  });
  const topKey = Object.entries(cellCount).sort((a,b)=>b[1]-a[1])[0][0];
  const [tc, tr] = topKey.split('-').map(Number);
  // Hot zones: detecta hasta 3 zonas separadas por al menos 2 celdas
  // Cada zona ranquea por (count × avgScore) para priorizar densidad + calidad
  const zones = findHotZones(waves);
  // Intervalo promedio
  let avgInterval = 0;
  if(waves.length > 1){
    const intervals = [];
    for(let i=1; i<waves.length; i++) intervals.push(waves[i].ts - waves[i-1].ts);
    avgInterval = intervals.reduce((s,x)=>s+x,0) / intervals.length;
  }
  // Score promedio real (de las olas que tienen score asignado)
  const scoredWaves = waves.filter(w => typeof w.score === 'number' && w.score > 0);
  const scoredCount = scoredWaves.length;
  const avgScore = scoredCount ? (scoredWaves.reduce((s,w)=>s+w.score, 0) / scoredCount) : null;
  // Dirección dominante (L/R/mixed/none)
  const dirCounts = { L:0, R:0, none:0 };
  waves.forEach(w => {
    if(w.direction === 'L') dirCounts.L++;
    else if(w.direction === 'R') dirCounts.R++;
    else dirCounts.none++;
  });
  const totalDir = dirCounts.L + dirCounts.R;
  let dirDominant = null;
  let dirRatio = 0;
  if(totalDir > 0){
    const lRatio = dirCounts.L / totalDir;
    const rRatio = dirCounts.R / totalDir;
    if(lRatio >= 0.7){ dirDominant = 'L'; dirRatio = lRatio; }
    else if(rRatio >= 0.7){ dirDominant = 'R'; dirRatio = rRatio; }
    else dirDominant = 'mixed';
  }
  // Detección de sets: 3+ olas en <2 min consecutivas
  const SET_GAP = 120000;
  const sets = [];
  let cur = [waves[0]];
  for(let i=1; i<waves.length; i++){
    if(waves[i].ts - waves[i-1].ts <= SET_GAP){
      cur.push(waves[i]);
    } else {
      if(cur.length >= 3) sets.push(cur);
      cur = [waves[i]];
    }
  }
  if(cur.length >= 3) sets.push(cur);
  const setsDetected = sets.length;
  const avgPerSet = setsDetected ? Math.round(sets.reduce((s,x)=>s+x.length,0) / setsDetected) : 0;
  let avgBetweenSets = 0;
  if(setsDetected > 1){
    const gaps = [];
    for(let i=1; i<sets.length; i++) gaps.push(sets[i][0].ts - sets[i-1][sets[i-1].length-1].ts);
    avgBetweenSets = gaps.reduce((s,x)=>s+x,0) / gaps.length;
  }
  return { count: waves.length, topCell:{col:tc, row:tr}, avgInterval, setsDetected, avgPerSet, avgBetweenSets, scoredCount, avgScore, zones, dirCounts, dirDominant, dirRatio };
}

function findHotZones(waves){
  // Agrupa por celda exacta
  const byCell = {};
  waves.forEach(w=>{
    const k = `${w.gridCol}-${w.gridRow}`;
    if(!byCell[k]) byCell[k] = { col:w.gridCol, row:w.gridRow, waves:[] };
    byCell[k].waves.push(w);
  });
  // Por cada celda, calcula stats
  const cells = Object.values(byCell).map(c=>{
    const scored = c.waves.filter(w=>typeof w.score === 'number' && w.score > 0);
    const avgScore = scored.length ? scored.reduce((s,w)=>s+w.score,0)/scored.length : null;
    const sortedTs = c.waves.map(w=>w.ts).sort((a,b)=>a-b);
    const intervals = [];
    for(let i=1; i<sortedTs.length; i++) intervals.push(sortedTs[i]-sortedTs[i-1]);
    const avgInterval = intervals.length ? intervals.reduce((s,x)=>s+x,0)/intervals.length : null;
    // Dirección dominante de esta celda
    let dL=0, dR=0;
    c.waves.forEach(w => { if(w.direction==='L') dL++; else if(w.direction==='R') dR++; });
    const tDir = dL + dR;
    let dirDom = null;
    if(tDir > 0){
      if(dL/tDir >= 0.7) dirDom = 'L';
      else if(dR/tDir >= 0.7) dirDom = 'R';
      else if(dL>0 && dR>0) dirDom = 'mixed';
    }
    // Ranking: prioriza densidad × calidad (si hay score, ponderado; si no, solo count)
    const rank = c.waves.length * (avgScore !== null ? avgScore : 5);
    return { col:c.col, row:c.row, count:c.waves.length, avgScore, avgInterval, rank, dirDom, dirL:dL, dirR:dR };
  });
  cells.sort((a,b)=>b.rank - a.rank);
  // Selecciona hasta 3 zonas separadas por al menos 2 celdas de distancia
  const selected = [];
  for(const c of cells){
    if(selected.length >= 3) break;
    const tooClose = selected.some(s => Math.abs(s.col-c.col) <= 1 && Math.abs(s.row-c.row) <= 1);
    if(!tooClose) selected.push(c);
  }
  return selected;
}
function nearestRefs(col, row){
  if(!state.map.refs.length) return [];
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;
  const cx = (col - 0.5) * cellW;
  const cy = (row - 0.5) * cellH;
  const withDist = state.map.refs.map(r=>({ ...r, d: Math.hypot(r.x-cx, r.y-cy) }));
  withDist.sort((a,b)=>a.d-b.d);
  return withDist.slice(0, 2).filter(r=>r.d < MAP_W*0.4);
}

/* ════════════════════════════════════════════════════════════════════
   REPLAY TEMPORAL · ver los pins apareciendo en orden de tiempo (30 seg)
   ════════════════════════════════════════════════════════════════════ */
let _replayTimers = [];
let _replayInterval = null;
function openReplay(){
  if(!state.waves.length){ toast('No hay olas para reproducir'); return; }
  const sorted = [...state.waves].sort((a,b)=>a.ts-b.ts);
  const maxTs = sorted[sorted.length-1].ts;
  const REPLAY_DURATION = 30000; // 30 segundos total
  let m = document.querySelector('.modal-overlay'); if(m) m.remove();
  m = document.createElement('div'); m.className='modal-overlay'; m.id='replayModal';
  m.innerHTML = `<div class="modal" style="max-width:560px;max-height:92vh;overflow-y:auto;">
    <div class="modal-h">
      <div>
        <div class="modal-t">▶ Replay del análisis</div>
        <div style="font-size:11px;color:var(--grey);margin-top:2px;font-family:'DM Mono',monospace;">${state.waves.length} olas en 30 seg · ${Math.round(maxTs/60000)} min reales</div>
      </div>
      <button class="modal-x" onclick="closeReplay()">×</button>
    </div>
    <div id="replayMapWrap" style="position:relative;background:#021126;border-radius:12px;overflow:hidden;">
      ${renderReplayMapEmpty()}
    </div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:11px;">
      <span style="color:var(--text-soft);">Min reales: <strong id="replayMinReal" style="color:var(--text);font-size:14px;">0:00</strong></span>
      <span style="color:var(--text-soft);">Olas: <strong id="replayCount" style="color:var(--text);font-size:14px;">0 / ${state.waves.length}</strong></span>
    </div>
    <div style="height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:8px;overflow:hidden;">
      <div id="replayBar" style="height:100%;background:linear-gradient(90deg,#22D3EE,#FBBF24);width:0%;transition:width .1s linear;"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-ghost btn-block" onclick="closeReplay()">Cerrar</button>
      <button class="btn btn-cyan btn-block" onclick="openReplay()">↺ Repetir</button>
    </div>
  </div>`;
  m.onclick = e => { if(e.target===m) closeReplay(); };
  document.body.appendChild(m);
  // Schedule cada pin en su tiempo proporcional
  _replayTimers.forEach(t => clearTimeout(t));
  _replayTimers = [];
  if(_replayInterval) clearInterval(_replayInterval);
  const svg = document.querySelector('#replayMapWrap svg');
  const pinsLayer = svg ? svg.querySelector('#replayPins') : null;
  const startedAt = Date.now();
  sorted.forEach((w, idx) => {
    const proportion = maxTs > 0 ? (w.ts / maxTs) : 0;
    const delay = proportion * (REPLAY_DURATION - 200) + 100;  // 100ms primero, último a 29.9s
    const t = setTimeout(() => {
      if(!pinsLayer) return;
      const cellW = MAP_W / GRID_COLS;
      const cellH = MAP_H / GRID_ROWS;
      const cx = (w.gridCol - 0.5) * cellW;
      const cy = (w.gridRow - 0.5) * cellH;
      const colors = { mejor:'#F59E0B', media:'#9CA3AF', otra:'#B45309' };
      const c = colors[w.category];
      const r = w.category==='mejor' ? 14 : w.category==='media' ? 11 : 9;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze"/>
          <animate attributeName="r" from="${r*1.6}" to="${r}" dur="0.3s" fill="freeze"/>
        </circle>`;
      pinsLayer.appendChild(g);
      const countEl = document.getElementById('replayCount');
      if(countEl) countEl.textContent = `${idx+1} / ${state.waves.length}`;
    }, delay);
    _replayTimers.push(t);
  });
  // Update progress + min real cada 100ms
  _replayInterval = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    if(elapsed >= REPLAY_DURATION){ clearInterval(_replayInterval); _replayInterval = null; }
    const pct = Math.min(100, (elapsed / REPLAY_DURATION) * 100);
    const bar = document.getElementById('replayBar');
    if(bar) bar.style.width = pct + '%';
    const minReal = (elapsed / REPLAY_DURATION) * (maxTs / 60000);
    const minRealEl = document.getElementById('replayMinReal');
    if(minRealEl) minRealEl.textContent = fmtMMSS(elapsed / REPLAY_DURATION * maxTs);
  }, 80);
}
function renderReplayMapEmpty(){
  // Mismo SVG que renderMapSVG pero con un layer <g id="replayPins"> vacío para que se llene en vivo
  // Y SIN los pins ya existentes
  const cellW = MAP_W / GRID_COLS;
  const cellH = MAP_H / GRID_ROWS;
  const hasPhoto = !!state.map.photoDataUrl;
  const bg = `<defs>
    <linearGradient id="ocReplay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031b3d"/><stop offset="35%" stop-color="#0a5a8a"/><stop offset="55%" stop-color="#19a3c4"/><stop offset="72%" stop-color="#a8e4d3"/><stop offset="85%" stop-color="#e6c889"/><stop offset="100%" stop-color="#5a7a3c"/>
    </linearGradient>
  </defs>
  ${hasPhoto
    ? `<rect width="${MAP_W}" height="${MAP_H}" fill="#021126"/><image href="${state.map.photoDataUrl}" x="0" y="0" width="${MAP_W}" height="${MAP_H}" preserveAspectRatio="xMidYMid slice" opacity="${state.map.photoOpacity||0.7}"/>`
    : `<rect width="${MAP_W}" height="${MAP_H}" fill="url(#ocReplay)"/>`}`;
  let grid = '<g stroke="rgba(236,72,153,0.45)" stroke-width="0.6">';
  for(let r=1; r<GRID_ROWS; r++) grid += `<line x1="0" y1="${r*cellH}" x2="${MAP_W}" y2="${r*cellH}"/>`;
  for(let c=1; c<GRID_COLS; c++) grid += `<line x1="${c*cellW}" y1="0" x2="${c*cellW}" y2="${MAP_H}"/>`;
  grid += '</g>';
  let refLines = '';
  if(state.map.lines.outside) refLines += renderLine(state.map.lines.outside, '#A855F7', 'OUT');
  if(state.map.lines.inside)  refLines += renderLine(state.map.lines.inside,  '#F59E0B', 'IN');
  if(state.map.lines.orilla)  refLines += renderLine(state.map.lines.orilla,  '#00D2FF', 'OR');
  let refs = '';
  state.map.refs.forEach(r=>{
    refs += `<g><circle cx="${r.x}" cy="${r.y}" r="10" fill="#00D2FF" stroke="#fff" stroke-width="2"/><text x="${r.x}" y="${r.y+3}" text-anchor="middle" font-size="11" font-weight="700" fill="#0A1628">${esc(r.label.charAt(0).toUpperCase())}</text></g>`;
  });
  // Entry/exit points en el replay también
  let replayEE = '';
  if(state.map.entryPoint){
    const ep = state.map.entryPoint;
    replayEE += `<g><circle cx="${ep.x}" cy="${ep.y}" r="12" fill="rgba(52,211,153,0.3)" stroke="#34D399" stroke-width="2.5"/><text x="${ep.x}" y="${ep.y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">IN</text></g>`;
  }
  if(state.map.exitPoint){
    const xp = state.map.exitPoint;
    replayEE += `<g><circle cx="${xp.x}" cy="${xp.y}" r="12" fill="rgba(252,165,165,0.3)" stroke="#FCA5A5" stroke-width="2.5"/><text x="${xp.x}" y="${xp.y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#FCA5A5">OUT</text></g>`;
  }
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;">
    ${bg}${grid}${refLines}${replayEE}${refs}<g id="replayPins"></g>
  </svg>`;
}
function closeReplay(){
  _replayTimers.forEach(t => clearTimeout(t));
  _replayTimers = [];
  if(_replayInterval){ clearInterval(_replayInterval); _replayInterval = null; }
  document.querySelector('.modal-overlay')?.remove();
}

function goBackToObserve(){
  if(!confirm('Volver a marcar olas? El cronómetro se reanuda donde estaba.')) return;
  state.screen = 'observe';
  state.timer.finished = false;
  save(); render();
  startTimerLoop();
}
