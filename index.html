/* ════════════════════════════════════════════════════════════════════
   BELT MODAL — Cambio rápido de cinta sin hacer eval completa
   ════════════════════════════════════════════════════════════════════ */
async function openBeltModal(athleteId){
  let m = document.getElementById('beltModal'); if(m) m.remove();
  // Get athlete current belt
  let ath = (S.athletes||[]).find(a=>a.id===athleteId) || {};
  let currentBelt = ath.current_belt;
  try { const{data}=await db.from('tss_profiles').select('current_belt,name').eq('id',athleteId).single(); if(data){ currentBelt=data.current_belt; ath.name=data.name||ath.name; } } catch(e){}

  m = document.createElement('div'); m.className='modal-overlay'; m.id='beltModal';
  const pills = BELTS.map(b=>{
    const isOn = currentBelt===b.id;
    return `<button type="button" class="opt-pill belt-pill" data-belt="${b.id}" onclick="pickBeltModal('${b.id}',this)" style="border:2px solid ${b.color};${isOn?`background:${b.color};color:${b.text};`:''}padding:14px 12px;font-size:13px;font-weight:800;flex:1;min-width:90px;">${b.name}</button>`;
  }).join('');
  m.innerHTML = `<div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-title">🎗 Cinta de ${esc(ath.name||'')}</div>
      <button class="btn-icon" onclick="closeModal('beltModal')">✕</button>
    </div>
    <div style="padding:6px 0;">
      <p style="font-size:12px;color:var(--grey);margin-bottom:14px;">Selecciona la cinta que corresponde al atleta. Se guarda al instante.</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${pills}</div>
      <input type="hidden" id="bm-belt" value="${currentBelt||''}">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-cyan" style="flex:1;" onclick="saveBeltOnly('${athleteId}')">💾 Guardar</button>
        ${currentBelt?`<button class="btn btn-red" style="width:auto;padding:14px;" onclick="clearBelt('${athleteId}')">🗑 Quitar</button>`:''}
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) closeModal('beltModal'); };
}

function pickBeltModal(beltId, btn){
  btn.closest('.modal-sheet').querySelectorAll('.belt-pill').forEach(b=>{
    b.classList.remove('on');
    b.style.background='transparent';
    b.style.color='var(--white)';
  });
  const belt = getBelt(beltId);
  btn.classList.add('on');
  btn.style.background = belt.color;
  btn.style.color = belt.text;
  document.getElementById('bm-belt').value = beltId;
}

async function saveBeltOnly(athleteId){
  const belt = gv('bm-belt');
  if(!belt){ toast('Selecciona una cinta','error'); return; }
  showLoad(true);
  try {
    const{error}=await db.from('tss_profiles').update({current_belt:belt}).eq('id',athleteId);
    if(error) throw error;
    const idx=(S.athletes||[]).findIndex(a=>a.id===athleteId);
    if(idx>=0) S.athletes[idx].current_belt = belt;
    toast('✅ Cinta actualizada a '+getBelt(belt).name,'success');
    closeModal('beltModal');
    if(S.view==='perfil') vPerfil(athleteId, (S.athletes||[]).find(a=>a.id===athleteId)?.name);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function clearBelt(athleteId){
  if(!confirm('¿Quitar la cinta del atleta?')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_profiles').update({current_belt:null}).eq('id',athleteId);
    if(error) throw error;
    const idx=(S.athletes||[]).findIndex(a=>a.id===athleteId);
    if(idx>=0) S.athletes[idx].current_belt = null;
    toast('Cinta eliminada','success');
    closeModal('beltModal');
    if(S.view==='perfil') vPerfil(athleteId, (S.athletes||[]).find(a=>a.id===athleteId)?.name);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

function buildPillarRadar(evals){
  if(!evals || !evals.length){
    return `<div class="card" style="margin-bottom:12px;text-align:center;padding:20px;">
      <div style="font-size:32px;margin-bottom:4px;">📊</div>
      <p style="font-size:11px;color:var(--grey);">Aún no hay evaluaciones · El gráfico aparecerá cuando se haga la primera</p>
    </div>`;
  }
  // Promedio de las últimas 3 evals (más representativo que la última)
  const recent = evals.slice(0,3);
  const avg = key => {
    const vs = recent.map(e=>e[key]).filter(v=>v);
    return vs.length ? (vs.reduce((a,b)=>a+b,0)/vs.length) : 0;
  };
  const data = [
    {label:'Físico',  icon:'🏃', key:'physical',  value:avg('physical'),  color:'var(--green)'},
    {label:'Técnico', icon:'🎯', key:'technique', value:avg('technique'), color:'var(--cyan)'},
    {label:'Táctico', icon:'♟️', key:'tactical',  value:avg('tactical'),  color:'var(--purple)'},
    {label:'Mental',  icon:'🧠', key:'mindset',   value:avg('mindset'),   color:'var(--amber)'},
  ];
  const totalNonZero = data.filter(d=>d.value>0).length;
  const avgTotal = totalNonZero ? (data.filter(d=>d.value>0).reduce((s,d)=>s+d.value,0)/totalNonZero).toFixed(1) : '—';

  const rows = data.map(d=>{
    const pct = (d.value/5)*100;
    const val = d.value>0 ? d.value.toFixed(1) : '—';
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;">${d.icon}</span>
          <span style="font-size:11px;font-weight:700;color:var(--white);letter-spacing:.5px;">${d.label}</span>
        </div>
        <span style="font-size:13px;font-weight:900;color:${d.color};font-family:'Space Mono',monospace;">${val}/5</span>
      </div>
      <div style="background:var(--bg3);border-radius:6px;height:10px;overflow:hidden;position:relative;">
        <div style="height:100%;width:${pct}%;background:${d.color};border-radius:6px;transition:width .6s ease;"></div>
        ${d.value>0?[1,2,3,4].map(t=>`<div style="position:absolute;top:0;bottom:0;left:${t*20}%;width:1px;background:rgba(0,0,0,.25);"></div>`).join(''):''}
      </div>
    </div>`;
  }).join('');

  return `<div class="card card-cyan" style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--cyan);">🏄 SCORE POR PILAR</div>
      <div style="font-size:9px;color:var(--grey);">Prom. últ. ${recent.length} eval${recent.length>1?'s':''}</div>
    </div>
    ${rows}
    <div style="margin-top:8px;padding-top:10px;border-top:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;color:var(--grey);">Score global</span>
      <span style="font-size:20px;font-weight:900;color:var(--cyan);font-family:'Space Mono',monospace;">${avgTotal}/5</span>
    </div>
  </div>`;
}

function accordionToggle(id){
  const body = document.getElementById(id+'-body');
  const icon = document.getElementById(id+'-icon');
  if(!body) return;
  if(body.style.display==='none'){ body.style.display='block'; icon.style.transform='rotate(180deg)'; }
  else { body.style.display='none'; icon.style.transform='rotate(0deg)'; }
}

async function saveInfoCompleta(athleteId){
  const num = id => { const v=gv('ic-'+id); return v?parseFloat(v):null; };
  const txt = id => gv('ic-'+id) || null;
  const payload = {
    // Personales
    email: txt('email'), phone: txt('phone'), dui: txt('dui'),
    birth_date: txt('birth_date'), address: txt('address'),
    // Físicos
    weight_kg: num('weight_kg'), height_cm: num('height_cm'),
    stance: txt('stance'), discipline: txt('discipline'),
    years_surfing: num('years_surfing'),
    // Médicos
    blood_type: txt('blood_type'), allergies: txt('allergies'),
    medications: txt('medications'), medical_conditions: txt('medical_conditions'),
    medical_history: txt('medical_history'),
    doctor_name: txt('doctor_name'), doctor_phone: txt('doctor_phone'),
    insurance_provider: txt('insurance_provider'),
    insurance_number: txt('insurance_number'),
    // Emergencia
    emergency_name: txt('emergency_name'),
    emergency_relationship: txt('emergency_relationship'),
    emergency_phone: txt('emergency_phone'),
    emergency_phone_alt: txt('emergency_phone_alt'),
    // Metas
    goal_short_term: txt('goal_short_term'),
    goal_mid_term: txt('goal_mid_term'),
    goal_long_term: txt('goal_long_term'),
    why_train: txt('why_train'),
  };
  showLoad(true);
  try {
    const{error}=await db.from('tss_profiles').update(payload).eq('id',athleteId);
    if(error) throw error;
    // Refrescar cache local
    const idx=(S.athletes||[]).findIndex(a=>a.id===athleteId);
    if(idx>=0) S.athletes[idx] = {...S.athletes[idx], ...payload};
    toast('✅ Información guardada','success');
    closeModal('infoCompletaModal');
    if(S.view==='perfil') vPerfil(athleteId, (S.athletes||[]).find(a=>a.id===athleteId)?.name || S.user.name);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

      const fisKeys=['fis_remada','fis_resistencia_olas','fis_respiracion'];
      const avg = keys => { const vs=keys.map(k=>ev[k]).filter(v=>v); return vs.length ? (vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1) : null; };
      const tec=avg(tecKeys), tac=avg(tacKeys), men=avg(menKeys), fis=avg(fisKeys);

          </div>
          <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
            ${ev.final_ranking?`<span class="chip chip-green">🏆 ${esc(ev.final_ranking)}</span>`:''}
            <button class="btn-icon" onclick="event.stopPropagation();deleteCompEval('${ev.id}')" style="background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);width:24px;height:24px;border-radius:6px;font-size:11px;padding:0;">🗑</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;">
          ${cell('🏄 Técnico',tec,'var(--amber)')}
          ${cell('♟️ Táctica',tac,'var(--purple)')}
          ${cell('🧠 Mental',men,'var(--cyan)')}
          ${cell('💪 Físico',fis,'var(--green)')}
        </div>
        ${ev.diag_fortaleza_principal?`<p style="font-size:11px;color:var(--green);">💪 ${esc(ev.diag_fortaleza_principal.substring(0,80))}${ev.diag_fortaleza_principal.length>80?'…':''}</p>`:''}
        ${ev.diag_limitacion_principal?`<p style="font-size:11px;color:var(--amber);margin-top:3px;">⚠️ ${esc(ev.diag_limitacion_principal.substring(0,80))}${ev.diag_limitacion_principal.length>80?'…':''}</p>`:''}

  } catch(e){ el.innerHTML=''; console.error(e); }

async function genPDF(athleteId, athleteName){
  toast('Generando PDF...','info');
  try {
    const[{data:evals},{data:checkins},{data:compEvalsPdf},{data:presFbPdf}]=await Promise.all([
      db.from('tss_evaluations').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}),
      db.from('tss_daily_checkins').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}),
      db.from('tss_comp_evaluations').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}),
      db.from('tss_presencial_feedbacks').select('*,tss_presencial_sessions(title,date,pilar)').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('id',{ascending:false}),
    ]);
    // Load presencial sessions for this athlete
    let sessions = [];
    try {
      const{data:allPres}=await db.from('tss_presencial_sessions').select('*').gte('date',OFFICIAL_START).order('date',{ascending:false}).limit(50);
      sessions = (allPres||[]).filter(s => {
        try { const ids = s.athlete_ids ? (Array.isArray(s.athlete_ids)?s.athlete_ids:JSON.parse(s.athlete_ids||'[]')) : []; return ids.includes(athleteId); } catch(e){ return false; }
      });
    } catch(e){}

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm',format:'a4'});
    const W=210, M=15;
    let y=15;
    // Color helpers for white-background PDF
    const darkText=()=>doc.setTextColor(30,30,40);
    const greyText=()=>doc.setTextColor(90,100,110);
    const cyanText=()=>doc.setTextColor(0,160,190);
    const greenText=()=>doc.setTextColor(20,140,60);
    const redText=()=>doc.setTextColor(200,50,50);
    const amberText=()=>doc.setTextColor(180,120,0);

    // Header bar
    doc.setFillColor(0,180,210);
    doc.rect(0,0,W,16,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text('TSS — THE SURF SEQUENCE®',M,10);
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text('El Salvador 2026',W-M,10,{align:'right'});

    y=26;
    darkText();
    doc.setFontSize(18); doc.setFont('helvetica','bold');
    doc.text(athleteName,M,y); y+=7;
    greyText(); doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text('Reporte generado: '+new Date().toLocaleDateString('es-SV'),M,y); y+=10;

    // Índice de Rendimiento (4 pilares puros 1-5, ignora nulls)
    const scores=(evals||[]).map(e=>{
      const v=[e.physical,e.technique,e.tactical,e.mindset].filter(x=>x&&x>0);
      return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;
    }).filter(Boolean);
    const ws=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'N/A';
    doc.setFillColor(240,248,252);
    doc.roundedRect(M,y,W-M*2,20,3,3,'F');
    doc.setDrawColor(0,180,210); doc.setLineWidth(0.5);
    doc.roundedRect(M,y,W-M*2,20,3,3,'S');
    cyanText(); doc.setFontSize(13); doc.setFont('helvetica','bold');
    doc.text('INDICE DE RENDIMIENTO: '+ws+'/5',M+8,y+8);
    greyText(); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(scores.length+' evaluaciones | '+((sessions||[]).length)+' sesiones | '+((checkins||[]).length)+' check-ins',M+8,y+15);
    y+=28;

    // Performance dimension bar chart — 4 pilares puros (1-5)
    if(evals&&evals.length){
      const last=evals[0];
      const dims=[
        {k:'physical', l:'Fisico',  c:[34,197,94]},
        {k:'technique',l:'Tecnico', c:[0,180,210]},
        {k:'tactical', l:'Tactico', c:[168,85,247]},
        {k:'mindset',  l:'Mental',  c:[245,158,11]}
      ];
      doc.setFontSize(10); doc.setFont('helvetica','bold'); darkText();
      doc.text('PERFIL DE RENDIMIENTO',M,y); y+=2;
      doc.setDrawColor(0,180,210); doc.setLineWidth(0.3); doc.line(M,y,W-M,y); y+=6;
      dims.forEach(d=>{
        const val=last[d.k]||0;
        greyText(); doc.setFontSize(8); doc.setFont('helvetica','normal');
        doc.text(d.l,M,y+3);
        const barX=M+30; const barW=100; const barH=6;
        doc.setFillColor(230,235,240); doc.roundedRect(barX,y,barW,barH,2,2,'F');
        if(val){
          doc.setFillColor(...d.c); doc.roundedRect(barX,y,barW*(val/5),barH,2,2,'F');
        }
        darkText(); doc.setFontSize(9); doc.setFont('helvetica','bold');
        doc.text((val||'—')+'/5',barX+barW+4,y+4.5);
        y+=10;
      });
      // Rendimiento Competitivo aparte (no es pilar puro)
      if(last.competitive){
        greyText(); doc.setFontSize(8); doc.setFont('helvetica','normal');
        doc.text('Competitivo',M,y+3);
        const barX=M+30; const barW=100; const barH=6;
        doc.setFillColor(230,235,240); doc.roundedRect(barX,y,barW,barH,2,2,'F');
        doc.setFillColor(230,160,0); doc.roundedRect(barX,y,barW*(last.competitive/5),barH,2,2,'F');
        darkText(); doc.setFontSize(9); doc.setFont('helvetica','bold');
        doc.text(last.competitive+'/5',barX+barW+4,y+4.5);
        y+=10;
      }
      y+=4;
    }

    // Evaluations detail
    if(evals&&evals.length){
      cyanText(); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('EVALUACIONES DEL COACH',M,y); y+=2;
      doc.setDrawColor(0,180,210); doc.line(M,y,W-M,y); y+=5;
      evals.forEach(ev=>{
        if(y>255){doc.addPage();y=20;}
        darkText(); doc.setFontSize(9); doc.setFont('helvetica','bold');
        doc.text(fmtDate(ev.date),M,y);
        const _v=[ev.physical,ev.technique,ev.tactical,ev.mindset].filter(x=>x&&x>0);
        const avg=_v.length?(_v.reduce((a,b)=>a+b,0)/_v.length).toFixed(1):'—';
        cyanText(); doc.text('Promedio: '+avg+'/5',M+45,y); y+=5;
        greyText(); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text('Fisico: '+(ev.physical||'—')+'  Tecnico: '+(ev.technique||'—')+'  Tactico: '+(ev.tactical||'—')+'  Mental: '+(ev.mindset||'—')+'  Comp: '+(ev.competitive||'—'),M+4,y); y+=5;
        if(ev.strengths){ greenText(); const ln=doc.splitTextToSize('+ '+ev.strengths,W-M*2-8); doc.text(ln,M+4,y); y+=ln.length*4; }
        if(ev.limitations){ redText(); const ln=doc.splitTextToSize('- '+ev.limitations,W-M*2-8); doc.text(ln,M+4,y); y+=ln.length*4; }
        if(ev.recommendations){ greyText(); const ln=doc.splitTextToSize('> '+ev.recommendations,W-M*2-8); doc.text(ln,M+4,y); y+=ln.length*4; }
        y+=3;
      });
    }

    // Presencial Sessions
    if(sessions&&sessions.length){
      if(y>240){doc.addPage();y=20;}
      cyanText(); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('SESIONES PRESENCIALES',M,y); y+=2;
      doc.setDrawColor(0,180,210); doc.line(M,y,W-M,y); y+=5;
      sessions.forEach(s=>{
        if(y>265){doc.addPage();y=20;}
        darkText(); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text(fmtDate(s.date)+' — '+s.title,M,y);
        greyText(); doc.setFont('helvetica','normal');
        const stLbl=s.status==='done'?'Completada':s.status==='live'?'En Curso':'Planificada';
        doc.text((s.duration_min?s.duration_min+' min':'')+ ' | '+stLbl+(s.pilar?' | '+s.pilar:''),M+80,y); y+=4;
        if(s.mission){ greyText(); const lines=doc.splitTextToSize('Mision: '+s.mission,W-M*2-8); doc.text(lines,M+4,y); y+=lines.length*4; }
        y+=2;
      });
    }

    // Presencial Feedbacks
    if(presFbPdf&&presFbPdf.length){
      if(y>240){doc.addPage();y=20;}
      cyanText(); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('FEEDBACK DE SESIONES (COACH)',M,y); y+=2;
      doc.setDrawColor(0,180,210); doc.line(M,y,W-M,y); y+=5;
      presFbPdf.forEach(fb=>{
        if(y>260){doc.addPage();y=20;}
        const sess=fb.tss_presencial_sessions;
        darkText(); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text((sess?.date?fmtDate(sess.date):'')+' — '+(sess?.title||'Sesion'),M,y); y+=4;
        greyText(); doc.setFont('helvetica','normal');
        const parts=[];
        if(fb.focus_rating) parts.push('Enfoque: '+fb.focus_rating+'/5');
        if(fb.frustration_rating) parts.push('Frustracion: '+fb.frustration_rating+'/5');
        if(fb.achieved) parts.push('Objetivo: '+fb.achieved);
        doc.text(parts.join(' | '),M+4,y); y+=4;
        if(fb.coach_note){ greyText(); const lines=doc.splitTextToSize(fb.coach_note,W-M*2-8); doc.text(lines,M+4,y); y+=lines.length*4; }
        y+=2;
      });
    }

    // Comp Training Results from checkins
    const ctPdfResults=[];
    (checkins||[]).forEach(ci=>{
      if(!ci.sesion_result) return;
      try{const sr=JSON.parse(ci.sesion_result);Object.entries(sr).forEach(([k,v])=>{
        if(v&&typeof v==='object'&&v.waves&&Array.isArray(v.waves)) ctPdfResults.push({date:ci.date,...v});
      });}catch(e){}
    });
    if(ctPdfResults.length){
      if(y>240){doc.addPage();y=20;}
      doc.setTextColor(245,158,11);
      doc.setFontSize(11); doc.setFont('helvetica','bold');
      doc.text('ENTRENOS DE COMPETENCIA',M,y); y+=6;
      doc.setDrawColor(245,158,11); doc.setLineWidth(0.3);
      doc.line(M,y,W-M,y); y+=5;
      const isaLbl=(s)=>s>=8?'Excelente':s>=6?'Bueno':s>=4?'Promedio':s>=2?'Regular':'Pobre';
      ctPdfResults.forEach(r=>{
        if(y>265){doc.addPage();y=20;}
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
        doc.text(fmtDate(r.date),M,y);
        doc.setTextColor(245,158,11);
        doc.text('Total: '+(r.total||0).toFixed(2)+' | Mejor: '+(r.best1||0).toFixed(1)+' ('+isaLbl(r.best1||0)+') + '+(r.best2||0).toFixed(1)+' ('+isaLbl(r.best2||0)+')',M+30,y); y+=4;
        doc.setFont('helvetica','normal'); doc.setTextColor(107,138,154);
        const info=[];
        if(r.mission) info.push('Mision: '+r.mission);
        if(r.focus) info.push('Enfoque: '+r.focus+'/5');
        if(info.length) doc.text(info.join(' | '),M+4,y); y+=4;
        if(r.comments){const lines=doc.splitTextToSize(r.comments,W-M*2-8);doc.setTextColor(150,170,180);doc.text(lines,M+4,y);y+=lines.length*4;}
        y+=2;
      });
    }

    // Competition Evaluations
    if(compEvalsPdf&&compEvalsPdf.length){
      if(y>240){doc.addPage();y=20;}
      amberText(); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('EVALUACIONES DE COMPETENCIA',M,y); y+=2;
      doc.setDrawColor(200,140,0); doc.setLineWidth(0.3);
      doc.line(M,y,W-M,y); y+=5;
      compEvalsPdf.forEach(ev=>{
        if(y>260){doc.addPage();y=20;}
        darkText(); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text(fmtDate(ev.date)+' — '+ev.event_name,M,y);
        greyText(); doc.setFont('helvetica','normal');
        const info=[];
        if(ev.athlete_category) info.push(ev.athlete_category);
        if(ev.round_reached) info.push(ev.round_reached);
        if(ev.final_ranking) info.push('Ranking: '+ev.final_ranking);
        doc.text(info.join(' | '),M+80,y); y+=4;
        if(ev.avg_wave_score||ev.highest_wave){
          cyanText();
          doc.text('Prom. Olas: '+(ev.avg_wave_score||'—')+' | Mejor Ola: '+(ev.highest_wave||'—')+(ev.heat_total?' | Heat Total: '+ev.heat_total:''),M+4,y); y+=4;
        }
        const compNote = ev.what_worked||ev.what_failed||ev.diagnosis||'';
        if(compNote){ greyText(); const lines=doc.splitTextToSize(compNote,W-M*2-8); doc.text(lines,M+4,y); y+=lines.length*4; }
        y+=2;
      });
    }

    // Check-ins summary with mini chart
    if(checkins&&checkins.length){
      if(y>230){doc.addPage();y=20;}
      cyanText(); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('CHECK-INS DIARIOS',M,y); y+=2;
      doc.setDrawColor(0,180,210); doc.line(M,y,W-M,y); y+=6;

      // Summary stats boxes
      const avgE=(checkins.reduce((s,c)=>s+(c.energy_level||0),0)/checkins.length).toFixed(1);
      const avgF=(checkins.reduce((s,c)=>s+(c.focus_level||0),0)/checkins.length).toFixed(1);
      const goals=checkins.filter(c=>c.goal_achieved==='Si').length;
      const totalSurf=checkins.reduce((s,c)=>s+(parseFloat(c.surf_hours)||0),0);
      const boxW=(W-M*2-12)/4;
      [{l:'Energía Prom',v:avgE+'/5',c:[0,180,210]},{l:'Enfoque Prom',v:avgF+'/5',c:[130,80,220]},{l:'Objetivos',v:goals+'/'+checkins.length,c:[20,180,80]},{l:'Horas Surf',v:totalSurf.toFixed(1)+'h',c:[230,160,0]}].forEach((b,i)=>{
        const bx=M+i*(boxW+4);
        doc.setFillColor(245,248,252); doc.roundedRect(bx,y,boxW,16,2,2,'F');
        doc.setDrawColor(...b.c); doc.setLineWidth(0.4); doc.roundedRect(bx,y,boxW,16,2,2,'S');
        doc.setTextColor(...b.c); doc.setFontSize(11); doc.setFont('helvetica','bold');
        doc.text(String(b.v),bx+boxW/2,y+7,{align:'center'});
        doc.setTextColor(90,100,110); doc.setFontSize(6); doc.setFont('helvetica','normal');
        doc.text(b.l,bx+boxW/2,y+12.5,{align:'center'});
      });
      y+=22;

      // Energy trend mini bar chart (last 10 check-ins)
      const recent=checkins.slice(0,10).reverse();
      if(recent.length>=3){
        greyText(); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text('Tendencia de Energia (ultimos '+recent.length+' dias)',M,y); y+=4;
        const chartW=W-M*2; const chartH=18; const barGap=2;
        const bw=(chartW-barGap*(recent.length-1))/recent.length;
        doc.setFillColor(240,243,248); doc.rect(M,y,chartW,chartH,'F');
        recent.forEach((c,i)=>{
          const val=c.energy_level||0;
          const h=chartH*(val/5);
          const bx=M+i*(bw+barGap);
          const clr=val>=4?[20,180,80]:val>=3?[230,180,0]:[220,60,60];
          doc.setFillColor(...clr); doc.rect(bx,y+chartH-h,bw,h,'F');
          doc.setTextColor(60,70,80); doc.setFontSize(5);
          doc.text(String(val),bx+bw/2,y+chartH+3.5,{align:'center'});
        });
        y+=chartH+8;
      }

      // Check-in table
      if(y>255){doc.addPage();y=20;}
      // Table header
      doc.setFillColor(0,180,210); doc.rect(M,y,W-M*2,6,'F');
      doc.setTextColor(255,255,255); doc.setFontSize(6); doc.setFont('helvetica','bold');
      const cols=[{t:'Fecha',x:M+2},{t:'Agua',x:M+32},{t:'Energia',x:M+50},{t:'Enfoque',x:M+68},{t:'Surf',x:M+86},{t:'Objetivo',x:M+102},{t:'Nutricion',x:M+122}];
      cols.forEach(c=>doc.text(c.t,c.x,y+4));
      y+=7;
      checkins.slice(0,20).forEach((c,i)=>{
        if(y>280){doc.addPage();y=20;}
        if(i%2===0){ doc.setFillColor(245,248,252); doc.rect(M,y-1,W-M*2,5.5,'F'); }
        darkText(); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text(c.date||'',M+2,y+3);
        doc.text((c.water_glasses||0)+' vasos',M+32,y+3);
        doc.text((c.energy_level||0)+'/5',M+50,y+3);
        doc.text((c.focus_level||0)+'/5',M+68,y+3);
        doc.text((parseFloat(c.surf_hours)||0)+'h',M+86,y+3);
        const gc=c.goal_achieved==='Si'?[20,140,60]:c.goal_achieved==='Parcial'?[200,140,0]:[150,150,160];
        doc.setTextColor(...gc);
        doc.text(c.goal_achieved||'—',M+102,y+3);
        darkText(); doc.text(c.nutrition||'—',M+122,y+3);
        y+=5.5;
      });
    }

    // Footer
    const pages=doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(70,96,112);
      doc.text('© TSS — The Surf Sequence® | Propiedad intelectual de Marcelo Castellanos',M,290);
      doc.text(`${i}/${pages}`,W-M,290,{align:'right'});
    }

    doc.save(`TSS_${athleteName.replace(/ /g,'_')}_${todayStr()}.pdf`);
    toast('✅ PDF generado','success');
  } catch(e){ toast('Error generando PDF','error'); console.error(e); }
}

/* ============================================================
   ATLETAS (COACH / ACOACH)
============================================================ */
function vAtletas(){
  const isCoach = S.user.role === 'coach';
  // F1: head coach ve tabs Atletas | Coaches; acoach ve solo atletas (sin tabs)
  if(isCoach){
    render(`<div class="page-title">Equipo</div>
    <div class="page-sub">Atletas y staff</div>
    <div class="inner-tabs">
      <button class="itab active" id="it-team-athletes" onclick="vTeamTab('athletes')">🌊 Atletas</button>
      <button class="itab" id="it-team-coaches" onclick="vTeamTab('coaches')">🏆 Coaches</button>
    </div>
    <div id="teamTabContent"></div>`);
    vTeamTab('athletes');
    return;
  }
  // Vista acoach: solo atletas de sus grupos (ya filtrados en bootApp)
  render(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <div><div class="page-title" style="margin-bottom:0;">Atletas</div><div class="page-sub">Perfil completo y reporte</div></div>
  </div>
  ${S.athletes.length?S.athletes.map(a=>`<div class="ath-row" onclick="openAthProfile('${a.id}','${escAttr(a.name)}')">
    ${a.avatar_url?`<img src="${a.avatar_url}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--cyan);">`:`<div class="ath-avatar">${a.name.charAt(0)}</div>`}
    <div class="ath-info"><div class="ath-name">${a.name} ${a.injury?'<span style="color:var(--red);font-size:11px;">🚨</span>':''}</div><div class="ath-meta">Ver perfil · Índice · PDF</div></div>
    <span style="color:var(--grey);font-size:18px;">›</span>
  </div>`).join(''):'<div class="empty"><div class="empty-icon">👥</div><p class="empty-txt">No tenés atletas asignados todavía. Pedile al head coach que te asigne un grupo.</p></div>'}`);
}

function vTeamTab(t){
  document.querySelectorAll('.inner-tabs .itab').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('it-team-'+t); if(btn) btn.classList.add('active');
  const el=document.getElementById('teamTabContent'); if(!el) return;
  if(t==='athletes'){
    el.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="btn btn-cyan btn-sm" onclick="openAddUserModal('athlete')">+ Agregar Atleta</button>
    </div>
    ${S.athletes.map(a=>`<div class="ath-row" onclick="openAthProfile('${a.id}','${escAttr(a.name)}')">
      ${a.avatar_url?`<img src="${a.avatar_url}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--cyan);">`:`<div class="ath-avatar">${a.name.charAt(0)}</div>`}
      <div class="ath-info"><div class="ath-name">${a.name} ${a.injury?'<span style="color:var(--red);font-size:11px;">🚨</span>':''}</div><div class="ath-meta">Ver perfil · Índice · PDF</div></div>
      <span style="color:var(--grey);font-size:18px;">›</span>
    </div>`).join('')}`;
  } else if(t==='coaches'){
    const list = (S.coaches||[]);
    el.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="btn btn-cyan btn-sm" onclick="openAddUserModal('coach')">+ Agregar Coach</button>
    </div>
    ${list.length?list.map(c=>{
      const roleLabel = c.role==='coach'?'Head Coach':'Coach Asistente';
      const roleColor = c.role==='coach'?'var(--amber)':'var(--purple)';
      const myGroups = (S.groups||[]).filter(g=>g.coach_id===c.id).map(g=>g.name);
      const isSelf = c.id===S.user.id;
      return `<div class="ath-row">
        ${c.avatar_url?`<img src="${c.avatar_url}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;">`:`<div class="ath-avatar" style="background:rgba(245,158,11,.1);color:${roleColor};">${c.name.charAt(0)}</div>`}
        <div class="ath-info">
          <div class="ath-name">${c.name}${isSelf?' <span style="font-size:10px;color:var(--cyan);">(vos)</span>':''}</div>
          <div class="ath-meta"><span style="color:${roleColor};">${roleLabel}</span>${myGroups.length?' · '+myGroups.join(', '):' · sin grupo'}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-xs btn-outline" onclick="openEditUserModal('${c.id}')">✏️</button>
          ${isSelf?'':`<button class="btn btn-xs" style="background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);" onclick="confirmDeactivate('${c.id}','${escAttr(c.name)}',true)">🗑</button>`}
        </div>
      </div>`;
    }).join(''):'<div class="empty"><div class="empty-icon">🏆</div><p class="empty-txt">Sin coaches creados. Tocá "+ Agregar Coach" para invitar uno.</p></div>'}`;
  }
}

// F1: Modal unificado de creación de usuario (atleta / coach asistente / head coach)
function openAddUserModal(initialRole){
  const role = initialRole || 'athlete';
  const m = document.createElement('div');
  m.className = 'modal-overlay'; m.id = 'addUserModal';
  m.innerHTML = `<div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-title">➕ Nuevo Usuario</div>
      <button class="modal-close" onclick="closeModal('addUserModal')">✕</button>
    </div>
    <label class="inp-label">Tipo de usuario</label>
    <select class="inp" id="newUserRole" onchange="renderAddUserStanceField()">
      <option value="athlete"${role==='athlete'?' selected':''}>🌊 Atleta</option>
      <option value="acoach"${role==='acoach'?' selected':''}>📋 Coach Asistente</option>

async function saveNewUser(){
  const role = document.getElementById('newUserRole')?.value || 'athlete';
  const name = document.getElementById('newAthName')?.value?.trim();
  const pin = document.getElementById('newAthPin')?.value?.trim();
  if(!name){ toast('Ingresa el nombre','error'); return; }
  if(!pin || pin.length !== 4 || isNaN(pin)){ toast('El PIN debe ser exactamente 4 dígitos','error'); return; }
  if(pin==='0000'){ toast('Ese PIN no se permite, elige otro','error'); return; }
  showLoad(true);
  try {
    // Validar PIN único en TODA la tabla (atletas + coaches activos)
    const{data:exists}=await db.from('tss_profiles').select('id').eq('pin',pin).neq('active',false).limit(1);
    if(exists && exists.length){ toast('Ese PIN ya está en uso, elige otro','error'); showLoad(false); return; }
    const payload = { user_id: crypto.randomUUID(), name, role, pin, active: true };
    if(role==='athlete'){
      payload.stance = document.getElementById('newStanceGoofy')?.classList.contains('btn-cyan')?'Goofy':'Regular';
    }
    const{data,error} = await db.from('tss_profiles').insert(payload).select().single();
    if(error) throw error;
    // Refrescar listas locales
    if(role==='athlete'){ S.athletes.push(data); }
    else { (S.coaches||[]).push(data); S.coaches.sort((a,b)=>a.name.localeCompare(b.name)); }
    const labels={athlete:'atleta', acoach:'coach asistente', coach:'head coach'};
    toast(`✅ ${name} agregado como ${labels[role]||role}`,'success');
    closeModal('addUserModal');
    vAtletas();
  } catch(e){ toast('Error al crear usuario: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

async function uploadAvatar(athleteId){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    // Resize if too large
    if(file.size > 2*1024*1024){ toast('Imagen muy grande, máximo 2MB','error'); return; }
    showLoad(true);
    try {
      const ext = file.name.split('.').pop();
      const path = `${athleteId}.${ext}`;
      const { error: upErr } = await db.storage.from('avatars').upload(path, file, {upsert:true});
      if(upErr) throw upErr;
      const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
      const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
      const { error: dbErr } = await db.from('tss_profiles').update({avatar_url: avatarUrl}).eq('id', athleteId);
      if(dbErr) throw dbErr;
      // Update local cache
      const ath = S.athletes.find(a=>a.id===athleteId);
      if(ath) ath.avatar_url = avatarUrl;
      if(athleteId === S.user.id){ S.user.avatar_url = avatarUrl; updateHeaderAvatar(); }
      toast('✅ Foto actualizada','success');
      vPerfil(athleteId, athleteId===S.user.id ? S.user.name : S.athletes.find(a=>a.id===athleteId)?.name);
    } catch(e){ toast('Error al subir foto: '+e.message,'error'); console.error(e); }
    finally{ showLoad(false); }
  };
  input.click();
}

function getWeekDays(offset=0){
  const now=new Date(new Date().toLocaleString('en-US', {timeZone:'America/El_Salvador'}));
  const day=now.getDay()||7;
  const mon=new Date(now); mon.setDate(now.getDate()-day+1+(offset*7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d.toISOString().split('T')[0]; });
}

async function openWeeklyReport(athleteId, athleteName, weekOffset=0){
  const days = getWeekDays(weekOffset);
  const mon = days[0]; const sun = days[6];

  // Show modal with loading
  let m = document.getElementById('weeklyReportModal');

  m = document.createElement('div');

      db.from('tss_daily_checkins').select('*').eq('athlete_id',athleteId).gte('date',mon).lte('date',sun),

    const ciMap = {}; (checkins||[]).forEach(c=>ciMap[c.date]=c);

      try{ const ids=s.athlete_ids?JSON.parse(s.athlete_ids):[];return ids.includes(athleteId);}catch(e){return false;}

    const presMap = {};
    myPres.forEach(s=>{ if(!presMap[s.date]) presMap[s.date]=[]; presMap[s.date].push(s); });

    const totalDays = 7;
    const checkinDays = (checkins||[]).length;

          <div style="font-size:24px;font-weight:900;color:var(--purple);font-family:'Space Mono',monospace;">${goals}/${checkinDays||0}</div>
