      <button class="btn btn-cyan" style="width:100%;" onclick="genMonthlyPDF(document.getElementById('monthlyAthSel').value)">📄 Generar PDF</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)closeModal('monthlyAthModal');};
}

/* ════════════════════════════════════════════════════════════════════
   MÓDULO: REPORTES PDF — Mensual equipo e individual (federación)
   genMonthlyPDF, openMonthlyAthleteSelect, genWeeklyPDF
   ════════════════════════════════════════════════════════════════════ */
async function genMonthlyPDF(athleteIdOrTeam){
  try {
    showLoad(true);
    // Get previous month range
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const lastDay = new Date(now.getFullYear(), now.getMonth(), 0);
    const mon = firstDay.toISOString().split('T')[0];
    const sun = lastDay.toISOString().split('T')[0];
    const monthName = firstDay.toLocaleString('es',{month:'long',year:'numeric'});

    const isTeam = athleteIdOrTeam==='team';
    const athletes = isTeam ? S.athletes : S.athletes.filter(a=>a.id===athleteIdOrTeam);
    if(!athletes.length){ toast('No hay atletas','error'); return; }

    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm',format:'a4'});
    const M=15; const pw=210-M*2;

    for(let ai=0; ai<athletes.length; ai++){
      const ath = athletes[ai];
      if(ai>0) doc.addPage();
      let y=M;

      // Load data for this athlete (floor to OFFICIAL_START for clean reports)
      const moFloor = mon > OFFICIAL_START ? mon : OFFICIAL_START;
      const [ciRes,evalRes,sessRes,compEvRes,fbRes] = await Promise.all([
        db.from('tss_daily_checkins').select('*').eq('athlete_id',ath.id).gte('date',moFloor).lte('date',sun).order('date'),
        db.from('tss_evaluations').select('*').eq('athlete_id',ath.id).gte('date',moFloor).lte('date',sun).order('date'),
        db.from('tss_presencial_sessions').select('*').gte('date',moFloor).lte('date',sun).order('date'),
        db.from('tss_comp_evaluations').select('*').eq('athlete_id',ath.id).gte('date',moFloor).lte('date',sun).order('date'),
        db.from('tss_presencial_feedbacks').select('*,tss_presencial_sessions(title,date)').eq('athlete_id',ath.id).gte('date',OFFICIAL_START).order('id',{ascending:false}),
      ]);
      const compEvalsMo = compEvRes.data||[];
      const presFbMo = (fbRes.data||[]).filter(fb=>fb.tss_presencial_sessions?.date>=mon && fb.tss_presencial_sessions?.date<=sun);
      const checkins = ciRes.data||[];
      const evals = evalRes.data||[];
      const sessions = (sessRes.data||[]).filter(s=>{
        try{ const ids=Array.isArray(s.athlete_ids)?s.athlete_ids:JSON.parse(s.athlete_ids||'[]'); return ids.includes(ath.id); }catch(e){return false;}
      });

      // HEADER
      doc.setFillColor(5,10,15); doc.rect(0,0,210,297,'F');
      doc.setFillColor(0,201,232); doc.rect(0,0,210,22,'F');
      doc.setTextColor(5,10,15); doc.setFontSize(13); doc.setFont('helvetica','bold');
      doc.text('TSS — The Surf Sequence',M,10);
      doc.setFontSize(9); doc.setFont('helvetica','normal');
      doc.text('El Salvador National Surf Team',M,16);
      doc.setTextColor(5,10,15); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('REPORTE MENSUAL',210-M,10,{align:'right'});
      doc.text(monthName.toUpperCase(),210-M,16,{align:'right'});
      y=30;

      // ATHLETE NAME
      doc.setTextColor(232,240,245); doc.setFontSize(14); doc.setFont('helvetica','bold');
      doc.text(ath.name,M,y); y+=3;
      doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=6;

      // SUMMARY STATS
      const totalSurf = checkins.reduce((s,ci)=>s+(parseFloat(ci.surf_hours)||0),0);
      const avgEnergy = checkins.length ? (checkins.reduce((s,ci)=>s+(ci.energy_level||0),0)/checkins.length).toFixed(1) : '—';
      const avgFocus = checkins.length ? (checkins.reduce((s,ci)=>s+(ci.focus_level||0),0)/checkins.length).toFixed(1) : '—';
      const goalsAchieved = checkins.filter(ci=>ci.goal_achieved==='Si').length;
      const checkinsTotal = checkins.filter(ci=>ci.water_glasses||ci.energy_level).length;
      const avgPct = checkins.length ? Math.round(checkins.reduce((s,ci)=>s+(ci.progress_pct||0),0)/checkins.length) : 0;

      // Last eval for index
      const lastEval = evals.length ? evals[evals.length-1] : null;
      const _v=lastEval?[lastEval.physical,lastEval.technique,lastEval.tactical,lastEval.mindset].filter(x=>x&&x>0):[];
      const idx4 = _v.length ? (_v.reduce((a,b)=>a+b,0)/_v.length).toFixed(1) : '—';

      // Stats boxes
      const stats = [
        {l:'Horas Surf',v:totalSurf.toFixed(1)+'h'},
        {l:'Check-ins',v:checkinsTotal+'/'+checkins.length},
        {l:'Energía Prom',v:avgEnergy+'/5'},
        {l:'Enfoque Prom',v:avgFocus+'/5'},
        {l:'Objetivos',v:goalsAchieved},
        {l:'% Plan Prom',v:avgPct+'%'},
        {l:'Sesiones',v:sessions.length},
        {l:'Índice Final',v:idx4+'/5'},
      ];
      const bw=(pw)/4; const bh=16;
      stats.forEach((s,i)=>{
        const col=i%4; const row=Math.floor(i/4);
        const bx=M+col*bw; const by=y+row*(bh+3);
        doc.setFillColor(12,20,32); doc.roundedRect(bx,by,bw-2,bh,2,2,'F');
        doc.setDrawColor(0,201,232); doc.setLineWidth(0.3); doc.roundedRect(bx,by,bw-2,bh,2,2,'S');
        doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text(s.v,bx+(bw-2)/2,by+6,{align:'center'});
        doc.setTextColor(100,140,160); doc.setFontSize(6); doc.setFont('helvetica','normal');
        doc.text(s.l,bx+(bw-2)/2,by+11,{align:'center'});
      });
      y+=38;

      // EVALUACIONES DEL COACH
      if(evals.length){
        if(y>250){doc.addPage();y=20;}
        doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('EVALUACIONES DEL COACH',M,y); y+=2;
        doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
        evals.forEach(ev=>{
          if(y>270){doc.addPage();y=20;}
          const _ev=[ev.physical,ev.technique,ev.tactical,ev.mindset].filter(x=>x&&x>0);
          const evIdx=_ev.length?(_ev.reduce((a,b)=>a+b,0)/_ev.length).toFixed(1):'—';
          doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,18,2,2,'F');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
          doc.text(ev.date,M+3,y+5);
          doc.setTextColor(0,201,232); doc.setFontSize(10);
          doc.text('Índice: '+evIdx+'/5',M+pw-3,y+5,{align:'right'});
          doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(180,200,210);
          const breakdown=`Físico: ${ev.physical||'—'}  Técnico: ${ev.technique||'—'}  Táctico: ${ev.tactical||'—'}  Mental: ${ev.mindset||'—'}  Comp: ${ev.competitive||'—'}`;
          doc.text(breakdown,M+3,y+10);
          if(ev.strengths){ doc.setTextColor(100,200,140); doc.text('+ '+ev.strengths.substring(0,80),M+3,y+15); }
          y+=22;
        });
        y+=4;
      }

      // SESIONES PRESENCIALES
      if(sessions.length){
        if(y>250){doc.addPage();y=20;}
        doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('SESIONES PRESENCIALES',M,y); y+=2;
        doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
        sessions.forEach(s=>{
          if(y>275){doc.addPage();y=20;}
          doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,10,2,2,'F');
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(232,240,245);
          const sLine=`${s.date}  ${s.time_start||''}  ${s.title||''}`;
          doc.text(sLine,M+3,y+6);
          const statusColor = s.status==='done'?[34,197,94]:[245,158,11];
          doc.setTextColor(...statusColor);
          doc.text(s.status==='done'?'✓ Completada':'Programada',M+pw-3,y+6,{align:'right'});
          y+=13;
        });
        y+=4;
      }

      // FEEDBACK DE SESIONES
      if(presFbMo.length){
        if(y>250){doc.addPage();y=20;}
        doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('FEEDBACK DE SESIONES (COACH)',M,y); y+=2;
        doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
        presFbMo.forEach(fb=>{
          if(y>270){doc.addPage();y=20;}
          const sess=fb.tss_presencial_sessions;
          doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,12,2,2,'F');
          doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
          doc.text(`${sess?.date||''} — ${sess?.title||'Sesion'}`,M+3,y+5);
          doc.setFont('helvetica','normal'); doc.setTextColor(180,200,210);
          const parts=[];
          if(fb.focus_rating) parts.push('Enfoque:'+fb.focus_rating+'/5');
          if(fb.frustration_rating) parts.push('Frust:'+fb.frustration_rating+'/5');
          if(fb.achieved) parts.push('Obj:'+fb.achieved);
          doc.text(parts.join(' | '),M+3,y+9);
          if(fb.coach_note){ doc.setTextColor(150,170,180); doc.text(fb.coach_note.substring(0,90),M+pw/2,y+5); }
          y+=15;
        });
        y+=4;
      }

      // EVALUACIONES DE COMPETENCIA
      if(compEvalsMo.length){
        if(y>250){doc.addPage();y=20;}
        doc.setTextColor(245,158,11); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('COMPETENCIAS',M,y); y+=2;
        doc.setDrawColor(245,158,11); doc.line(M,y,210-M,y); y+=5;
        compEvalsMo.forEach(ev=>{
          if(y>270){doc.addPage();y=20;}
          doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,10,2,2,'F');
          doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
          doc.text(`${ev.date} — ${ev.event_name}`,M+3,y+5);
          doc.setFont('helvetica','normal'); doc.setTextColor(0,201,232);
          const info=[];
          if(ev.avg_wave_score) info.push('Prom:'+ev.avg_wave_score);
          if(ev.highest_wave) info.push('Mejor:'+ev.highest_wave);
          if(ev.final_ranking) info.push(ev.final_ranking);
          doc.text(info.join(' | '),M+pw-3,y+5,{align:'right'});
          y+=13;
        });
        y+=4;
      }

      // PROGRESO SEMANAL (mini chart - text based)
      if(checkins.length){
        if(y>240){doc.addPage();y=20;}
        doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('REGISTRO DIARIO',M,y); y+=2;
        doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
        // Header row
        doc.setFillColor(5,15,25); doc.rect(M,y,pw,7,'F');
        doc.setFontSize(6); doc.setFont('helvetica','bold'); doc.setTextColor(0,201,232);
        const cols2=[{t:'Fecha',x:M+3},{t:'Agua',x:M+38},{t:'Energía',x:M+58},{t:'Enfoque',x:M+78},{t:'Surf h',x:M+98},{t:'Objetivo',x:M+118},{t:'% Plan',x:M+140}];
        cols2.forEach(col=>doc.text(col.t,col.x,y+4.5));
        y+=8;
        checkins.forEach(ci=>{
          if(y>278){doc.addPage();y=20;}
          const rowBg = checkins.indexOf(ci)%2===0?[8,16,26]:[12,22,34];
          doc.setFillColor(...rowBg); doc.rect(M,y,pw,7,'F');
          doc.setFontSize(6.5); doc.setFont('helvetica','normal'); doc.setTextColor(200,220,230);
          doc.text(ci.date||'',M+3,y+4.5);
          doc.text((ci.water_glasses||0)+' vasos',M+38,y+4.5);
          doc.text((ci.energy_level||0)+'/5',M+58,y+4.5);
          doc.text((ci.focus_level||0)+'/5',M+78,y+4.5);
          doc.text((parseFloat(ci.surf_hours)||0)+'h',M+98,y+4.5);
          const goalColor=ci.goal_achieved==='Si'?[34,197,94]:ci.goal_achieved==='Parcial'?[245,158,11]:[180,180,180];
          doc.setTextColor(...goalColor);
          doc.text(ci.goal_achieved||'—',M+118,y+4.5);
          doc.setTextColor(200,220,230);
          doc.text((ci.progress_pct||0)+'%',M+140,y+4.5);
          y+=8;
        });
      }
    }

    // TEAM SUMMARY PAGE (only for team report)
    if(isTeam && athletes.length>1){
      doc.addPage();
      let y=M;
      doc.setFillColor(5,10,15); doc.rect(0,0,210,297,'F');
      doc.setFillColor(0,201,232); doc.rect(0,0,210,22,'F');
      doc.setTextColor(5,10,15); doc.setFontSize(13); doc.setFont('helvetica','bold');
      doc.text('TSS — RESUMEN DEL EQUIPO',M,10);
      doc.setFontSize(9); doc.setFont('helvetica','normal');
      doc.text(monthName.toUpperCase(),M,16);
      y=30;

      doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('COMPARATIVA DE ATLETAS',M,y); y+=2;
      doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;

      // Header
      doc.setFillColor(5,15,25); doc.rect(M,y,pw,8,'F');
      doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(0,201,232);
      const teamCols=[{t:'Atleta',x:M+3},{t:'Surf h',x:M+65},{t:'Energía',x:M+85},{t:'Enfoque',x:M+105},{t:'Sesiones',x:M+125},{t:'% Plan',x:M+145},{t:'Índice',x:M+165}];
      teamCols.forEach(col=>doc.text(col.t,col.x,y+5));
      y+=10;

      for(const ath of athletes){
        if(y>270){doc.addPage();y=20;}
        const [ciR,evR,seR]=await Promise.all([
          db.from('tss_daily_checkins').select('surf_hours,energy_level,focus_level,progress_pct,goal_achieved').eq('athlete_id',ath.id).gte('date',mon).lte('date',sun),
          db.from('tss_evaluations').select('physical,technique,mindset,competitive').eq('athlete_id',ath.id).gte('date',mon).lte('date',sun).order('date'),
          db.from('tss_presencial_sessions').select('athlete_ids,status').gte('date',mon).lte('date',sun),
        ]);
        const cis=ciR.data||[]; const evs=evR.data||[];
        const sesh=(seR.data||[]).filter(s=>{try{const ids=Array.isArray(s.athlete_ids)?s.athlete_ids:JSON.parse(s.athlete_ids||'[]');return ids.includes(ath.id);}catch(e){return false;}});
        const tSurf=cis.reduce((s,ci)=>s+(parseFloat(ci.surf_hours)||0),0).toFixed(1);
        const aEn=cis.length?(cis.reduce((s,ci)=>s+(ci.energy_level||0),0)/cis.length).toFixed(1):'—';
        const aFo=cis.length?(cis.reduce((s,ci)=>s+(ci.focus_level||0),0)/cis.length).toFixed(1):'—';
        const aPct=cis.length?Math.round(cis.reduce((s,ci)=>s+(ci.progress_pct||0),0)/cis.length)+'%':'—';
        const lastEv=evs.length?evs[evs.length-1]:null;
        const evIdx=lastEv?(((lastEv.physical||0)+(lastEv.technique||0)+(lastEv.mindset||0)+(lastEv.competitive||0))/4).toFixed(1):'—';

        const rowBg=athletes.indexOf(ath)%2===0?[8,16,26]:[12,22,34];
        doc.setFillColor(...rowBg); doc.rect(M,y,pw,9,'F');
        doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
        doc.text(ath.name.substring(0,22),M+3,y+6);
        doc.setFont('helvetica','normal'); doc.setTextColor(200,220,230);
        doc.text(tSurf+'h',M+65,y+6);
        doc.text(aEn+'/5',M+85,y+6);
        doc.text(aFo+'/5',M+105,y+6);
        doc.text(String(sesh.length),M+125,y+6);
        doc.text(aPct,M+145,y+6);
        doc.setTextColor(0,201,232);
        doc.text(evIdx,M+165,y+6);
        y+=10;
      }
    }

    // Footer on all pages
    const totalPages=doc.getNumberOfPages();
    for(let i=1;i<=totalPages;i++){
      doc.setPage(i);
      doc.setFontSize(7); doc.setTextColor(107,138,154);
      doc.text('© TSS — The Surf Sequence® | Propiedad intelectual de Marcelo Castellanos',M,292);
      doc.text('Pág '+i+'/'+totalPages,210-M,292,{align:'right'});
    }
    const fileName = isTeam
      ? `TSS_Reporte_Equipo_${monthName.replace(/ /g,'_')}.pdf`
      : `TSS_${athletes[0].name.replace(/ /g,'_')}_${monthName.replace(/ /g,'_')}.pdf`;
    doc.save(fileName);
    if(!isTeam) closeModal('monthlyAthModal');
    toast('✅ Reporte generado','success');
  } catch(e){ toast('Error al generar reporte: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}



async function genAnalyticsPDF(athleteId, athleteName){
  toast('Generando reporte...','info');
  try {
    const today = todayStr();
    const d30ago = new Date(); d30ago.setDate(d30ago.getDate()-29);
    const from30 = d30ago.toISOString().split('T')[0];

    // Fetch all data
    const anaFloor = from30 > OFFICIAL_START ? from30 : OFFICIAL_START;
    const [{data:checkins},{data:evals},{data:compEvals},{data:sessions},{data:profile},{data:competitions}] = await Promise.all([
      db.from('tss_daily_checkins').select('*').eq('athlete_id',athleteId).gte('date',anaFloor).order('date',{ascending:true}),
      db.from('tss_evaluations').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}).limit(20),
      db.from('tss_comp_evaluations').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}),
      db.from('tss_presencial_sessions').select('id,date,title,athlete_ids').gte('date',anaFloor).order('date',{ascending:false}),
      db.from('tss_profiles').select('*').eq('id',athleteId).maybeSingle(),
      db.from('tss_competitions').select('*').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('date',{ascending:false}).limit(10),
    ]);

    const cis = checkins||[];
    const evs = evals||[];
    const comps = compEvals||[];
    const ath = profile||{};
    const competitionsList = competitions||[];
    // Load heats for finalized competitions
    const heatsByComp = {};
    if(competitionsList.length){
      try {
        const compIds = competitionsList.map(c=>c.id);
        const {data:allHeats} = await db.from('tss_competition_heats').select('*').in('competition_id', compIds).order('heat_number');
        (allHeats||[]).forEach(h => { (heatsByComp[h.competition_id] = heatsByComp[h.competition_id] || []).push(h); });
      } catch(e){}
    }

    // Attendance
    const attended = (sessions||[]).filter(s=>{
      try{ const ids=Array.isArray(s.athlete_ids)?s.athlete_ids:JSON.parse(s.athlete_ids||'[]'); return ids.includes(athleteId); }catch(e){ return false; }
    });

    // Stats
    const avgC = cis.length ? Math.round(cis.reduce((s,ci)=>s+(ci.progress_pct||0),0)/cis.length) : 0;
    const totalH = cis.reduce((s,ci)=>s+(ci.surf_hours||0),0);
    const avgEnergy = cis.filter(ci=>ci.energy_level>0).length ? (cis.filter(ci=>ci.energy_level>0).reduce((s,ci)=>s+(ci.energy_level||0),0)/cis.filter(ci=>ci.energy_level>0).length).toFixed(1) : '—';
    const avgWater = cis.filter(ci=>ci.water_glasses>0).length ? (cis.filter(ci=>ci.water_glasses>0).reduce((s,ci)=>s+(ci.water_glasses||0),0)/cis.filter(ci=>ci.water_glasses>0).length).toFixed(1) : '—';
    const avgFocus = cis.filter(ci=>ci.focus_level>0).length ? (cis.filter(ci=>ci.focus_level>0).reduce((s,ci)=>s+(ci.focus_level||0),0)/cis.filter(ci=>ci.focus_level>0).length).toFixed(1) : '—';
    const checkinDays = cis.filter(ci=>ci.water_glasses||ci.energy_level||ci.notes).length;

    // Eval stats — Indice basado en 4 pilares puros (Fisico, Tecnico, Tactico, Mental)
    // Si tactical es null (eval vieja) lo excluimos del calculo para no penalizar
    const calcIdx = (e) => {
      if(!e) return null;
      const vals = [e.physical, e.technique, e.tactical, e.mindset].filter(v => v && v>0);
      if(!vals.length) return null;
      return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    };
    const lastEval = evs[0]||null;
    const prevEval = evs[1]||null;
    const currentIdx = calcIdx(lastEval) || '—';
    const prevIdx = calcIdx(prevEval);
    const trend = (currentIdx!=='—'&&prevIdx) ? (parseFloat(currentIdx)>parseFloat(prevIdx)?'↑ Subiendo':parseFloat(currentIdx)<parseFloat(prevIdx)?'↓ Bajando':'= Estable') : '';

    // Weekly surf hours (4 weeks)
    const weeks = [];
    for(let w=3;w>=0;w--){
      const wStart = new Date(); wStart.setDate(wStart.getDate() - wStart.getDay() - w*7);
      const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate()+6);
      const ws = wStart.toISOString().split('T')[0];
      const we = wEnd.toISOString().split('T')[0];
      const wCis = cis.filter(ci=>ci.date>=ws&&ci.date<=we);
      weeks.push({
        label: `S${4-w}`,
        hours: wCis.reduce((s,ci)=>s+(ci.surf_hours||0),0).toFixed(1),
        compliance: wCis.length ? Math.round(wCis.reduce((s,ci)=>s+(ci.progress_pct||0),0)/wCis.length) : 0,
        checkins: wCis.filter(ci=>ci.water_glasses||ci.energy_level).length
      });
    }

    // Bio
    const birthDate = ath.birth_date ? new Date(ath.birth_date+'T00:00:00') : null;
    const age = birthDate ? Math.floor((new Date()-birthDate)/(1000*60*60*24*365.25)) : null;
    const imc = (ath.weight_kg&&ath.height_cm) ? (ath.weight_kg/((ath.height_cm/100)**2)).toFixed(1) : null;
    const imcLabel = imc ? (imc<18.5?'Bajo peso':imc<25?'Normal':imc<30?'Sobrepeso':'Obesidad') : null;

    // ── PDF SETUP ───────────────────────────────────────────
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210, M=14, CW=W-M*2;
    let y=0;

    const cyan=[0,201,232], white=[232,240,245], grey=[100,120,135], dark=[8,15,25], bg2=[18,25,38], bg3=[25,35,52];
    const green=[34,197,94], amber=[245,158,11], red=[239,68,68], purple=[168,85,247];

    const setC = (rgb) => doc.setTextColor(...rgb);
    const setF = (rgb) => doc.setFillColor(...rgb);
    const setD = (rgb) => doc.setDrawColor(...rgb);
    const box = (x,iy,w,h,rgb,r=3) => { setF(rgb); doc.roundedRect(x,iy,w,h,r,r,'F'); };
    const line = (x1,y1,x2,y2,rgb,lw=0.3) => { setD(rgb); doc.setLineWidth(lw); doc.line(x1,y1,x2,y2); };
    const txt = (text,x,iy,size,rgb,style='normal') => { setC(rgb); doc.setFontSize(size); doc.setFont('helvetica',style); doc.text(String(text),x,iy); };

    // ══ PAGE 1 ══════════════════════════════════════════════

    // Header bar
    setF(dark); doc.rect(0,0,W,22,'F');
    setF(cyan); doc.rect(0,22,W,2,'F');
    txt('TSS EL SALVADOR',M,10,8,grey,'normal');
    txt('REPORTE INDIVIDUAL DE ATLETA',M,16,11,white,'bold');
    doc.setTextColor(...grey); doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.text(today,W-M,16,{align:'right'});
    y=32;

    // Athlete name + bio row
    txt(athleteName,M,y,18,cyan,'bold');
    // Cinta TSS al lado del nombre
    if(ath.current_belt){
      const beltMap = {white:[232,232,232],yellow:[245,197,24],blue:[30,111,191],purple:[123,79,190],brown:[125,78,39],black:[17,17,17]};
      const beltName = {white:'BLANCA',yellow:'AMARILLA',blue:'AZUL',purple:'MORADA',brown:'CAFE',black:'NEGRA'}[ath.current_belt];
      const beltColor = beltMap[ath.current_belt] || grey;
      const beltTxtW = doc.getTextWidth(beltName) + 8;
      const beltX = M + doc.getTextWidth(athleteName) + 6;
      box(beltX, y-5, beltTxtW, 7, beltColor, 1.5);
      const textColor = (ath.current_belt==='white'||ath.current_belt==='yellow') ? dark : white;
      txt(beltName, beltX+4, y-0.5, 8, textColor, 'bold');
    }
    y+=8;
    const bioItems = [];
    if(age) bioItems.push(`${age} años`);
    if(ath.height_cm) bioItems.push(`${ath.height_cm}cm`);
    if(ath.weight_kg) bioItems.push(`${ath.weight_kg}kg`);
    if(imc) bioItems.push(`IMC ${imc} - ${imcLabel}`);
    if(ath.stance) bioItems.push(`Surf: ${ath.stance}`);
    if(ath.discipline) bioItems.push(`Disciplina: ${ath.discipline==='shortboard'?'Shortboard':ath.discipline==='longboard'?'Longboard':'Ambas'}`);
    if(ath.years_surfing) bioItems.push(`${ath.years_surfing} años surfeando`);
    if(ath.score_capacity) bioItems.push(`Score Cap: ${ath.score_capacity}/10`);
    txt(bioItems.join('   '),M,y,8,grey);
    txt(`Período: ${from30} → ${today}`,M,y+6,8,grey);
    y+=18;

    // Injury alert
    if(ath.injury){
      box(M,y,CW,10,[60,15,15],2);
      setD(red); doc.setLineWidth(0.4); doc.roundedRect(M,y,CW,10,2,2,'S');
      txt(`LESION ACTIVA: ${ath.injury}${ath.injury_since?' — desde '+ath.injury_since:''}`,M+3,y+6.5,8,red,'bold');
      y+=14;
    }

    // ── KPI CARDS ──
    const kpis = [
      {label:'CUMPLIMIENTO PROM.',val:avgC+'%',color:avgC>=80?green:avgC>=50?amber:red},
      {label:'ÍNDICE ACTUAL',val:currentIdx+(trend?' '+trend:''),color:purple},
      {label:'HORAS SURF 30D',val:totalH.toFixed(1)+'h',color:cyan},
      {label:'ASISTENCIA',val:attended.length+' sesiones',color:green},
      {label:'CHECK-INS',val:checkinDays+'/'+cis.length+' días',color:amber},
      {label:'ENERGÍA PROM.',val:avgEnergy+'/5',color:amber},
    ];
    const kw=(CW-10)/3, kh=16;
    kpis.forEach((k,i)=>{
      const kx=M+(i%3)*(kw+5);
      const ky=y+Math.floor(i/3)*(kh+4);
      box(kx,ky,kw,kh,bg3,2);
      txt(k.val,kx+kw/2,ky+7,12,k.color,'bold');
      doc.setFontSize(7); doc.setTextColor(...grey); doc.setFont('helvetica','normal');
      doc.text(k.label,kx+kw/2,ky+13,{align:'center'});
    });
    y+=42;

    // ── WEEKLY BREAKDOWN ──
    line(M,y,W-M,y,grey,0.2); y+=5;
    txt('DESGLOSE SEMANAL (ÚLTIMAS 4 SEMANAS)',M,y,8,cyan,'bold'); y+=6;
    const wcols=[M,M+35,M+70,M+105,M+140];
    txt('SEMANA',wcols[0],y,7,grey,'bold');
    txt('HORAS SURF',wcols[1],y,7,grey,'bold');
    txt('CUMPLIMIENTO',wcols[2],y,7,grey,'bold');
    txt('CHECK-INS',wcols[3],y,7,grey,'bold');
    y+=4; line(M,y,W-M,y,grey,0.2); y+=4;
    weeks.forEach(w=>{
      const cColor=w.compliance>=80?green:w.compliance>=50?amber:red;
      txt(w.label,wcols[0],y,8,white); txt(w.hours+'h',wcols[1],y,8,cyan); txt(w.compliance+'%',wcols[2],y,8,cColor,'bold'); txt(String(w.checkins),wcols[3],y,8,white);
      y+=6;
    });
    y+=4;

    // ── EVALUACIÓN DEL COACH ──
    if(evs.length){
      line(M,y,W-M,y,grey,0.2); y+=5;
      txt('EVALUACIÓN DEL COACH',M,y,8,cyan,'bold'); y+=6;

      // Dimension bars — 4 pilares puros + Competitivo extra
      const dims=[
        {key:'physical', label:'Fisico',     color:green},
        {key:'technique',label:'Tecnico',    color:cyan},
        {key:'tactical', label:'Tactico',    color:purple},
        {key:'mindset',  label:'Mental',     color:amber},
      ];
      const barW=CW/2-10;
      dims.forEach((d,i)=>{
        const dx=M+(i%2)*(barW+20);
        const dy=y+Math.floor(i/2)*14;
        const cur=lastEval?lastEval[d.key]||0:0;
        const prev=prevEval?prevEval[d.key]||0:0;
        const diff=cur-prev;
        const diffTxt=diff>0?'↑'+diff:diff<0?'↓'+Math.abs(diff):'=';
        const diffColor=diff>0?green:diff<0?red:grey;
        txt(d.label,dx,dy+4,8,white); txt((cur||'—')+'/5',dx+barW-8,dy+4,8,d.color,'bold');
        if(cur && prev) txt(diffTxt,dx+barW-18,dy+4,7,diffColor);
        box(dx,dy+6,barW,4,bg3,1);
        if(cur) box(dx,dy+6,barW*cur/5,4,d.color,1);
      });
      y+=dims.length/2*14+2;

      // Competitivo extra (si tiene valor)
      if(lastEval && lastEval.competitive){
        const compVal = lastEval.competitive;
        txt('Rendimiento Competitivo:',M,y+4,7,grey); txt(compVal+'/5',M+50,y+4,8,amber,'bold');
        y+=8;
      }

      // Last eval text fields
      if(lastEval){
        const textFields=[
          {key:'strengths',label:'✅ Fortalezas'},
          {key:'limitations',label:'⚠️ Limitaciones'},
          {key:'recommendations',label:'📋 Recomendaciones'},
        ];
        textFields.forEach(tf=>{
          if(lastEval[tf.key]){
            if(y>260){doc.addPage();y=M;}
            txt(tf.label+':',M,y,7,grey,'bold');
            const lines=doc.splitTextToSize(lastEval[tf.key],CW-5);
            txt(lines.join(' '),M+25,y,7,white);
            y+=lines.length*4+2;
          }
        });
        txt('Última evaluación: '+lastEval.date+(lastEval.date&&prevEval?' | Anterior: '+prevEval.date:''),M,y,7,grey);
        y+=6;
      }
    }

    // ── WELLNESS ──
    if(cis.length){
      if(y>240){doc.addPage();y=M;}
      line(M,y,W-M,y,grey,0.2); y+=5;
      txt('WELLNESS — PROMEDIOS 30 DÍAS',M,y,8,cyan,'bold'); y+=6;
      const wItems=[
        {label:'Agua',val:avgWater,unit:'vasos',color:cyan},
        {label:'Energia',val:avgEnergy,unit:'/5',color:amber},
        {label:'Enfoque',val:avgFocus,unit:'/5',color:purple},
      ];
      const ww=(CW-10)/3;
      wItems.forEach((wi,i)=>{
        const wx=M+i*(ww+5);
        box(wx,y,ww,14,bg3,2);
        txt(wi.val,wx+ww/2,y+7,12,wi.color,'bold');
        doc.setFontSize(7); doc.setTextColor(...grey); doc.text(wi.label+' '+wi.unit,wx+ww/2,y+12,{align:'center'});
      });
      y+=20;
    }

    // ── REGISTRO DIARIO ──
    if(y>230){doc.addPage();y=M;}
    line(M,y,W-M,y,grey,0.2); y+=5;
    txt('REGISTRO DIARIO',M,y,8,cyan,'bold'); y+=6;
    const cols=[M,M+28,M+50,M+68,M+86,M+106,M+124,M+142];
    const headers=['FECHA','CUMPL.','AGUA','ENERGÍA','ENFOQUE','HORAS','OBJETIVO','NOTAS'];
    headers.forEach((h,i)=>{ txt(h,cols[i],y,6,grey,'bold'); });
    y+=3; line(M,y,W-M,y,grey,0.2); y+=4;

    cis.slice().reverse().forEach(ci=>{
      if(y>275){doc.addPage();y=M;}
      const pct=ci.progress_pct||0;
      const pc=pct>=80?green:pct>=50?amber:red;
      txt(ci.date,cols[0],y,7,white);
      txt(pct+'%',cols[1],y,7,pc,'bold');
      txt(String(ci.water_glasses||0),cols[2],y,7,ci.water_glasses>=6?green:ci.water_glasses>=4?white:grey);
      txt(String(ci.energy_level||0),cols[3],y,7,ci.energy_level>=4?green:ci.energy_level>=3?white:grey);
      txt(String(ci.focus_level||0),cols[4],y,7,white);
      txt((ci.surf_hours||0)+'h',cols[5],y,7,cyan);
      if(ci.goal_achieved) txt(ci.goal_achieved==='Si'?'✓':'✗',cols[6],y,7,ci.goal_achieved==='Si'?green:red);
      if(ci.notes){ const n=ci.notes.substring(0,28); txt(n,cols[7],y,6,grey); }
      y+=5;
    });

    // ── COMPETENCIAS ──
    if(comps.length){
      if(y>230){doc.addPage();y=M;}
      y+=4; line(M,y,W-M,y,grey,0.2); y+=5;
      txt('HISTORIAL DE COMPETENCIAS',M,y,8,cyan,'bold'); y+=6;
      const ccols=[M,M+28,M+85,M+115,M+140,M+165];
      ['FECHA','COMPETENCIA','CATEGORÍA','RONDA','PROM. OLA','MEJOR OLA'].forEach((h,i)=>txt(h,ccols[i],y,6,grey,'bold'));
      y+=3; line(M,y,W-M,y,grey,0.2); y+=4;
      comps.forEach(co=>{
        if(y>275){doc.addPage();y=M;}
        txt(co.date||'',ccols[0],y,7,white);
        const evName=(co.event_name||co.competition_name||'').substring(0,22);
        txt(evName,ccols[1],y,7,white);
        txt(co.athlete_category||'',ccols[2],y,7,grey);
        txt(co.round_reached||'',ccols[3],y,7,white);
        txt(co.avg_wave_score?parseFloat(co.avg_wave_score).toFixed(2):'—',ccols[4],y,7,cyan,'bold');
        txt(co.highest_wave?parseFloat(co.highest_wave).toFixed(1):'—',ccols[5],y,7,amber,'bold');
        y+=5;
      });
    }

    // ══ COMPETENCIAS · HEATS · AUTO-EVAL DEL ATLETA ══════════
    if(competitionsList && competitionsList.length){
      if(y>240){doc.addPage();y=M;}
      line(M,y,W-M,y,grey,0.2); y+=5;
      txt('COMPETENCIAS · HEATS Y AUTO-EVAL',M,y,8,amber,'bold'); y+=6;

      competitionsList.forEach(c=>{
        if(y>255){doc.addPage();y=M;}
        const heats = heatsByComp[c.id]||[];
        const statusLabel = c.status==='finalizada'?'FINALIZADA':c.status==='en_curso'?'EN CURSO':'PROGRAMADA';
        const statusColor = c.status==='finalizada'?green:c.status==='en_curso'?cyan:amber;

        txt(c.name||'(sin nombre)',M,y,9,white,'bold');
        txt(statusLabel,W-M,y,7,statusColor,'bold');
        doc.text(statusLabel,W-M,y,{align:'right'});
        y+=4;
        const cInfo = [c.date, c.place, c.category].filter(Boolean).join(' · ');
        if(cInfo){ txt(cInfo,M,y,7,grey); y+=4; }

        // Heats
        if(heats.length){
          y+=1;
          heats.forEach(h=>{
            if(y>270){doc.addPage();y=M;}
            let r = h.result_json || {};
            if(typeof r === 'string'){ try{ r=JSON.parse(r); }catch(e){ r={}; } }
            const total = ((parseFloat(r.best1)||0)+(parseFloat(r.best2)||0)).toFixed(1);
            const heatLabel = `Heat ${h.heat_number}${h.round_name?' · '+h.round_name:''}`;
            const passedTxt = h.passed===true?'PASO':h.passed===false?'ELIMINADO':'';
            const passColor = h.passed===true?green:h.passed===false?red:grey;
            txt(heatLabel,M+2,y,7,white,'bold');
            if(passedTxt){ txt(passedTxt,M+50,y,7,passColor,'bold'); }
            if(r.best1||r.best2){ txt(`Best: ${r.best1||0} + ${r.best2||0} = ${total}  ·  ${r.total_count||0} olas`,M+85,y,7,cyan); }
            y+=4;
            if(r.what_worked){
              const lines = doc.splitTextToSize('+ '+r.what_worked, CW-10);
              txt(lines.join(' '),M+4,y,6,green); y+=3;
            }
            if(r.what_to_improve){
              const lines = doc.splitTextToSize('! '+r.what_to_improve, CW-10);
              txt(lines.join(' '),M+4,y,6,amber); y+=3;
            }
          });
        }

        // Auto-eval final del atleta
        let finalEval = c.athlete_final_eval;
        if(typeof finalEval === 'string'){ try{ finalEval=JSON.parse(finalEval); }catch(e){ finalEval=null; } }
        if(finalEval && typeof finalEval === 'object'){
          if(y>265){doc.addPage();y=M;}
          y+=2;
          txt('AUTO-EVAL DEL ATLETA:',M+2,y,7,grey,'bold'); y+=3;
          const feItems = [
            ['Fisico', finalEval.fisico],
            ['Tecnica', finalEval.tecnica],
            ['Tactica', finalEval.tactica],
            ['Olas', finalEval.eleccion_olas],
            ['Equipo', finalEval.equipo],
            ['Mental', finalEval.mental],
          ];
          const feW = (CW-10)/6;
          feItems.forEach((it,i)=>{
            const fx = M + i*feW;
            const v = it[1]||0;
            const col = v>=4?green:v>=3?amber:v>0?red:grey;
            txt(it[0],fx+feW/2,y,6,grey);
            doc.text(it[0],fx+feW/2,y,{align:'center'});
            txt((v||'—')+'/5',fx+feW/2,y+4,8,col,'bold');
            doc.text((v||'—')+'/5',fx+feW/2,y+4,{align:'center'});
          });
          y+=10;
          if(c.athlete_final_notes){
            const lines = doc.splitTextToSize('Notas: '+c.athlete_final_notes, CW-5);
            txt(lines.join(' '),M+2,y,6,grey); y+=lines.length*3;
          }
        }
        y+=4;
      });
    }

    // ══ INFO PERSONAL · MEDICA · EMERGENCIA · METAS ══════════
    const hasInfoData = ath.blood_type||ath.allergies||ath.medications||ath.medical_conditions||ath.emergency_name||ath.goal_short_term||ath.goal_mid_term||ath.goal_long_term;
    if(hasInfoData){
      if(y>220){doc.addPage();y=M;}
      line(M,y,W-M,y,grey,0.2); y+=5;
      txt('INFORMACION DEL ATLETA',M,y,8,cyan,'bold'); y+=6;

      // Sub-seccion: Personal/Contacto
      if(ath.email||ath.phone||ath.address){
        txt('Contacto:',M,y,7,grey,'bold');
        const contact = [ath.email,ath.phone,ath.address].filter(Boolean).join('  ·  ');
        const lines = doc.splitTextToSize(contact, CW-20);
        txt(lines.join(' '),M+22,y,7,white);
        y+=lines.length*4+1;
      }

      // Médica
      if(ath.blood_type||ath.allergies||ath.medications||ath.medical_conditions){
        if(y>270){doc.addPage();y=M;}
        txt('Medica:',M,y,7,grey,'bold'); y+=4;
        if(ath.blood_type){ txt(`Tipo sangre: ${ath.blood_type}`,M+4,y,7,red,'bold'); y+=4; }
        if(ath.allergies){ const ls=doc.splitTextToSize('Alergias: '+ath.allergies,CW-10); txt(ls.join(' '),M+4,y,7,amber); y+=ls.length*3+1; }
        if(ath.medications){ const ls=doc.splitTextToSize('Medicamentos: '+ath.medications,CW-10); txt(ls.join(' '),M+4,y,7,white); y+=ls.length*3+1; }
        if(ath.medical_conditions){ const ls=doc.splitTextToSize('Condiciones: '+ath.medical_conditions,CW-10); txt(ls.join(' '),M+4,y,7,white); y+=ls.length*3+1; }
        if(ath.medical_history){ const ls=doc.splitTextToSize('Historial: '+ath.medical_history,CW-10); txt(ls.join(' '),M+4,y,7,grey); y+=ls.length*3+1; }
        if(ath.insurance_provider){ txt(`Seguro: ${ath.insurance_provider}${ath.insurance_number?' ('+ath.insurance_number+')':''}`,M+4,y,7,white); y+=4; }
      }

      // Emergencia
      if(ath.emergency_name||ath.emergency_phone){
        if(y>270){doc.addPage();y=M;}
        txt('Contacto de Emergencia:',M,y,7,red,'bold'); y+=4;
        const emergencyInfo = [
          ath.emergency_name && (ath.emergency_name + (ath.emergency_relationship?' ('+ath.emergency_relationship+')':'')),
          ath.emergency_phone,
          ath.emergency_phone_alt,
        ].filter(Boolean).join('  ·  ');
        txt(emergencyInfo, M+4, y, 7, white, 'bold'); y+=5;
      }

      // Metas
      if(ath.goal_short_term||ath.goal_mid_term||ath.goal_long_term){
        if(y>260){doc.addPage();y=M;}
        txt('Metas:',M,y,7,cyan,'bold'); y+=4;
        if(ath.goal_short_term){ const ls=doc.splitTextToSize('Corto plazo (1 mes): '+ath.goal_short_term,CW-10); txt(ls.join(' '),M+4,y,7,white); y+=ls.length*3+1; }
        if(ath.goal_mid_term){ const ls=doc.splitTextToSize('Mediano plazo (6 meses): '+ath.goal_mid_term,CW-10); txt(ls.join(' '),M+4,y,7,white); y+=ls.length*3+1; }
        if(ath.goal_long_term){ const ls=doc.splitTextToSize('Largo plazo (4 anos): '+ath.goal_long_term,CW-10); txt(ls.join(' '),M+4,y,7,white); y+=ls.length*3+1; }
        if(ath.why_train){ const ls=doc.splitTextToSize('Por que entrena: '+ath.why_train,CW-10); txt(ls.join(' '),M+4,y,6,grey); y+=ls.length*3+1; }
      }
      y+=2;
    }

    // Footer on all pages
    const pageCount = doc.getNumberOfPages();
    for(let p=1;p<=pageCount;p++){
      doc.setPage(p);
      setF(dark); doc.rect(0,287,W,10,'F');
      txt('TSS El Salvador  ·  Sistema de Entrenamiento Técnico de Surf  ·  Generado '+today,W/2,293,6,grey,'normal');
      doc.setTextColor(...grey); doc.setFontSize(6); doc.text('Pág. '+p+' / '+pageCount,W-M,293,{align:'right'});
    }

    doc.save('TSS_'+athleteName.replace(/ /g,'_')+'_'+today+'.pdf');
    toast('✅ Reporte descargado','success');
  } catch(e){ toast('Error generando reporte','error'); console.error(e); }
}



async function genWeeklyPDF(athleteId, athleteName, mon, sun){
  try {
  showLoad(true);
  // Load all data for the week (floor to OFFICIAL_START)
  const wkFloor = mon > OFFICIAL_START ? mon : OFFICIAL_START;
  const [ciRes, plansRes, sessRes, evalRes, membRes, compEvRes, fbRes] = await Promise.all([
    db.from('tss_daily_checkins').select('*').eq('athlete_id',athleteId).gte('date',wkFloor).lte('date',sun).order('date'),
    db.from('tss_daily_plans').select('*').gte('date',wkFloor).lte('date',sun).order('date'),
    db.from('tss_presencial_sessions').select('*').gte('date',wkFloor).lte('date',sun).order('date'),
    db.from('tss_evaluations').select('*').eq('athlete_id',athleteId).gte('date',wkFloor).lte('date',sun).order('date'),
    db.from('tss_group_members').select('group_id').eq('athlete_id',athleteId),
    db.from('tss_comp_evaluations').select('*').eq('athlete_id',athleteId).gte('date',wkFloor).lte('date',sun).order('date'),
    db.from('tss_presencial_feedbacks').select('*,tss_presencial_sessions(title,date)').eq('athlete_id',athleteId).gte('date',OFFICIAL_START).order('id',{ascending:false}),
  ]);
  const compEvalsWk = compEvRes.data||[];
  const presFbWk = (fbRes.data||[]).filter(fb=>fb.tss_presencial_sessions?.date>=mon && fb.tss_presencial_sessions?.date<=sun);
  const checkins = ciRes.data||[];
  const myGroups = (membRes.data||[]).map(m=>m.group_id);
  const plans = (plansRes.data||[]).filter(p=>
    p.scope==='general'||
    (p.scope==='individual'&&p.target_id===athleteId)||
    (p.scope==='group'&&myGroups.includes(p.target_id))
  );
  const sessions = sessRes.data||[];
  const evals = evalRes.data||[];

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const M=15; let y=M; const pw=210-M*2;

  // Header bar
  doc.setFillColor(5,10,15); doc.rect(0,0,210,297,'F');
  doc.setFillColor(0,201,232); doc.rect(0,0,210,20,'F');
  doc.setTextColor(5,10,15);
  doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text('TSS — The Surf Sequence',M,13);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text('Reporte Semanal · '+athleteName,M,19);
  doc.setTextColor(5,10,15);
  doc.text(mon+' al '+sun,210-M,13,{align:'right'});
  y=30;

  // Summary stats
  const totalSurf = checkins.reduce((s,ci)=>s+(ci.surf_hours||0),0);
  const avgEnergy = checkins.length?(checkins.reduce((s,ci)=>s+(ci.energy_level||0),0)/checkins.length).toFixed(1):0;
  const avgFocus = checkins.length?(checkins.reduce((s,ci)=>s+(ci.focus_level||0),0)/checkins.length).toFixed(1):0;
  const goals = checkins.filter(ci=>ci.goal_achieved==='Si').length;
  const avgPlan = checkins.length?Math.round(checkins.reduce((s,ci)=>s+(ci.progress_pct||0),0)/checkins.length):0;

  doc.setTextColor(0,201,232);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('RESUMEN DE LA SEMANA',M,y); y+=2;
  doc.setDrawColor(0,201,232); doc.setLineWidth(0.3); doc.line(M,y,210-M,y); y+=6;

  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(232,240,245);
  const statW=pw/4;
  const avgIdx = evals.length?(evals.reduce((s,e)=>{const v=[e.physical,e.technique,e.tactical,e.mindset].filter(x=>x&&x>0);return s+(v.length?v.reduce((a,b)=>a+b,0)/v.length:0);},0)/evals.length).toFixed(1):null;
  const stats=[
    ['🏄 '+totalSurf.toFixed(1)+'h','Horas Surf'],
    ['⚡ '+avgEnergy+'/5','Energía'],
    ['🎯 '+avgFocus+'/5','Enfoque'],
    ['✅ '+goals+'/'+checkins.length,'Objetivos'],
  ];
  stats.forEach((st,i)=>{
    const x=M+i*statW;
    doc.setFillColor(15,24,32); doc.roundedRect(x,y,statW-3,14,2,2,'F');
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(0,201,232);
    doc.text(st[0],x+(statW-3)/2,y+7,{align:'center'});
    doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(107,138,154);
    doc.text(st[1],x+(statW-3)/2,y+12,{align:'center'});
  });
  y+=20;
  if(avgIdx){
    doc.setFillColor(0,60,75); doc.roundedRect(M,y,pw,10,2,2,'F');
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(0,201,232);
    doc.text('ÍNDICE DE RENDIMIENTO SEMANAL: '+avgIdx+'/5',M+pw/2,y+6,{align:'center'});
    y+=14;
  }

  // Daily checkins
  if(checkins.length){
    doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('CHECK-INS DIARIOS',M,y); y+=2;
    doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
    checkins.forEach(ci=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,10,2,2,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(ci.date,M+3,y+6);
      doc.setFont('helvetica','normal'); doc.setTextColor(107,138,154);
      let sesResLine='';
      if(ci.sesion_result){try{const sr=JSON.parse(ci.sesion_result);const vals=Object.values(sr).map(v=>(v&&typeof v==='object')?v.mission:v);if(vals.length){sesResLine='  🌊'+(vals.includes('Si')?'✅':vals.includes('Parcial')?'⚡':'❌');}}catch(e){}}
      const line='💧'+ci.water_glasses+'v  ⚡'+ci.energy_level+'/5  🎯'+(ci.focus_level||'—')+'/5  🥗'+(ci.nutrition||'—')+'  ✅'+(ci.goal_achieved||'—')+(ci.surf_hours?'  🏄'+ci.surf_hours+'h':'')+sesResLine+(ci.progress_pct?'  📋'+ci.progress_pct+'%':'');
      doc.text(line,M+28,y+6);
      y+=12;
      if(ci.notes){ doc.setTextColor(107,138,154); doc.setFontSize(7); const lines=doc.splitTextToSize('Nota: '+ci.notes,pw-30); doc.text(lines,M+3,y); y+=lines.length*4; }
    });
    y+=4;
  }

  // Sessions
  if(sessions.length){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('SESIONES PRESENCIALES',M,y); y+=2;
    doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
    sessions.forEach(s=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,8,2,2,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(s.date+(s.time_start?' '+s.time_start:''),M+3,y+5);
      doc.setFont('helvetica','normal'); doc.setTextColor(0,201,232);
      doc.text(s.title||(s.pilar||'Sesión'),M+30,y+5);
      doc.setTextColor(107,138,154);
      doc.text(s.status==='done'?'✅ Completada':s.status==='live'?'En curso':'Planificada',M+130,y+5);
      y+=10;
    });
    y+=4;
  }

  // Evaluaciones del coach
  if(evals.length){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('EVALUACIONES DEL COACH',M,y); y+=2;
    doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
    evals.forEach(ev=>{
      if(y>270){doc.addPage();y=20;}
      const _ev=[ev.physical,ev.technique,ev.tactical,ev.mindset].filter(x=>x&&x>0);
      const idx4=_ev.length?(_ev.reduce((a,b)=>a+b,0)/_ev.length).toFixed(1):'—';
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,14,2,2,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(ev.date,M+3,y+5);
      doc.setTextColor(0,201,232); doc.setFontSize(10);
      doc.text('Índice: '+idx4+'/5',M+pw-3,y+5,{align:'right'});
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(107,138,154);
      doc.text('Físico: '+(ev.physical||'—')+'  Técnico: '+(ev.technique||'—')+'  Táctico: '+(ev.tactical||'—')+'  Mental: '+(ev.mindset||'—')+'  Comp: '+(ev.competitive||'—'),M+3,y+11);
      const evalObs = ev.strengths||ev.recommendations||'';
      if(evalObs){ const ns=doc.splitTextToSize('Obs: '+evalObs, pw-6); doc.text(ns,M+3,y+14); y+=ns.length*3.5; }
      y+=16;
    });
    y+=4;
  }

  // Plan blocks
  if(plans.length){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('PLAN DE ENTRENAMIENTO',M,y); y+=2;
    doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
    plans.forEach(p=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,8,2,2,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(p.date,M+3,y+5);
      doc.setFont('helvetica','normal'); doc.setTextColor(107,138,154);
      doc.text((p.work_type||'Bloque')+(p.objective?' — '+p.objective:''),M+25,y+5);
      y+=10;
    });
  }

  // Feedback de sesiones
  if(presFbWk.length){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(0,201,232); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('FEEDBACK DE SESIONES (COACH)',M,y); y+=2;
    doc.setDrawColor(0,201,232); doc.line(M,y,210-M,y); y+=5;
    presFbWk.forEach(fb=>{
      if(y>265){doc.addPage();y=20;}
      const sess=fb.tss_presencial_sessions;
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,12,2,2,'F');
      doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(`${sess?.date||''} — ${sess?.title||'Sesion'}`,M+3,y+5);
      doc.setFont('helvetica','normal'); doc.setTextColor(180,200,210);
      const parts=[];
      if(fb.focus_rating) parts.push('Enfoque:'+fb.focus_rating+'/5');
      if(fb.frustration_rating) parts.push('Frust:'+fb.frustration_rating+'/5');
      if(fb.achieved) parts.push('Obj:'+fb.achieved);
      doc.text(parts.join(' | '),M+3,y+9);
      if(fb.coach_note){ doc.setTextColor(150,170,180); doc.text(fb.coach_note.substring(0,90),M+pw/2,y+5); }
      y+=15;
    });
  }

  // Competencias de la semana
  if(compEvalsWk.length){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(245,158,11); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('COMPETENCIAS',M,y); y+=2;
    doc.setDrawColor(245,158,11); doc.line(M,y,210-M,y); y+=5;
    compEvalsWk.forEach(ev=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFillColor(12,20,28); doc.roundedRect(M,y,pw,10,2,2,'F');
      doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(232,240,245);
      doc.text(`${ev.date} — ${ev.event_name}`,M+3,y+5);
      doc.setFont('helvetica','normal'); doc.setTextColor(0,201,232);
      const info=[];
      if(ev.avg_wave_score) info.push('Prom:'+ev.avg_wave_score);
      if(ev.highest_wave) info.push('Mejor:'+ev.highest_wave);
      if(ev.final_ranking) info.push(ev.final_ranking);
      doc.text(info.join(' | '),M+pw-3,y+5,{align:'right'});
      y+=13;
    });
  }

  // Footer
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFontSize(7); doc.setTextColor(107,138,154);
    doc.text('TSS El Salvador · Reporte generado '+new Date().toLocaleDateString('es-SV'),M,292);
    doc.text('Pág '+i+'/'+pages,210-M,292,{align:'right'});
  }

  doc.save('TSS_'+athleteName.replace(/\s+/g,'_')+'_semana_'+mon+'.pdf');
  toast('✅ PDF descargado','success');
  } catch(e){ toast('Error generando PDF','error'); console.error(e); } finally { showLoad(false); }
}

function openCompModal(athleteId, compId){
  const m=document.createElement('div'); m.className='modal-overlay'; m.id='compModal';
  m.innerHTML=`<div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">${compId?'Editar Competencia':'Nueva Competencia'}</div></div>
      <button class="modal-close" onclick="closeModal('compModal')">✕</button>
    </div>
    <label class="inp-label">Nombre del campeonato</label>
    <input type="text" class="inp" id="cpName" placeholder="Ej: ISA World Surfing Games">
    <label class="inp-label">Fecha</label>
    <input type="date" class="inp" id="cpDate" value="${todayStr()}">
    <label class="inp-label">Lugar / Ubicación</label>
    <input type="text" class="inp" id="cpPlace" placeholder="Ej: Huntington Beach, California">
    <label class="inp-label">Categoría / Modalidad</label>
    <input type="text" class="inp" id="cpCat" placeholder="Ej: Shortboard Open, Sub-18...">
    <label class="inp-label">Notas (opcional)</label>
    <textarea class="ta" id="cpNotes" placeholder="Info adicional..."></textarea>
    <button class="save-btn" onclick="saveComp('${athleteId}','${compId||''}')">💾 Guardar Competencia</button>
  </div>`;
  document.body.appendChild(m);
  // Force date value after DOM insertion (Safari fix)
  const cpDateEl = document.getElementById('cpDate');
  if(cpDateEl && !cpDateEl.value) cpDateEl.value = todayStr();
  m.onclick=e=>{ if(e.target===m) closeModal('compModal'); };
  if(compId){
    db.from('tss_competitions').select('*').eq('id',compId).single().then(({data})=>{
      if(!data) return;
      document.getElementById('cpName').value=data.name||'';
      document.getElementById('cpDate').value=data.date||'';
      document.getElementById('cpPlace').value=data.place||'';
      document.getElementById('cpCat').value=data.category||'';
      document.getElementById('cpNotes').value=data.notes||'';
    });
  }
}

async function saveComp(athleteId, existId){
  const name=gv('cpName'); const date=gv('cpDate');
  if(!name){toast('Ingresa el nombre','error');return;}
  if(!date){toast('Ingresa la fecha','error');return;}
  const payload={athlete_id:athleteId,name,date,place:gv('cpPlace'),category:gv('cpCat'),notes:gv('cpNotes'),created_by:S.user.id};
  showLoad(true);
  try {
    let error;
    if(existId){ ({error}=await db.from('tss_competitions').update(payload).eq('id',existId)); }
    else { ({error}=await db.from('tss_competitions').insert(payload)); }
    if(error) throw error;
    toast('✅ Competencia guardada','success');
    closeModal('compModal');
    // Reload profile competitions section
    loadCompetencias(athleteId);
  } catch(e){toast('Error al guardar: '+e.message,'error');console.error(e);}
  finally{showLoad(false);}
}

async function deleteEval(evalId){
  if(S.user.role==='athlete'){ toast('Solo el coach puede borrar','error'); return; }
  if(!confirm('¿Borrar esta evaluación general?\n\nEsta acción no se puede deshacer.')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_evaluations').delete().eq('id',evalId);
    if(error) throw error;
    toast('✅ Evaluación borrada','success');
    // Refresh wherever it appears
    if(typeof loadEvalHist==='function') loadEvalHist();
    if(S.view==='perfil') { const id=document.querySelector('[data-athlete-id]')?.dataset.athleteId; if(id) vPerfil(id); else vPerfil(); }
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

async function deleteCompEval(evalId){
  if(S.user.role==='athlete'){ toast('Solo el coach puede borrar','error'); return; }
  if(!confirm('¿Borrar esta evaluación de competencia?\n\nEsta acción no se puede deshacer.')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_comp_evaluations').delete().eq('id',evalId);
    if(error) throw error;
    toast('✅ Evaluación de competencia borrada','success');
    closeModal('coachEvalDetail');
    if(typeof loadCompEvalHist==='function') loadCompEvalHist();
    if(S.view==='perfil') { const id=document.querySelector('[data-athlete-id]')?.dataset.athleteId; if(id) vPerfil(id); else vPerfil(); }
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

async function deleteComp(compId, athleteId){
  if(!confirm('¿Eliminar esta competencia?')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_competitions').delete().eq('id',compId);
    if(error) throw error;
    toast('Eliminado','success'); loadCompetencias(athleteId);
  } catch(e){toast('Error al eliminar: '+e.message,'error');console.error(e);} finally{showLoad(false);}
}

async function loadCompetencias(athleteId){
  const el=document.getElementById('compSection'); if(!el) return;
  const isCoach=S.user.role==='coach'||S.user.role==='acoach';
  try {
    const{data}=await db.from('tss_competitions').select('*').eq('athlete_id',athleteId).order('date',{ascending:true});
    const today=todayStr();
    const upcoming=(data||[]).filter(c=>c.date>=today);
    const past=(data||[]).filter(c=>c.date<today);

    let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="sec-title" style="margin-bottom:0;">🏆 Competencias</div>
      ${isCoach?`<button class="btn btn-xs btn-cyan" onclick="openCompModal('${athleteId}',null)">+ Agregar</button>`:''}
    </div>`;

    if(!data||!data.length){
      html+=`<div style="text-align:center;padding:16px;color:var(--grey);font-size:12px;">Sin competencias registradas</div>`;
    } else {
      if(upcoming.length){
        upcoming.forEach(c=>{
          const d=new Date(c.date+'T00:00:00');
          const dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
          const monNames=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
          const daysLeft=Math.ceil((d-new Date())/(1000*60*60*24));
          html+=`<div class="comp-card comp-upcoming">
            <div class="comp-date-box">
              <div class="comp-date-day">${d.getDate()}</div>
              <div class="comp-date-mon">${monNames[d.getMonth()]}</div>
              <div class="comp-date-mon">${d.getFullYear()}</div>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${c.name}</div>
              ${c.place?`<div style="font-size:12px;color:var(--grey);">📍 ${c.place}</div>`:''}
              ${c.category?`<div style="margin-top:5px;"><span class="chip chip-amber">${c.category}</span></div>`:''}
              <div style="font-size:11px;color:var(--cyan);margin-top:5px;font-weight:700;">En ${daysLeft} día${daysLeft!==1?'s':''}</div>
              ${c.notes?`<p style="font-size:11px;color:rgba(232,240,245,.4);margin-top:4px;">${c.notes}</p>`:''}
              <button class="btn btn-xs btn-amber" style="margin-top:6px;" onclick="openCompMode('${c.id}','${athleteId}','${escAttr(S.athletes.find(a=>a.id===athleteId)?.name||'')}')">🏆 Modo Competencia</button>
            </div>
            ${isCoach?`<div style="display:flex;flex-direction:column;gap:4px;">
              <button class="btn btn-xs btn-outline" onclick="openCompModal('${athleteId}','${c.id}')">✏️</button>
              <button class="btn btn-xs btn-red" onclick="deleteComp('${c.id}','${athleteId}')">🗑</button>
            </div>`:''}
          </div>`;
        });
      }
      if(past.length){
        html+=`<div style="font-size:10px;color:var(--grey);letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px;">Pasadas</div>`;
        past.slice(0,3).forEach(c=>{
          const d=new Date(c.date+'T00:00:00');
          const monNames=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
          html+=`<div class="comp-card comp-past">
            <div class="comp-date-box">
              <div class="comp-date-day">${d.getDate()}</div>
              <div class="comp-date-mon">${monNames[d.getMonth()]}</div>
            </div>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:600;">${c.name}</div>
              ${c.place?`<div style="font-size:11px;color:var(--grey);">📍 ${c.place}</div>`:''}
              ${c.category?`<span class="chip chip-grey" style="margin-top:4px;">${c.category}</span>`:''}
              <button class="btn btn-xs" style="margin-top:4px;background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.25);font-size:9px;" onclick="openCompMode('${c.id}','${athleteId}','${escAttr(S.athletes.find(a=>a.id===athleteId)?.name||'')}')">🏆 Ver Competencia</button>
            </div>
            ${isCoach?`<div style="display:flex;flex-direction:column;gap:4px;">
              <button class="btn btn-xs btn-outline" onclick="openCompModal('${athleteId}','${c.id}')">✏️</button>
              <button class="btn btn-xs btn-red" onclick="deleteComp('${c.id}','${athleteId}')">🗑</button>
            </div>`:''}
          </div>`;
        });
      }
    }
    el.innerHTML=html;
  } catch(e){ el.innerHTML='<p style="font-size:12px;color:var(--red);padding:8px;">Error cargando competencias</p>'; console.error(e); }
}

// Temp state for comp mode
let _cm={compId:null,athId:null,athName:'',eventName:''};

function openCompMode(compId, athleteId, athleteName){
  _cm={compId,athId:athleteId,athName:athleteName,eventName:''};
  let m=document.getElementById('compModeModal'); if(m) m.remove();
  m=document.createElement('div'); m.className='modal-overlay'; m.id='compModeModal';
  m.style.cssText='z-index:9999;overflow-y:auto;';
  m.innerHTML=`<div class="modal-sheet" style="max-height:92vh;overflow-y:auto;padding-bottom:30px;">
    <div class="modal-head" style="position:sticky;top:0;background:var(--bg2);z-index:10;padding-bottom:8px;">
      <div><div class="modal-title">🏆 Modo Competencia</div><div style="font-size:11px;color:var(--grey);">${esc(athleteName)}</div></div>
      <button class="modal-close" onclick="closeModal('compModeModal')">✕</button>
    </div>
    <div id="compModeContent"><p style="text-align:center;padding:20px;color:var(--grey);">Cargando...</p></div>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)closeModal('compModeModal');};
  loadCompMode(compId, athleteId, athleteName);
}

          // Detectar estructura nueva (pre/post/coach) vs vieja

              ext = parsed;

              waves = parsed;
            }

            // Estructura vieja con " | Olas: "

              const parts=rawNotes.split(' | Olas: ');

                <div style="font-size:8px;color:var(--grey);">Resultado</div>

              <div style="display:flex;gap:6px;align-items:center;font-size:9px;color:var(--grey);">

            </div>
          </div>`;
        }).join(''):`<div style="text-align:center;padding:20px;color:var(--grey);font-size:12px;">Sin heats registrados aún. Tocá "+ Nuevo Heat" para arrancar.</div>`}

async function saveCompPrep(kind){
  const {compId,athId:athleteId,eventName}=_cm;
  const label = kind === 'eval' ? 'Evaluación' : 'Preparación';
  showLoad(true);
  try {
    const prep={
      wave_type:gv('cm-wave-type'), wave_dir:gv('cm-wave-dir'), wave_size:gv('cm-wave-size'),
      hazards:gv('cm-hazards'), takeoff_zone:gv('cm-takeoff'),
      mantra:gv('cm-mantra'),
      pre_warmup:document.getElementById('cm-pre-warmup')?.checked||false,
      pre_simul:document.getElementById('cm-pre-simul')?.checked||false,
      pre_breath:document.getElementById('cm-pre-breath')?.checked||false,
      pre_visual:document.getElementById('cm-pre-visual')?.checked||false,
      pre_focus:document.getElementById('cm-pre-focus')?.checked||false,
      pre_hydrate:document.getElementById('cm-pre-hydrate')?.checked||false,
      pre_board:document.getElementById('cm-pre-board')?.checked||false,
      board_size:gv('cm-board-size'), board_liters:gv('cm-board-liters'),
      board_model:gv('cm-board-model'), board_fins:gv('cm-board-fins'),
      good_wave:gv('cm-good-wave'), target_score:gv('cm-target-score'),
      key_moves:gv('cm-key-moves'), lineup_pos:gv('cm-lineup-pos'),
      heat_strategy:gv('cm-heat-strategy'), strategy:gv('cm-strategy'),
      confidence:gv('cm-confidence'),
      what_worked:gv('cm-what-worked'), what_failed:gv('cm-what-failed'), next_train:gv('cm-next-train'),
      step1_done:!!(gv('cm-wave-type')&&gv('cm-wave-dir')),
      step2_done:!!(document.getElementById('cm-pre-warmup')?.checked||document.getElementById('cm-pre-simul')?.checked),
      step3_done:!!(gv('cm-good-wave')||gv('cm-target-score')||gv('cm-lineup-pos')||gv('cm-heat-strategy')),
      step4_done:!!(gv('cm-confidence')),
    };
    // Check if prep record exists
    const{data:existing}=await db.from('tss_comp_evaluations').select('id')
      .eq('athlete_id',athleteId).eq('event_name',eventName).eq('round_reached','__PREP__').maybeSingle();
    const payload={
      athlete_id:athleteId, date:todayStr(), event_name:eventName,
      round_reached:'__PREP__', notes:JSON.stringify(prep), created_by:S.user.id
    };
    let res;
    if(existing){ res=await db.from('tss_comp_evaluations').update(payload).eq('id',existing.id); }
    else { res=await db.from('tss_comp_evaluations').insert(payload); }
    if(res.error){
      // Retry without created_by in case column doesn't exist
      delete payload.created_by;
      if(existing){ res=await db.from('tss_comp_evaluations').update(payload).eq('id',existing.id); }
      else { res=await db.from('tss_comp_evaluations').insert(payload); }
      if(res.error) throw res.error;
    }
    toast('✅ '+label+' guardada','success');
  } catch(e){ toast('Error al guardar '+label.toLowerCase()+': '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function saveHeatEntry(){
  const {compId,athId:athleteId,athName:athleteName,eventName}=_cm;
  const heatId = gv('ht-id');
  const round = gv('ht-round');
  const wavesStr = gv('ht-waves');
  const result = gv('ht-result');
  if(!round){toast('Selecciona la ronda','error');return;}

  // Scores (opcional al guardar pre-heat — sólo si están)
  let waves=[], best1=0, best2=0, total=0;
  if(wavesStr){
    waves = wavesStr.split(',').map(w=>parseFloat(w.trim())).filter(w=>!isNaN(w));
    const sorted = [...waves].sort((a,b)=>b-a);
    best1 = sorted[0]||0;
    best2 = sorted[1]||0;
    total = best1+best2;
  }

  // Recoger las 3 secciones (estructura nueva en notes JSON)
  const ext = {
    pre: {
      mantra: gv('ht-pre-mantra'),
      position: gv('ht-pre-position'),
      strategy: gv('ht-pre-strategy'),
      confidence: parseInt(gv('ht-pre-confidence'))||null
    },
    post: {
      worked: gv('ht-post-worked'),
      failed: gv('ht-post-failed'),
      feeling: parseInt(gv('ht-post-feeling'))||null,
      waves: waves
    },
    coach: {
      mental: parseInt(gv('ht-coach-mental'))||null,
      fisico: parseInt(gv('ht-coach-fisico'))||null,
      tecnico: parseInt(gv('ht-coach-tecnico'))||null,
      tactico: parseInt(gv('ht-coach-tactico'))||null,
      equipo: parseInt(gv('ht-coach-equipo'))||null,
      observation: gv('ht-coach-observation'),
      action: gv('ht-coach-action')
    },
    updated_at: new Date().toISOString(),
    last_editor: S.user.id
  };

  showLoad(true);
  try {
    let heatPayload = {
      athlete_id: athleteId,
      date: todayStr(),
      event_name: eventName,
      round_reached: round,
      avg_wave_score: best1 || null,
      highest_wave: best2 || null,
      heat_total: total || null,
      final_ranking: result || null,
      notes: JSON.stringify(ext),
      created_by: S.user.id
    };
    let res;
    if(heatId){
      // Update existing — no tocar created_by
      delete heatPayload.created_by;
      res = await db.from('tss_comp_evaluations').update(heatPayload).eq('id', heatId);
    } else {
      res = await db.from('tss_comp_evaluations').insert(heatPayload);
      if(res.error){
        // Retry sin created_by
        delete heatPayload.created_by;
        res = await db.from('tss_comp_evaluations').insert(heatPayload);
      }
    }
    if(res.error) throw res.error;
    toast('✅ Heat guardado','success');
    closeModal('heatEntryModal');
    loadCompMode(compId, athleteId, athleteName);
  } catch(e){
    const msg = (e && (e.message||e.hint||e.details||e.code)) || 'desconocido';
    toast('Error al guardar heat: '+msg,'error');
    console.error('saveHeatEntry error:', e, 'payload was:', { athleteId, eventName, round, wavesStr, result, heatId });
  }
  finally { showLoad(false); }
}

async function loadMessages(){
  const el=document.getElementById('msgList'); if(!el) return;
  const isCoach = S.user.role==='coach'||S.user.role==='acoach';
  try {
    let msgs;
    if(isCoach){
      const{data}=await db.from('tss_messages').select('*').eq('sender_id',S.user.id).order('created_at',{ascending:false}).limit(200);
      // Group fan-out messages (same body+subject sent at same time) into one card
      const grouped = []; const seen = new Set();
      (data||[]).forEach(m=>{
        const key = (m.body||'')+'|'+(m.subject||'')+'|'+m.created_at;
        if(seen.has(key)){
          // Find existing group and add recipient
          const g = grouped.find(g=>g._groupKey===key);
          if(g) g._recipients.push(m.recipient_id);
        } else {
          seen.add(key);
          m._groupKey=key; m._recipients=[m.recipient_id];
          grouped.push(m);
        }
      });
      msgs=grouped.slice(0,50);
    } else {
      const{data}=await db.from('tss_messages').select('*').eq('recipient_id',S.user.id).order('created_at',{ascending:false}).limit(50);
      msgs=data||[];
      // Mark unread as read
      const unread = msgs.filter(m=>!m.read_at && m.recipient_id===S.user.id);
      for(const m of unread){
        await db.from('tss_messages').update({read_at:new Date().toISOString()}).eq('id',m.id);
      }
    }
    if(!msgs.length){
      el.innerHTML='<div class="empty" style="padding:32px 0;"><p class="empty-txt">Sin mensajes</p></div>';
      return;
    }
    el.innerHTML=msgs.map(m=>{
      const recipName = isCoach && m._recipients && m._recipients.length>1
        ? (m._recipients.length>=S.athletes.length?'Todo el equipo':m._recipients.length+' atletas')
        : (m.recipient_id==='all'?'Todo el equipo':(S.athletes.find(a=>a.id===m.recipient_id)?.name||'Atleta'));
      const senderName = S.athletes.find(a=>a.id===m.sender_id)?.name || (m.sender_id===S.user.id?S.user.name:'Coach');
      const dt = new Date(m.created_at);
      const timeStr = dt.toLocaleDateString('es-SV',{day:'numeric',month:'short'})+' '+dt.toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'});
      const urgentBadge = m.priority==='urgent'?'<span class="chip chip-red" style="font-size:9px;margin-left:6px;">URGENTE</span>':'';
      return `<div class="card" style="margin-bottom:8px;${!isCoach && !m.read_at?'border-left:3px solid var(--cyan);':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
          <div style="font-size:13px;font-weight:700;color:var(--white);">${isCoach?'Para: '+recipName:'De: '+senderName}${urgentBadge}</div>
          <div style="font-size:10px;color:var(--grey);white-space:nowrap;">${timeStr}</div>
        </div>
        ${m.subject?`<div style="font-size:12px;font-weight:600;color:var(--cyan);margin-bottom:4px;">${m.subject}</div>`:''}
        <p style="font-size:12px;color:rgba(232,240,245,.7);line-height:1.6;margin:0;white-space:pre-wrap;">${m.body}</p>
        ${isCoach?`<button class="btn btn-xs btn-ghost" style="margin-top:6px;font-size:10px;" onclick="deleteMsg('${m.id}')">🗑 Eliminar</button>`:''}
      </div>`;
    }).join('');
  } catch(e){
    el.innerHTML='<p style="padding:20px;text-align:center;color:var(--red);font-size:12px;">Error al cargar mensajes. La tabla de mensajes puede no existir aún.</p>';
    console.error(e);
  }
}

function openSendMsgModal(){
  const athOpts = S.athletes.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  let m=document.getElementById('sendMsgModal'); if(m)m.remove();
  m=document.createElement('div'); m.className='modal-overlay'; m.id='sendMsgModal';
  m.innerHTML=`<div class="modal-sheet">
    <div class="modal-head"><div class="modal-title">✉️ Nuevo Mensaje</div><button class="btn-icon" onclick="closeModal('sendMsgModal')">✕</button></div>
    <label class="inp-label">Para</label>
    <select class="sel" id="msg-recipient">
      <option value="all">📢 Todo el equipo</option>
      ${S.groups.map(g=>`<option value="group_${g.id}">👥 ${g.name}</option>`).join('')}
      <optgroup label="Individual">${athOpts}</optgroup>
    </select>
    <label class="inp-label" style="margin-top:10px;">Asunto (opcional)</label>
    <input class="inp" id="msg-subject" placeholder="Ej: Cambio de horario...">
    <label class="inp-label" style="margin-top:10px;">Mensaje</label>
    <textarea class="inp" id="msg-body" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
    <label class="inp-label" style="margin-top:10px;">Prioridad</label>
    <div style="display:flex;gap:8px;">
      <button class="opt-pill on" data-v="normal" onclick="pickMsgPriority(this)">Normal</button>
      <button class="opt-pill" data-v="urgent" onclick="pickMsgPriority(this)">🔴 Urgente</button>
    </div>
    <button class="btn btn-cyan" style="width:100%;margin-top:16px;" onclick="sendMessage()">📤 Enviar</button>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)closeModal('sendMsgModal');};
}

function pickMsgPriority(btn){
  btn.closest('div').querySelectorAll('.opt-pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

async function sendMessage(){
  const recipient = document.getElementById('msg-recipient').value;
  const subject = document.getElementById('msg-subject').value.trim();
  const body = document.getElementById('msg-body').value.trim();
  const priority = document.querySelector('#sendMsgModal .opt-pill.on')?.dataset.v||'normal';
  if(!recipient){ toast('Selecciona un destinatario','error'); return; }
  if(!body){ toast('Escribe un mensaje','error'); return; }

  try {
    showLoad(true);
    // If sending to a group, send individual messages to each member
    if(recipient.startsWith('group_')){
      const groupId = recipient.replace('group_','');
      const{data:members}=await db.from('tss_group_members').select('athlete_id').eq('group_id',groupId);
      const inserts = (members||[]).map(m=>({
        sender_id: S.user.id, recipient_id: m.athlete_id,
        subject, body, priority, sender_name: S.user.name
      }));
      if(inserts.length){ const{error}=await db.from('tss_messages').insert(inserts); if(error) throw error; }
    } else if(recipient==='all'){
      // Fan-out: send individual message to each athlete so read tracking works
      const inserts = S.athletes.map(a=>({
        sender_id: S.user.id, recipient_id: a.id,
        subject, body, priority, sender_name: S.user.name
      }));
      if(inserts.length){ const{error}=await db.from('tss_messages').insert(inserts); if(error) throw error; }
    } else {
      const{error}=await db.from('tss_messages').insert({
        sender_id: S.user.id, recipient_id: recipient,
        subject, body, priority, sender_name: S.user.name
      });
      if(error) throw error;
    }
    toast('✅ Mensaje enviado','success');
    closeModal('sendMsgModal');
    await loadMessages();
  } catch(e){ toast('Error al enviar: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function deleteMsg(msgId){
  if(!confirm('¿Eliminar este mensaje?')) return;
  try {
    const{error}=await db.from('tss_messages').delete().eq('id',msgId);
    if(error) throw error;
    toast('Mensaje eliminado','success');
    await loadMessages();
  } catch(e){ toast('Error al eliminar','error'); console.error(e); }
}

async function getUnreadCount(){
  try {
    const{data,count}=await db.from('tss_messages').select('id',{count:'exact',head:true}).eq('recipient_id',S.user.id).is('read_at',null);
    return count||0;
  } catch(e){ return 0; }
}

async function boot(){
  // Always show login screen — no auto-restore
  localStorage.removeItem('tss_uid');
  document.getElementById('landingScreen').style.display='flex';
  showLoad(false);
}
boot();
</script>
