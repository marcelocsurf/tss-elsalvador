/* COPY WEEK */
function openCopyWeek(fromDate){
  const m=document.createElement('div'); m.className='modal-overlay'; m.id='copyWeekModal';
  m.innerHTML=`<div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">Copiar Semana</div><div class="modal-sub">Duplica todos los planes de una semana</div></div>
      <button class="modal-close" onclick="closeModal('copyWeekModal')">✕</button>
    </div>
    <label class="inp-label">Semana origen (cualquier día de esa semana)</label>
    <input type="date" class="inp" id="cwFrom" value="${fromDate}">
    <label class="inp-label">Semana destino (primer día de la semana destino)</label>
    <input type="date" class="inp" id="cwTo">
    <p style="font-size:11px;color:var(--grey);margin-top:8px;line-height:1.6;">⚠️ Solo copia planes que no existan ya en la semana destino.</p>
    <button class="save-btn" style="margin-top:16px;" onclick="execCopyWeek()">📋 Copiar Semana</button>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) closeModal('copyWeekModal'); };
}

async function execCopyWeek(){
  const fromDate=new Date(gv('cwFrom')+'T00:00:00');
  const toDate=new Date(gv('cwTo')+'T00:00:00');
  if(!gv('cwFrom')||!gv('cwTo')){toast('Completa las fechas','error');return;}
  // Get start of from-week (Monday)
  const fromDay=fromDate.getDay()||7;
  const fromMon=new Date(fromDate); fromMon.setDate(fromDate.getDate()-(fromDay-1));
  // Get start of to-week
  const toDay=toDate.getDay()||7;
  const toMon=new Date(toDate); toMon.setDate(toDate.getDate()-(toDay-1));
  const diff=Math.round((toMon-fromMon)/(1000*60*60*24));
  if(diff===0){toast('Las semanas son iguales','error');return;}

  showLoad(true);
  try {
    // Get all plans from from-week
    const dates=[];
    for(let i=0;i<7;i++){ const d=new Date(fromMon); d.setDate(fromMon.getDate()+i); dates.push(d.toISOString().split('T')[0]); }
    const{data:plans}=await db.from('tss_daily_plans').select('*').in('date',dates);
    if(!plans||!plans.length){toast('No hay planes en la semana origen','error');return;}

    let copied=0;
    for(const p of plans){
      const newDate=new Date(p.date+'T00:00:00'); newDate.setDate(newDate.getDate()+diff);
      const nd=newDate.toISOString().split('T')[0];
      // Check if plan exists
      let exQ=db.from('tss_daily_plans').select('id').eq('date',nd).eq('scope',p.scope);
      if(p.target_id) exQ=exQ.eq('target_id',p.target_id); else exQ=exQ.is('target_id',null);
      const{data:ex}=await exQ.maybeSingle();
      if(!ex){
        const{id:_,...rest}=p;
        await db.from('tss_daily_plans').insert({...rest,date:nd,created_by:S.user.id});
        copied++;
      }
    }
    toast(`✅ ${copied} planes copiados`,'success');
    closeModal('copyWeekModal'); renderPlanDias();
  } catch(e){toast('Error','error');console.error(e);}
  finally{showLoad(false);}
}

async function saveGroup(existId){
  const name=gv('gName'); if(!name){toast('Ingresa el nombre','error');return;}
  const coach_id = document.getElementById('gCoachId')?.value || null;
  const selAths=[...document.querySelectorAll('#groupAthList .opt-pill')].filter(b=>b.dataset.sel==='1').map(b=>b.id.replace('ga-',''));

  try {
    let groupId=existId;
    if(existId){
      await db.from('tss_groups').update({name, coach_id}).eq('id',existId);
    } else {
      const{data}=await db.from('tss_groups').insert({name, coach_id, created_by:S.user.id}).select().single();
      groupId=data.id;

    // Sync members
    await db.from('tss_group_members').delete().eq('group_id',groupId);

    <textarea class="ta" id="videoDesc" style="min-height:90px;" placeholder="Qué se trabaja con este video, cómo ejecutarlo, foco principal..."></textarea>
    <button class="save-btn" style="margin-top:16px;" onclick="saveVideo()">💾 Guardar Video</button>
  </div>`;
  document.body.appendChild(m);
  m.onclick = e => { if(e.target===m) closeModal('videoModal'); };
  // Live preview cuando se pega URL
  document.getElementById('videoUrl').addEventListener('input', renderVideoModalPreview);
  setTimeout(()=>document.getElementById('videoTitle')?.focus(), 100);
}

function openEditVideoModal(videoId){
  if(S.user.role!=='coach'){ toast('Solo el head coach puede editar videos','error'); return; }
  const v = (S.videoLibrary||[]).find(x=>x.id===videoId);
  if(!v){ toast('Video no encontrado','error'); return; }
  openAddVideoModal();
  // Prellenar
  setTimeout(()=>{
    document.getElementById('videoEditId').value = v.id;
    document.getElementById('videoTitle').value = v.title||'';
    document.getElementById('videoUrl').value = v.video_url||'';
    document.getElementById('videoPillar').value = v.pillar||'otro';
    document.getElementById('videoDesc').value = v.description||'';
    document.querySelector('#videoModal .modal-title').textContent = '📚 Editar Video';
    renderVideoModalPreview();
  }, 50);
}

function renderVideoModalPreview(){
  const url = document.getElementById('videoUrl')?.value;
  const wrap = document.getElementById('videoPreview'); if(!wrap) return;
  const id = ytId(url);
  if(id){
    wrap.innerHTML = `<div style="border-radius:8px;overflow:hidden;background:var(--bg3);"><iframe width="100%" height="180" src="https://www.youtube-nocookie.com/embed/${id}" frameborder="0" allowfullscreen style="display:block;border-radius:8px;"></iframe></div>`;
  } else if(url) {
    wrap.innerHTML = `<div style="font-size:11px;color:var(--amber);padding:8px;">⚠️ URL de YouTube no reconocida</div>`;
  } else {
    wrap.innerHTML = '';
  }
}

async function saveVideo(){
  const editId = document.getElementById('videoEditId')?.value;
  const title = document.getElementById('videoTitle')?.value?.trim();
  const url = document.getElementById('videoUrl')?.value?.trim();
  const pillar = document.getElementById('videoPillar')?.value;
  const description = document.getElementById('videoDesc')?.value?.trim() || null;
  if(!title){ toast('Ingresá el título','error'); return; }
  if(!url || !ytId(url)){ toast('URL de YouTube inválida','error'); return; }
  if(!pillar){ toast('Elegí un pilar','error'); return; }
  showLoad(true);
  try {
    if(editId){
      const{error}=await db.from('tss_video_library').update({title,video_url:url,pillar,description}).eq('id',editId);
      if(error) throw error;
      const i = (S.videoLibrary||[]).findIndex(v=>v.id===editId);
      if(i>=0) S.videoLibrary[i] = {...S.videoLibrary[i], title, video_url:url, pillar, description};
      toast('✅ Video actualizado','success');
    } else {
      const{data,error}=await db.from('tss_video_library')
        .insert({title,video_url:url,pillar,description,created_by:S.user.id})
        .select().single();
      if(error) throw error;
      (S.videoLibrary = S.videoLibrary||[]).unshift(data);
      toast('✅ Video agregado','success');
    }
    closeModal('videoModal');
    paintVideoLibrary();
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

async function deleteVideo(videoId){
  if(S.user.role!=='coach'){ toast('Solo el head coach puede borrar','error'); return; }
  if(!confirm('¿Eliminar este video de la librería? (los planes que ya lo usan se mantienen sin cambios)')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_video_library').update({archived:true}).eq('id',videoId);
    if(error) throw error;
    S.videoLibrary = (S.videoLibrary||[]).filter(v=>v.id!==videoId);
    toast('✅ Video eliminado','success');
    paintVideoLibrary();
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

/* PICKER de la librería desde el modal de creación de bloque */
async function openVideoPicker(){
  // Cargar librería si no está en memoria
  if(!S.videoLibrary || !S.videoLibrary.length){
    try {
      const{data}=await db.from('tss_video_library').select('*').neq('archived',true).order('created_at',{ascending:false});
      S.videoLibrary = data||[];
    } catch(e){ toast('Error cargando librería','error'); return; }
  }
  // Filtrar por el work_type actual del bloque (si está seleccionado)
  const currentPillar = document.getElementById('blockTypeVal')?.value || 'all';
  let m = document.getElementById('videoPickerModal'); if(m) m.remove();
  m = document.createElement('div'); m.className='modal-overlay'; m.id='videoPickerModal';
  m.style.zIndex='10001'; // por encima del modal de bloque
  m.innerHTML = `<div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-title">📚 Elegir Video</div>
      <button class="modal-close" onclick="closeModal('videoPickerModal')">✕</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="vpFilterRow">
      <button class="opt-pill${currentPillar==='all'?' on':''}" onclick="renderVideoPickerList('all',this)">📚 Todos</button>
      ${BLOCK_TYPES.map(bt=>`<button class="opt-pill${currentPillar===bt.id?' on':''}" onclick="renderVideoPickerList('${bt.id}',this)">${bt.emoji} ${bt.label}</button>`).join('')}
    </div>
    <div id="vpList"></div>
  </div>`;
  document.body.appendChild(m);
  m.onclick = e => { if(e.target===m) closeModal('videoPickerModal'); };
  renderVideoPickerList(currentPillar, null);
}

function renderVideoPickerList(pillar, btn){
  if(btn){
    document.querySelectorAll('#vpFilterRow .opt-pill').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
  const list = (S.videoLibrary||[]).filter(v => pillar==='all' || v.pillar===pillar);
  const wrap = document.getElementById('vpList'); if(!wrap) return;
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p class="empty-txt">Sin videos en este pilar. Agregá uno desde Planeación → 📚 Videos.</p></div>`;
    return;
  }
  wrap.innerHTML = list.map(v=>{
    const bt = getBlockType(v.pillar);
    const yid = ytId(v.video_url);
    const thumb = yid ? `<img src="https://img.youtube.com/vi/${yid}/mqdefault.jpg" style="width:100px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;" onerror="this.style.display='none'">` : `<div style="width:100px;height:60px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🎬</div>`;
    return `<div class="card anim-up" style="margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;" onclick="pickVideoFromLib('${v.id}')">
      ${thumb}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;color:var(--white);">${esc(v.title)}</div>
        <span style="font-size:10px;color:var(--cyan);">${bt.emoji} ${bt.label}</span>
        ${v.description?`<div style="font-size:11px;color:rgba(232,240,245,.55);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;">${esc(v.description)}</div>`:''}
      </div>
      <span style="color:var(--cyan);font-size:18px;">›</span>
    </div>`;
  }).join('');
}

function pickVideoFromLib(videoId){
  const v = (S.videoLibrary||[]).find(x=>x.id===videoId);
  if(!v){ toast('Video no encontrado','error'); return; }
  // Rellenar campos del bloque (sin sobrescribir si ya tienen contenido)
  const urlEl = document.getElementById('blockVideo');
  const objEl = document.getElementById('blockObj');
  const notesEl = document.getElementById('blockNotes');
  if(urlEl){
    if(urlEl.value && urlEl.value !== v.video_url){
      if(!confirm('El campo URL ya tiene un video. ¿Reemplazarlo?')){ closeModal('videoPickerModal'); return; }
    }
    urlEl.value = v.video_url;
  }
  if(objEl && !objEl.value.trim()){ objEl.value = v.title || ''; }
  if(notesEl && !notesEl.value.trim() && v.description){ notesEl.value = v.description; }
  closeModal('videoPickerModal');
  toast('✅ Video cargado · podés ajustar título o notas','success');
}

function pickBelt(beltId, btn){
  btn.closest('.opt-row').querySelectorAll('.belt-pill').forEach(b=>{
    const id=b.dataset.belt; const belt=getBelt(id);
    b.classList.remove('on');
    b.style.background='transparent';
    b.style.color='var(--white)';
  });
  const belt = getBelt(beltId);
  btn.classList.add('on');
  btn.style.background = belt.color;
  btn.style.color = belt.text;
  document.getElementById('ev-belt').value = beltId;
}

async function saveEval(athleteId){
  const p=parseInt(gv('sc-phys')||0),t=parseInt(gv('sc-tech')||0),ta=parseInt(gv('sc-tact')||0),m=parseInt(gv('sc-mind')||0),c=parseInt(gv('sc-comp')||0);
  if(!p||!t||!ta||!m||!c){toast('Completa todos los puntajes (incluyendo Táctica)','error');return;}
  showLoad(true);
  try {
    const{error}=await db.from('tss_evaluations').insert({athlete_id:athleteId,coach_id:S.user.id,date:gv('evDate'),physical:p,technique:t,tactical:ta,mindset:m,competitive:c,strengths:gv('evStr'),limitations:gv('evLim'),recommendations:gv('evRec')});
    if(error) throw error;
    // Si el coach cambió la cinta, actualizar en profile
    const newBelt = gv('ev-belt');
    if(newBelt){
      const{data:current}=await db.from('tss_profiles').select('current_belt').eq('id',athleteId).single();
      if(current?.current_belt !== newBelt){
        await db.from('tss_profiles').update({current_belt:newBelt}).eq('id',athleteId);
        // Update local cache
        const ath = (S.athletes||[]).find(a=>a.id===athleteId); if(ath) ath.current_belt = newBelt;
        toast('✅ Evaluación guardada · cinta actualizada a '+getBelt(newBelt).name,'success');
      } else {
        toast('✅ Evaluación guardada','success');
      }
    } else {
      toast('✅ Evaluación guardada','success');
    }
    document.getElementById('eaSel').value=''; document.getElementById('evalFormArea').innerHTML='';
    setTimeout(()=>{ if(typeof vPanel==='function') vPanel(); if(typeof renderEvalHist==='function') renderEvalHist(); },300);
  } catch(e){toast('Error al guardar: '+e.message,'error');console.error(e);}
  finally{showLoad(false);}
}

function renderEvalFullBlock(bId){
  const blockMeta = EVAL_FULL_BLOCKS.find(b=>b.id===bId);
  const block = EVAL_FULL_ITEMS[bId];
  if(!block) return '';

  const sectionsHtml = block.sections.map(sec => {
    const itemsHtml = sec.items.map(it => {
      const itemType = it.type || sec.type || 'rating';
      const itemId = `ef-${bId}-${it.id}`;
      if(itemType === 'rating'){
        return `<div style="margin-bottom:10px;">
          <label class="inp-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span>${esc(it.label)}</span>
          </label>
          ${it.hint?`<div style="font-size:10px;color:var(--grey);margin-top:-2px;margin-bottom:4px;font-style:italic;">${esc(it.hint)}</div>`:''}
          <div class="scale-row" id="${itemId}-row">${[1,2,3,4,5].map(n=>`<button type="button" class="se-n" onclick="pickEfRating('${itemId}',${n},this)">${n}</button>`).join('')}</div>
          <input type="hidden" id="${itemId}" value="0">
        </div>`;
      } else if(itemType === 'number'){
        return `<div style="margin-bottom:10px;">
          <label class="inp-label">${esc(it.label)}</label>
          ${it.hint?`<div style="font-size:10px;color:var(--grey);margin-bottom:4px;font-style:italic;">${esc(it.hint)}</div>`:''}
          <input type="${it.type==='text'?'text':'number'}" step="0.1" class="inp" id="${itemId}" placeholder="Valor">
        </div>`;
      } else {
        // text
        return `<div style="margin-bottom:10px;">
          <label class="inp-label">${esc(it.label)}</label>
          ${it.hint?`<div style="font-size:10px;color:var(--grey);margin-bottom:4px;font-style:italic;">${esc(it.hint)}</div>`:''}
          <textarea class="ta" id="${itemId}" placeholder="..."></textarea>
        </div>`;
      }
    }).join('');
    return `<div style="margin-top:14px;">
      <div style="font-size:11px;font-weight:700;color:var(--cyan);margin-bottom:8px;letter-spacing:.3px;">${esc(sec.label)}</div>
      ${itemsHtml}
    </div>`;
  }).join('');

  return `<div class="card card-${blockMeta.color} anim-up" style="margin-bottom:10px;">
    <div style="font-size:14px;font-weight:800;color:var(--white);margin-bottom:6px;">${blockMeta.icon} ${blockMeta.label.toUpperCase()}</div>
    <div style="font-size:10px;color:var(--grey);margin-bottom:8px;">Escala 1-5: 1=No ejecuta · 2=Intenta · 3=Errores · 4=Control · 5=Domina</div>
    ${sectionsHtml}
  </div>`;
}

async function saveEvalFull(){
  const s = _evalFullSetup;
  if(!s.athleteId){ toast('Sin atleta','error'); return; }

  // Recolectar valores de cada bloque
  const blockData = {};
  s.blocks.forEach(bId => {
    const block = EVAL_FULL_ITEMS[bId];
    if(!block) return;
    const data = {};
    block.sections.forEach(sec => {
      sec.items.forEach(it => {
        const itemType = it.type || sec.type || 'rating';
        const val = gv(`ef-${bId}-${it.id}`);
        if(val && val !== '0'){
          data[it.id] = itemType === 'rating' || itemType === 'number' ? (parseFloat(val)||val) : val;
        }
      });
    });
    blockData[bId] = data;
  });

  // Resumen
  const summary = {
    strengths: [gv('ef-strength1'),gv('ef-strength2'),gv('ef-strength3')].filter(Boolean),
    improvements: [gv('ef-improve1'),gv('ef-improve2'),gv('ef-improve3')].filter(Boolean),
  };
  const actionPlan = {
    performance_goal: gv('ef-perf-goal'),
    outcome_goal: gv('ef-outcome-goal'),
    drills: gv('ef-drills'),
    frequency: gv('ef-frequency'),
    next_eval_date: gv('ef-next-eval'),
  };
  const diagnosis = {
    dominant_difficulty: gv('ef-diag-difficulty'),
    solution_blocks: gv('ef-diag-blocks'),
    recommended_drill: gv('ef-diag-drill'),
  };
  const belt = gv('ef-belt');

  // Calcular promedios por bloque (solo de ratings)
  const blockAvg = bId => {
    const data = blockData[bId] || {};
    const block = EVAL_FULL_ITEMS[bId];
    if(!block) return null;
    const ratings = [];
    block.sections.forEach(sec => {
      const isRating = !sec.type || sec.type === 'rating';
      if(!isRating) return;
      sec.items.forEach(it => {
        if(it.type && it.type !== 'rating') return;
        const v = data[it.id];
        if(typeof v === 'number' && v > 0 && v <= 5) ratings.push(v);
      });
    });
    return ratings.length ? Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length * 10)/10 : null;
  };

  const physAvg = blockAvg('fisico');
  const techAvg = (() => {
    const a = blockAvg('tecnica');
    const b = blockAvg('maniobras');
    const c = blockAvg('longboard');
    const vals = [a,b,c].filter(v=>v!==null);
    return vals.length ? Math.round(vals.reduce((x,y)=>x+y,0)/vals.length * 10)/10 : null;
  })();
  const tactAvg = blockAvg('tactica');
  const mentAvg = blockAvg('mental');

  showLoad(true);
  try {
    // 1. Guardar la eval completa
    const payload = {
      athlete_id: s.athleteId,
      coach_id: S.user.id,
      date: s.date,
      eval_type: s.evalType,
      discipline: s.discipline,
      location: s.location || null,
      conditions: s.conditions || null,
      physical_json:   blockData.fisico    || null,
      tech_json:       blockData.tecnica   || null,
      maneuvers_json:  blockData.maniobras || null,
      longboard_json:  blockData.longboard || null,
      tactical_json:   blockData.tactica   || null,
      mental_json:     blockData.mental    || null,
      summary_json:    (summary.strengths.length || summary.improvements.length) ? summary : null,
      action_plan_json: Object.values(actionPlan).some(v=>v) ? actionPlan : null,
      diagnosis_json:  Object.values(diagnosis).some(v=>v) ? diagnosis : null,
      coach_narrative: gv('ef-narrative') || null,
      belt_assigned:   belt || null,
      blocks_evaluated: s.blocks,
    };
    const{error:e1} = await db.from('tss_evaluations_full').insert(payload);
    if(e1) throw e1;

    // 2. Guardar también la eval simple (para que el radar/barras se actualicen)
    if(physAvg || techAvg || tactAvg || mentAvg){
      await db.from('tss_evaluations').insert({
        athlete_id: s.athleteId,
        coach_id: S.user.id,
        date: s.date,
        physical: physAvg ? Math.round(physAvg) : null,
        technique: techAvg ? Math.round(techAvg) : null,
        tactical: tactAvg ? Math.round(tactAvg) : null,
        mindset: mentAvg ? Math.round(mentAvg) : null,
        strengths: summary.strengths.join(' · ') || null,
        limitations: summary.improvements.join(' · ') || null,
        recommendations: actionPlan.drills || null,
      });
    }

    // 3. Si es promoción de cinta y se otorgó, actualizar profile
    if(belt && s.evalType==='promocion_cinta'){
      await db.from('tss_profiles').update({current_belt: belt}).eq('id', s.athleteId);
      const idx=(S.athletes||[]).findIndex(a=>a.id===s.athleteId);
      if(idx>=0) S.athletes[idx].current_belt = belt;
    }

    toast('✅ Evaluación completa guardada' + (belt?' · cinta '+getBelt(belt).name+' otorgada':''), 'success');
    _evalFullSetup = { athleteId:'', disciplina:'shortboard', evalType:'periodica', blocks:[] };
    evalTab('hist');
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function deleteEvalFull(evalId){
  if(S.user.role==='athlete'){ toast('Solo el coach puede borrar','error'); return; }
  if(!confirm('¿Borrar esta evaluación completa?\n\nEsta acción no se puede deshacer.')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_evaluations_full').delete().eq('id',evalId);
    if(error) throw error;
    toast('✅ Evaluación borrada','success');
    closeModal('evalFullDetail');
    if(typeof loadEvalFullHist==='function') loadEvalFullHist();
    if(S.view==='perfil') vPerfil();
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

    let plan = null; try{ plan = ev.action_plan_json ? (typeof ev.action_plan_json==='object'?ev.action_plan_json:JSON.parse(ev.action_plan_json)) : null; }catch(e){}
    let diag = null; try{ diag = ev.diagnosis_json ? (typeof ev.diagnosis_json==='object'?ev.diagnosis_json:JSON.parse(ev.diagnosis_json)) : null; }catch(e){}

      ${renderBlock('longboard','longboard_json')}

      </div>`:''}

      ${plan && Object.values(plan).some(v=>v) ? `
      <div class="card card-cyan" style="margin-bottom:10px;">
        <div style="font-size:13px;font-weight:800;color:var(--cyan);margin-bottom:6px;">🎯 Plan de Acción</div>

}

async function openDayReport(athleteId, athleteName){
  const today = todayStr();
  // Show modal immediately with loading state
  let m = document.getElementById('dayReportModal');
  if(m) m.remove();
  m = document.createElement('div');
  m.className = 'modal-overlay';
  m.id = 'dayReportModal';
  m.innerHTML = `<div class="modal-sheet" style="max-height:90vh;overflow-y:auto;">
    <div class="modal-head">
      <div class="modal-title">📋 Reporte del Día</div>
      <button class="btn-icon" onclick="closeModal('dayReportModal')">✕</button>
    </div>
    <div id="dayReportBody" style="padding:4px 0;">
      <div style="text-align:center;padding:30px;color:var(--grey);font-size:12px;">Cargando...</div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick = e => { if(e.target===m) closeModal('dayReportModal'); };

  try {
    const [ciRes, plansRes, evalRes] = await Promise.all([
      db.from('tss_daily_checkins').select('*').eq('athlete_id',athleteId).eq('date',today).maybeSingle(),
      db.from('tss_daily_plans').select('*').eq('date',today).order('created_at'),
      db.from('tss_evaluations').select('*').eq('athlete_id',athleteId).order('date',{ascending:false}).limit(1),
    ]);
    const ci = ciRes.data;
    const lastEval = evalRes.data?.[0] || null;

    // Get athlete's plans
    const athProfile = S.athletes.find(a=>a.id===athleteId);
    const myGroups = [];
    const {data:gm} = await db.from('tss_group_members').select('group_id').eq('athlete_id',athleteId);
    (gm||[]).forEach(g=>myGroups.push(g.group_id));
    const plans = (plansRes.data||[]).filter(p=>
      p.scope==='general' ||
      (p.scope==='individual' && p.target_id===athleteId) ||
      (p.scope==='group' && myGroups.includes(p.target_id))
    );

    // Load comp state
    const compKey = 'tss_comp_'+athleteId+'_'+today;
    let compState = {};
    if(ci?.comp_state){ try{ compState=JSON.parse(ci.comp_state); }catch(e){} }

    // Build plan progress
    let planHtml = '';
    if(plans.length){
      // sesion_result is read from check-in row above; parse once
      const _sr = (()=>{ try{ return ci?.sesion_result?JSON.parse(ci.sesion_result):{}; }catch(e){ return {}; } })();
      const isBlockDone = (p) => {
        if(compState[p.id+'_block']) return true;
        if(p.work_type==='sesion'){ const r=_sr[p.id]; return r==='Si'||r==='Parcial'; }
        if(p.work_type==='comp_training'){ const r=_sr[p.id]; return !!(r && typeof r==='object' && (r.mission||(r.waves&&r.waves.length))); }
        return false;
      };
      plans.forEach(p=>{
        const blockDone = isBlockDone(p);
        let tasks=[]; try{ tasks=JSON.parse(p.exercises||'[]'); }catch(e){}
        const tasksDone = tasks.filter((_,i)=>compState[p.id+'_task_'+i]).length;
        const bt = {sesion:'🏄',fisico:'💪',mental:'🧠',tecnico:'🎯',tactico:'♟️',respiracion:'🌬️',meditacion:'🧘',mobility:'🤸',recovery:'🛌',otro:'📋',comp_training:'🏆'}[p.work_type]||'📋';
        const statusColor = blockDone?'var(--green)':tasksDone>0?'var(--amber)':'rgba(255,255,255,.15)';
        const statusIcon = blockDone?'✅':tasksDone>0?'⚡':'○';
        planHtml += `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg3);border-radius:8px;margin-bottom:5px;">
          <span style="font-size:18px;">${bt}</span>
          <div style="flex:1;">
            <div style="font-size:12px;font-weight:700;color:var(--white);">${p.objective||getBlockType(p.work_type).label}</div>
            ${tasks.length?`<div style="font-size:10px;color:var(--grey);margin-top:2px;">${tasksDone}/${tasks.length} tareas</div>`:''}
          </div>
          <span style="font-size:16px;color:${statusColor};">${statusIcon}</span>
        </div>`;
      });
    } else {
      planHtml = '<div style="font-size:11px;color:var(--grey);padding:8px;">Sin plan asignado hoy</div>';

    // Wellness bars
    const energy = ci?.energy_level||0;

        </div>
      </div>`:''}

      <!-- 4. OBJETIVO -->
      ${ci?`<div style="background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">

      </div>`:''}

      <!-- 5. NOTAS DEL ATLETA -->
      ${ci?.notes?`<div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--cyan);margin-bottom:8px;">NOTAS DEL ATLETA</div>

      <!-- FOOTER BUTTON -->

    const body = document.getElementById('dayReportBody');
    if(body) body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--red);font-size:12px;">Error cargando reporte</div>';
    console.error(e);
  }
}

/* ════════════════════════════════════════════════════════════════════

      db.from('tss_evaluations').select('athlete_id,physical,technique,mindset,competitive,date').gte('date',offFloor).order('date',{ascending:false}).limit(300),
      db.from('tss_daily_checkins').select('athlete_id,date,progress_pct,blocks_completed,comp_state,water_glasses,energy_level,focus_level,nutrition,surf_hours,notes,sesion_result,goal_achieved').eq('date',today),

          <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
            ${ci?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);white-space:nowrap;">✅ Check-in</span>'

              <div style="font-size:7px;color:var(--grey);margin-top:1px;">⭐ Índice</div>
            </div>
          </div>
          ${ci?(function(){
            var sr={}; try{sr=ci.sesion_result?JSON.parse(ci.sesion_result):{};}catch(e){}
            var sKeys=Object.keys(sr);
            var rawRes=sKeys.length?sr[sKeys[0]]:null;
            // Handle comp_training results (objects with .mission) vs simple strings
            var objRes = (rawRes && typeof rawRes==='object') ? (rawRes.mission||'') : (rawRes||'');
            // Fallback to goal_achieved from check-in form if sesion_result has no objective
            if(!objRes && ci.goal_achieved) objRes = ci.goal_achieved;
            var focusVal=ci.focus_level||0;
            if(!ci.surf_hours && !objRes && !focusVal) return '';
            var focusColor2=focusVal>=4?'var(--cyan)':focusVal>=2?'var(--amber)':'var(--grey)';
            var objIcon=objRes==='Si'?'✅':objRes==='Parcial'?'⚡':objRes==='No'?'❌':'—';
            var objColor=objRes==='Si'?'var(--green)':objRes==='Parcial'?'var(--amber)':objRes==='No'?'var(--red)':'var(--grey)';
            return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px;">'
              +'<div style="background:rgba(0,201,232,.06);border:1px solid rgba(0,201,232,.2);border-radius:7px;padding:6px 8px;display:flex;align-items:center;gap:6px;">'
              +'<div style="font-size:15px;font-weight:900;color:'+(focusVal?focusColor2:'var(--grey)')+';">'+(focusVal||'—')+'/5</div>'
              +'<div style="font-size:8px;color:var(--grey);line-height:1.3;">🎯 Enfoque<br>en el agua</div></div>'

            </div>
          </div>`:''}
          ${ci?.notes?`<div style="margin-top:6px;border-left:2px solid var(--cyan);padding-left:8px;">
            <span style="font-size:10px;color:rgba(255,255,255,.45);font-style:italic;">💬 ${ci.notes.substring(0,65)}${ci.notes.length>65?'…':''}</span>
          </div>`:''}
        </div>
      </div>`;
    }).join('')}

    <!-- ÍNDICE HISTÓRICO -->
    <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--cyan);margin:16px 0 10px;">EQUIPO · ÍNDICE HISTÓRICO</div>
    ${S.athletes.map(a=>{
      const ws=scoreCount[a.id]?(scoreSum[a.id]/scoreCount[a.id]).toFixed(1):'—';
      const days=daysSince(lastSes[a.id]);
      return `<div onclick="openAthProfile('${a.id}','${escAttr(a.name)}')"
        style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin-bottom:6px;cursor:pointer;">

        <div style="display:flex;align-items:center;gap:10px;">
          ${days>7?`<span style="font-size:10px;color:var(--red);">⚠️ ${days}d</span>`

          <span style="font-size:16px;font-weight:900;color:${ws==='—'?'var(--grey)':'var(--cyan)'};">${ws}</span>
          <span style="font-size:10px;color:var(--grey);">→</span>

    <!-- RANKING POR GRUPO -->
    <div id="coachGroupRanking" style="margin-top:16px;"></div>

/* ════════════════════════════════════════════════════════════════════
   MÓDULO: COMPETENCIA (Atleta) — Modo Competencia + Heats + Auto-eval
   vCompetencia, openHeatWizard, saveHeat, openCompCloseModal, finalizeCompetition
   loadCompHoyBanner, openCompReport, loadCompForCoach
   ════════════════════════════════════════════════════════════════════ */

async function loadCompHoyBanner(){
  // En el Hoy del atleta, si hay una competition (cita type=competencia) hoy o en curso, mostrar card destacada
  const el=document.getElementById('compHoyBanner'); if(!el||S.user.role!=='athlete') return;
  try {
    const today=todayStr();
    const{data}=await db.from('tss_competitions')
      .select('*')
      .eq('athlete_id', S.user.id)
      .gte('date', today)
      .neq('status','finalizada').neq('status','cancelada')
      .order('date').limit(3);
    if(!data||!data.length){ el.innerHTML=''; return; }
    let html='';
    data.forEach(c => {
      const isToday = c.date===today;
      const isActive = c.status==='en_curso';
      if(!isToday && !isActive) return; // solo mostrar si es hoy o en curso
      html += `<div class="card card-amber anim-up" style="margin-bottom:12px;border:2px solid var(--amber);background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(168,85,247,.06));">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <span style="font-size:30px;">🏆</span>
          <div style="flex:1;">
            <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);font-weight:800;">${isActive?'COMPETENCIA EN CURSO':'COMPETENCIA HOY'}</div>
            <div style="font-size:16px;font-weight:900;color:var(--white);margin-top:2px;">${esc(c.name)}</div>
            <div style="font-size:11px;color:var(--grey);margin-top:3px;">📅 ${fmtDate(c.date)}${c.place?' · 📍 '+esc(c.place):''}${c.category?' · '+esc(c.category):''}</div>
          </div>
        </div>
        <button class="btn btn-amber" style="width:100%;margin-top:12px;" onclick="vCompetencia('${c.id}')">${isActive?'⏵ Continuar Competencia':'🚀 Empezar Día de Competencia'}</button>
      </div>`;
    });
    el.innerHTML=html;
  } catch(e){ console.error(e); el.innerHTML=''; }
}

async function vCompetencia(competitionId){
  S.view='competencia'; S.activeCompId=competitionId;
  render('<div style="padding:30px;text-align:center;color:var(--grey);">Cargando competencia...</div>');
  try {
    const[{data:comp},{data:heats}] = await Promise.all([
      db.from('tss_competitions').select('*').eq('id',competitionId).single(),
      db.from('tss_competition_heats').select('*').eq('competition_id',competitionId).order('heat_number'),
    ]);
    if(!comp){ render('<p style="padding:20px;color:var(--red);">Competencia no encontrada</p>'); return; }

    // Si está programada y la abre, pasarla a "en_curso"
    if(comp.status==='programada'){
      await db.from('tss_competitions').update({status:'en_curso'}).eq('id',competitionId);
      comp.status='en_curso';
    }

    const ath = (S.athletes||[]).find(a=>a.id===comp.athlete_id) || {name:'Atleta'};
    const isOwner = S.user.id===comp.athlete_id;
    const isCoach = S.user.role==='coach' || S.user.role==='acoach';
    const isFinalized = comp.status==='finalizada';
    const lastHeat = heats && heats.length ? heats[heats.length-1] : null;
    const hasOpenHeat = lastHeat && lastHeat.status!=='completado';

    // Auto-eval final (si existe)
    let finalEval = null;
    try { finalEval = comp.athlete_final_eval ? (typeof comp.athlete_final_eval==='object'?comp.athlete_final_eval:JSON.parse(comp.athlete_final_eval)) : null; } catch(e){}

    let html = `
      <button class="btn btn-ghost btn-sm" style="margin-bottom:10px;" onclick="switchView('${isCoach?'panel':'hoy'}')">← Volver</button>
      <div class="card card-amber" style="margin-bottom:14px;border:2px solid var(--amber);">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <span style="font-size:36px;">🏆</span>
          <div style="flex:1;">
            <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);font-weight:800;">${comp.status==='finalizada'?'COMPETENCIA FINALIZADA':comp.status==='en_curso'?'EN CURSO':'PROGRAMADA'}</div>
            <div style="font-size:18px;font-weight:900;color:var(--white);margin-top:2px;">${esc(comp.name)}</div>
            <div style="font-size:11px;color:var(--grey);margin-top:3px;">${ath.name}</div>
            <div style="font-size:11px;color:var(--grey);margin-top:2px;">📅 ${fmtDate(comp.date)}${comp.place?' · 📍 '+esc(comp.place):''}${comp.category?' · '+esc(comp.category):''}</div>
          </div>
        </div>
      </div>

      <div class="sec-title">📜 Heats</div>`;

    if(!heats || !heats.length){
      html += `<div class="card" style="text-align:center;padding:20px;color:var(--grey);font-size:12px;">Aún no has registrado ningún heat</div>`;
    } else {
      heats.forEach(h => {
        const r = (h.result_json && typeof h.result_json==='object') ? h.result_json : (()=>{ try { return h.result_json?JSON.parse(h.result_json):{}; } catch(e){ return {}; } })();
        const best1 = r.best1 || 0;
        const best2 = r.best2 || 0;
        const total = (parseFloat(best1)||0) + (parseFloat(best2)||0);
        const statusColor = h.status==='completado'?(h.passed?'var(--green)':'var(--grey)'):'var(--cyan)';
        const statusLabel = h.status==='completado'?(h.passed?'✅ Pasó':'❌ Eliminado'):'🔵 En proceso';
        html += `<div class="card anim-up" style="margin-bottom:8px;border-left:3px solid ${statusColor};cursor:pointer;" onclick="openHeatWizard('${comp.id}','${h.id}')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:800;color:var(--white);">Heat ${h.heat_number}${h.round_name?' · '+esc(h.round_name):''}</div>
              <div style="font-size:11px;color:var(--grey);margin-top:2px;">${statusLabel}${h.is_final_heat?' · Heat final':''}</div>
              ${h.status==='completado'?`<div style="font-size:11px;color:var(--cyan);margin-top:4px;">🏆 ${best1} + ${best2} = ${total.toFixed(1)} · ${r.total_count||0} olas</div>`:''}
            </div>
            <span style="font-size:14px;color:var(--grey);">→</span>
          </div>
        </div>`;
      });
    }

    // Botones de acción
    if(isOwner && !isFinalized){
      html += `<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">`;
      if(!hasOpenHeat){
        const nextNum = (heats?.length||0) + 1;
        html += `<button class="btn btn-cyan" onclick="openHeatWizard('${comp.id}',null,${nextNum})">+ Agregar Heat ${nextNum}</button>`;
      } else {
        html += `<button class="btn btn-cyan" onclick="openHeatWizard('${comp.id}','${lastHeat.id}')">⏵ Continuar Heat ${lastHeat.heat_number}</button>`;
      }
      // Cerrar competencia solo si hay al menos 1 heat completado
      const hasCompletedHeat = (heats||[]).some(h=>h.status==='completado');
      if(hasCompletedHeat){
        html += `<button class="btn btn-amber" onclick="openCompCloseModal('${comp.id}')">🏁 Cerrar Competencia + Auto-evaluación</button>`;
      }
      html += `</div>`;
    }

    if(finalEval){
      html += `<div class="sec-title" style="margin-top:18px;">⭐ Tu auto-evaluación final</div>
        <div class="card" style="margin-bottom:8px;">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            ${[
              ['🏃','Físico','fisico'],['🎯','Técnica','tecnica'],['♟️','Táctica','tactica'],
              ['🌊','Elección olas','eleccion_olas'],['📋','Equipo','equipo'],['🧠','Mental','mental']
            ].map(([icon,lbl,key])=>{
              const v = finalEval[key] || 0;
              const color = v>=4?'var(--green)':v>=3?'var(--amber)':'var(--red)';
              return `<div style="text-align:center;background:var(--bg3);padding:8px 4px;border-radius:8px;">
                <div style="font-size:16px;margin-bottom:2px;">${icon}</div>
                <div style="font-size:16px;font-weight:900;color:${color};">${v}/5</div>
                <div style="font-size:8px;color:var(--grey);margin-top:1px;">${lbl}</div>
              </div>`;
            }).join('')}
          </div>
          ${comp.athlete_final_notes?`<div style="margin-top:10px;padding:8px;background:var(--bg3);border-radius:6px;font-size:11px;color:var(--white);line-height:1.5;">💬 ${esc(comp.athlete_final_notes)}</div>`:''}
        </div>`;
    }

    render(html);
  } catch(e){ console.error(e); render('<p style="padding:20px;color:var(--red);">Error: '+esc(e.message)+'</p>'); }
}

async function openHeatWizard(compId, heatId, suggestedNumber){

  if(heatId){
    try { const{data}=await db.from('tss_competition_heats').select('*').eq('id',heatId).single(); heat=data; } catch(e){}
  }
  const isNew = !heat;
  const heatNum = heat?.heat_number || suggestedNumber || 1;
  const prep = (heat?.prep_json && typeof heat.prep_json==='object') ? heat.prep_json : (()=>{ try{return heat?.prep_json?JSON.parse(heat.prep_json):{};}catch(e){return {};} })();
  const result = (heat?.result_json && typeof heat.result_json==='object') ? heat.result_json : (()=>{ try{return heat?.result_json?JSON.parse(heat.result_json):{};}catch(e){return {};} })();

  let m = document.getElementById('heatWizModal');
  if(m) m.remove();
  m = document.createElement('div'); m.className='modal-overlay'; m.id='heatWizModal';
  m.innerHTML = `<div class="modal-sheet" style="max-height:92vh;overflow-y:auto;">
    <div class="modal-head">
      <div class="modal-title">🏆 Heat ${heatNum}${heat?.round_name?' · '+esc(heat.round_name):''}</div>
      <button class="btn-icon" onclick="closeModal('heatWizModal')">✕</button>
    </div>
    <div style="padding:6px 0;">
      <input type="hidden" id="hw-compId" value="${compId}">
      <input type="hidden" id="hw-heatId" value="${heat?.id||''}">
      <input type="hidden" id="hw-heatNum" value="${heatNum}">

      <label class="inp-label">Ronda</label>
      <input type="text" class="inp" id="hw-round" value="${escAttr(heat?.round_name||'')}" placeholder="Ej: Ronda 1, Cuartos, Semis, Final...">

      <div class="sec-title" style="margin-top:14px;">🧘 PASO 1 · PREPARACIÓN PRE-HEAT</div>

      <label class="inp-label">Posición en el lineup</label>
      <select class="sel" id="hw-lineup">
        <option value="">— Elige —</option>
        <option value="A"${prep.lineup==='A'?' selected':''}>A · Peak principal (donde rompen los sets)</option>
        <option value="B"${prep.lineup==='B'?' selected':''}>B · Zona inside (olas trabajables)</option>
        <option value="C"${prep.lineup==='C'?' selected':''}>C · Outside / Punta (sets grandes)</option>
        <option value="D"${prep.lineup==='D'?' selected':''}>D · Dinámica (según rival y prioridad)</option>
      </select>

      <label class="inp-label">Estrategia del heat</label>
      <select class="sel" id="hw-strategy">
        <option value="">— Elige —</option>
        <option value="backup"${prep.strategy==='backup'?' selected':''}>1. Backup primero, luego esperar la buena</option>
        <option value="build"${prep.strategy==='build'?' selected':''}>2. Construcción de puntos (2 medianas bien)</option>
        <option value="attack"${prep.strategy==='attack'?' selected':''}>3. Aprovechar la primera oportunidad</option>
        <option value="select"${prep.strategy==='select'?' selected':''}>4. Ultra-selectivo (solo 2 olas top)</option>
        <option value="block"${prep.strategy==='block'?' selected':''}>5. Bloquear posición del rival</option>
        <option value="explode"${prep.strategy==='explode'?' selected':''}>6. Comienzo explosivo + dominar prioridad</option>
      </select>

      <label class="inp-label">Mantra / Palabra clave</label>
      <input type="text" class="inp" id="hw-mantra" value="${escAttr(prep.mantra||'')}" placeholder="Una palabra que te ancle...">

      <label class="inp-label">Checklist pre-heat</label>
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px;">
        ${['Calentamiento','Simulación pre-heat','Respiración','Visualización','Tabla lista','Hidratado'].map((item,i)=>`
        <label style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-size:12px;">
          <input type="checkbox" class="hw-prep-ck" data-i="${i}" ${prep[`check_${i}`]?'checked':''} style="accent-color:var(--green);width:16px;height:16px;">

      <div class="sec-title" style="margin-top:14px;">🌊 PASO 2 · RESULTADO DEL HEAT</div>
      <p style="font-size:11px;color:var(--grey);margin-bottom:8px;">Llena esto cuando salgas del agua</p>

      <label class="inp-label">Tus 2 mejores scores</label>
      <div style="display:flex;gap:8px;">
        <input type="number" step="0.1" class="inp" id="hw-best1" placeholder="Best #1" min="0" max="10" value="${result.best1||''}">
        <input type="number" step="0.1" class="inp" id="hw-best2" placeholder="Best #2" min="0" max="10" value="${result.best2||''}">
      </div>
      <p style="font-size:10px;color:var(--cyan);margin-top:4px;" id="hw-total-preview">Heat Total: —</p>

      <textarea class="ta" id="hw-worked" placeholder="Lo que salió bien en el heat...">${esc(result.what_worked||'')}</textarea>

      <label class="inp-label">¿Qué debes mejorar?</label>
      <textarea class="ta" id="hw-improve" placeholder="Lo que vas a corregir...">${esc(result.what_to_improve||'')}</textarea>

      <label class="inp-label" style="margin-top:10px;">¿Pasaste el heat?</label>
      <div class="opt-row">
        <button type="button" class="opt-pill${result.passed===true?' on-green':''}" onclick="hwSetPassed(true,this)">✅ Sí, pasé</button>
        <button type="button" class="opt-pill${result.passed===false?' on-red':''}" onclick="hwSetPassed(false,this)">❌ No, eliminado</button>
      </div>
      <input type="hidden" id="hw-passed" value="${result.passed===true?'true':result.passed===false?'false':''}">

      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;cursor:pointer;">
        <input type="checkbox" id="hw-isFinal" ${heat?.is_final_heat?'checked':''} style="accent-color:var(--red);width:16px;height:16px;">
        <span style="font-size:12px;color:var(--white);">Este fue mi último heat (no avanzo)</span>
      </label>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-cyan" style="flex:1;" onclick="saveHeat()">💾 Guardar</button>
        ${heat?`<button class="btn btn-red" style="width:auto;padding:14px;" onclick="deleteHeat('${heat.id}','${compId}')">🗑</button>`:''}
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) closeModal('heatWizModal'); };
  // Live preview total
  setTimeout(()=>{
    const upd = ()=>{
      const a=parseFloat(document.getElementById('hw-best1')?.value)||0;
      const b=parseFloat(document.getElementById('hw-best2')?.value)||0;
      const el=document.getElementById('hw-total-preview');
      if(el) el.textContent = `Heat Total: ${(a+b).toFixed(1)}`;
    };
    document.getElementById('hw-best1')?.addEventListener('input',upd);
    document.getElementById('hw-best2')?.addEventListener('input',upd);
    upd();
  },50);
}

function hwSetPassed(value, btn){
  btn.closest('.opt-row').querySelectorAll('.opt-pill').forEach(b=>b.classList.remove('on-green','on-red'));
  btn.classList.add(value?'on-green':'on-red');
  document.getElementById('hw-passed').value = value?'true':'false';
}

async function saveHeat(){
  const compId = document.getElementById('hw-compId').value;
  const heatId = document.getElementById('hw-heatId').value;
  const heatNum = parseInt(document.getElementById('hw-heatNum').value) || 1;
  const round = gv('hw-round');

  const prep = {
    lineup: gv('hw-lineup')||null,
    strategy: gv('hw-strategy')||null,
    mantra: gv('hw-mantra')||null,
  };
  document.querySelectorAll('.hw-prep-ck').forEach(cb => { prep[`check_${cb.dataset.i}`] = cb.checked; });

  const best1 = parseFloat(gv('hw-best1'))||null;
  const best2 = parseFloat(gv('hw-best2'))||null;
  const lowest = parseFloat(gv('hw-lowest'))||null;
  const total_count = parseInt(gv('hw-count'))||null;
  const passedVal = gv('hw-passed');
  const passed = passedVal==='true'?true:passedVal==='false'?false:null;
  const what_worked = gv('hw-worked')||null;
  const what_to_improve = gv('hw-improve')||null;

  const result = (best1!==null || best2!==null || lowest!==null || total_count!==null || passed!==null || what_worked || what_to_improve)
    ? { best1, best2, lowest, total_count, passed, what_worked, what_to_improve, heat_total: (best1||0)+(best2||0) }
    : null;

  const isFinal = document.getElementById('hw-isFinal').checked;
  // status: si tiene result data significa que ya pasó el heat. Si solo tiene prep, está en_curso.
  const status = result ? 'completado' : 'en_curso';

  const payload = {
    competition_id: compId,
    heat_number: heatNum,
    round_name: round || null,
    prep_json: prep,
    result_json: result,
    status,
    is_final_heat: isFinal,
    passed: passed,
    completed_at: status==='completado' ? new Date().toISOString() : null,
  };

  showLoad(true);
  try {
    // Need athlete_id from competition
    const{data:comp}=await db.from('tss_competitions').select('athlete_id').eq('id',compId).single();
    payload.athlete_id = comp.athlete_id;

    let error;
    if(heatId){ ({error} = await db.from('tss_competition_heats').update(payload).eq('id',heatId)); }
    else { ({error} = await db.from('tss_competition_heats').insert(payload)); }
    if(error) throw error;
    toast(heatId?'✅ Heat actualizado':'✅ Heat guardado','success');
    closeModal('heatWizModal');
    vCompetencia(compId);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function deleteHeat(heatId, compId){
  if(!confirm('¿Eliminar este heat?')) return;
  showLoad(true);
  try {
    const{error}=await db.from('tss_competition_heats').delete().eq('id',heatId);
    if(error) throw error;
    toast('Heat eliminado','success');
    closeModal('heatWizModal');
    vCompetencia(compId);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

function pickFinalRating(id, value, btn){

async function finalizeCompetition(){
  const compId = document.getElementById('fe-compId').value;
  const evalData = {
    fisico: parseInt(gv('fe-fisico'))||0,
    tecnica: parseInt(gv('fe-tecnica'))||0,
    tactica: parseInt(gv('fe-tactica'))||0,
    eleccion_olas: parseInt(gv('fe-eleccion_olas'))||0,
    equipo: parseInt(gv('fe-equipo'))||0,
    mental: parseInt(gv('fe-mental'))||0,
  };
  const filled = Object.values(evalData).filter(v=>v>0).length;
  if(filled < 4){ toast('Completa al menos 4 ratings','error'); return; }

  showLoad(true);
  try {
    const{error}=await db.from('tss_competitions').update({
      status:'finalizada',
      athlete_final_eval: evalData,
      athlete_final_notes: gv('fe-notes')||null,
      finalized_at: new Date().toISOString(),
      finalized_by: S.user.id,
    }).eq('id',compId);
    if(error) throw error;
    toast('✅ Competencia finalizada','success');
    closeModal('compCloseModal');
    vCompetencia(compId);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

    cumplida:    {lbl:'Cumplida',    bg:'rgba(34,197,94,.18)', c:'var(--green)'},
    cancelada:   {lbl:'Cancelada',   bg:'rgba(239,68,68,.1)',  c:'var(--red)'},
    reprogramada:{lbl:'Reprogramada',bg:'rgba(245,158,11,.1)', c:'var(--amber)'},
  };
  const m = map[status] || map.programada;
  return `<span style="font-size:9px;padding:2px 7px;border-radius:20px;background:${m.bg};color:${m.c};font-weight:700;white-space:nowrap;">${m.lbl}</span>`;
}
function fmtApptDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); const tdy=todayStr(); const dDate=d; if(dDate===tdy) return 'Hoy'; const tom=new Date(); tom.setDate(tom.getDate()+1); if(dDate===tom.toISOString().split('T')[0]) return 'Mañana'; return dt.toLocaleDateString('es-SV',{weekday:'short',day:'2-digit',month:'short'}); }
function fmtApptTime(t){ if(!t) return ''; return t.substring(0,5); }

function citasTab(t){
  document.querySelectorAll('#it-cit-prox,#it-cit-hoy,#it-cit-semana,#it-cit-atleta,#it-cit-cumplidas').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('it-cit-'+t); if(el) el.classList.add('active');
  if(t==='prox') loadApptsProx();
  else if(t==='hoy') loadApptsHoy();
  else if(t==='semana') loadApptsSemana();
  else if(t==='atleta') loadApptsByAthlete();
  else if(t==='cumplidas') loadApptsCumplidas();
}

async function loadApptsProx(){
  const el=document.getElementById('citasContent'); if(!el) return;
  try {
    const today = todayStr();
    const {data, error} = await db.from('tss_appointments')
      .select('*').gte('date',today).in('status',['programada','confirmada'])
      .order('date').order('time').limit(60);
    if(error){ el.innerHTML='<p style="padding:20px;color:var(--red);">Error: '+esc(error.message)+'</p>'; return; }
    if(!data||!data.length){ el.innerHTML='<div class="card" style="text-align:center;padding:30px;"><div style="font-size:32px;margin-bottom:6px;">📅</div><p style="color:var(--grey);font-size:12px;">Sin citas programadas</p></div>'; return; }
    el.innerHTML = data.map(renderApptCard).join('');
  } catch(e){ el.innerHTML='<p style="padding:20px;color:var(--red);">Error</p>'; console.error(e); }
}

async function loadApptsSemana(){
  const el=document.getElementById('citasContent'); if(!el) return;
  try {
    const today=new Date(todayStr()+'T00:00:00');
    const end=new Date(today); end.setDate(today.getDate()+7);
    const startStr=today.toISOString().split('T')[0];
    const endStr=end.toISOString().split('T')[0];
    const {data} = await db.from('tss_appointments').select('*').gte('date',startStr).lte('date',endStr).order('date').order('time');
    if(!data||!data.length){ el.innerHTML='<div class="card" style="text-align:center;padding:30px;"><p style="color:var(--grey);font-size:12px;">Sin citas en los próximos 7 días</p></div>'; return; }
    // Group by date
    const byDate={}; data.forEach(a=>{(byDate[a.date]=byDate[a.date]||[]).push(a);});
    let html='';
    Object.keys(byDate).sort().forEach(d=>{
      html+=`<div class="sec-title" style="margin:14px 0 8px;">${fmtApptDate(d)} · ${fmtDate(d)}</div>`;
      html+=byDate[d].map(renderApptCard).join('');
    });
    el.innerHTML = html;
  } catch(e){ el.innerHTML='<p style="padding:20px;color:var(--red);">Error</p>'; console.error(e); }
}

async function loadApptsByAthlete(){
  const el=document.getElementById('citasContent'); if(!el) return;
  try {
    const today = todayStr();
    const {data} = await db.from('tss_appointments').select('*').gte('date',today).in('status',['programada','confirmada']).order('date').order('time');
    const byAth={}; (data||[]).forEach(a=>{(byAth[a.athlete_id]=byAth[a.athlete_id]||[]).push(a);});
    const sorted = (S.athletes||[]).filter(a=>a.active!==false).sort((a,b)=>{
      const ca=(byAth[a.id]||[]).length, cb=(byAth[b.id]||[]).length;
      if(ca!==cb) return cb-ca;
      return a.name.localeCompare(b.name);
    });
    let html='';
    sorted.forEach(ath=>{
      const list = byAth[ath.id]||[];
      const next = list[0];
      html+=`<div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="openAthAppts('${ath.id}','${escAttr(ath.name)}')">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--white);">${esc(ath.name)}</div>
            <div style="font-size:11px;color:var(--grey);margin-top:2px;">${list.length>0?list.length+' cita(s) próxima(s)':'Sin citas'}</div>
          </div>
          ${next?`<div style="text-align:right;">
            <div style="font-size:11px;color:var(--cyan);font-weight:700;">${apptType(next.type).icon} ${fmtApptDate(next.date)}</div>
            <div style="font-size:9px;color:var(--grey);">${apptType(next.type).label}</div>
          </div>`:'<span style="font-size:11px;color:var(--grey);">→</span>'}
        </div>
      </div>`;
    });
    el.innerHTML = html || '<p style="padding:20px;color:var(--grey);">Sin atletas</p>';
  } catch(e){ el.innerHTML='<p style="padding:20px;color:var(--red);">Error</p>'; console.error(e); }
}

async function saveAppt(existId, prefAthleteId){
  const mode = document.getElementById('ap-mode-val')?.value || 'single';
  const type = gv('ap-type');
  const date = gv('ap-date');
  if(!type){ toast('Selecciona el tipo','error'); return; }
  if(!date){ toast('Ingresa la fecha','error'); return; }

  // Determinar lista de atletas segun el modo
  let athleteIds = [];
  if(existId || prefAthleteId){
    // Edicion o creacion para atleta especifico
    athleteIds = [prefAthleteId || gv('ap-ath')];
  } else if(mode==='single'){
    athleteIds = [gv('ap-ath')];
  } else if(mode==='multi'){
    athleteIds = Array.from(document.querySelectorAll('.ap-multi-cb:checked')).map(cb=>cb.value);
    if(!athleteIds.length){ toast('Selecciona al menos un atleta','error'); return; }
  } else if(mode==='all'){
    athleteIds = (S.athletes||[]).filter(a=>a.active!==false).map(a=>a.id);
    if(!athleteIds.length){ toast('No hay atletas activos','error'); return; }
  }

  if(!athleteIds[0]){ toast('Selecciona un atleta','error'); return; }

  const basePayload = {
    type, date,
    time: gv('ap-time')||null,
    duration_min: parseInt(gv('ap-dur'))||60,
    location: gv('ap-loc')||null,
    provider_name: gv('ap-prov')||null,
    notes: gv('ap-notes')||null,
    created_by: S.user.id,
  };

  // Si son varios atletas, generar batch_id compartido
  const isBatch = athleteIds.length > 1;
  const batchId = isBatch ? crypto.randomUUID() : null;

  showLoad(true);
  try {
    if(existId){
      const {error} = await db.from('tss_appointments').update({...basePayload, athlete_id: athleteIds[0]}).eq('id', existId);
      if(error) throw error;
      toast('✅ Cita actualizada','success');
    } else {
      const rows = athleteIds.map(aid => ({...basePayload, athlete_id: aid, batch_id: batchId}));
      const {error} = await db.from('tss_appointments').insert(rows);
      if(error) throw error;
      toast(isBatch?`✅ ${rows.length} citas creadas (grupales)`:'✅ Cita creada','success');
    }
    closeModal('apptFormModal');
    if(S.view==='citas') citasTab('prox');
    else if(S.view==='perfil') loadAthleteAppts(athleteIds[0]);
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function deleteAppt(id, batchId){
  let scope = 'one';
  if(batchId && batchId!=='null'){
    // Cita grupal — preguntar alcance
    const choice = confirm('Esta es una cita grupal.\n\nOK = Eliminar TODAS las citas del grupo\nCancelar = Eliminar solo esta');
    scope = choice ? 'batch' : 'one';
  } else {
    if(!confirm('¿Eliminar esta cita?')) return;
  }
  showLoad(true);
  try {
    let q = db.from('tss_appointments').delete();
    if(scope==='batch') q = q.eq('batch_id', batchId);
    else q = q.eq('id', id);
    const {error} = await q;
    if(error) throw error;
    toast(scope==='batch'?'✅ Citas del grupo eliminadas':'Cita eliminada','success');
    closeModal('apptFormModal');
    closeModal('apptDetailModal');
    if(S.view==='citas') citasTab('prox');
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function markApptDone(id, type, athleteId){
  showLoad(true);
  try {
    const {error} = await db.from('tss_appointments').update({status:'cumplida', completed_at:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
    toast('✅ Cita marcada como cumplida','success');
    closeModal('apptDetailModal');
    // If type triggers an evaluation form, open it after closing
    const t = apptType(type);
    if(t.triggerEval && (S.user.role==='coach'||S.user.role==='acoach')){
      setTimeout(()=>{
        toast('Abriendo evaluación...','info');
        switchView('evaluar');
      }, 600);
    } else {
      if(S.view==='citas') citasTab('prox');
      else if(S.view==='perfil') loadAthleteAppts(athleteId);
    }
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function athleteConfirmAppt(id, value){
  showLoad(true);
  try {
    const upd = {athlete_confirmation:value, athlete_confirmed_at:new Date().toISOString()};
    if(value==='voy') upd.status='confirmada';
    const {error} = await db.from('tss_appointments').update(upd).eq('id',id);
    if(error) throw error;
    toast(value==='voy'?'✅ Confirmaste asistencia':'❌ Marcado como no puedes','success');
    closeModal('apptDetailModal');
    if(S.view==='hoy') vHoy();
    else if(S.view==='perfil') vPerfil();
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally { showLoad(false); }
}

async function openAthAppts(athleteId, athleteName){
  let m = document.getElementById('athApptsModal');
  if(m) m.remove();
  m = document.createElement('div');
  m.className='modal-overlay';
  m.id='athApptsModal';
  m.innerHTML=`<div class="modal-sheet" style="max-height:90vh;overflow-y:auto;">
    <div class="modal-head">
      <div class="modal-title">📅 Citas de ${esc(athleteName)}</div>
      <button class="btn-icon" onclick="closeModal('athApptsModal')">✕</button>
    </div>
    <div style="padding:6px 0;">
      <button class="btn btn-cyan" style="margin-bottom:10px;" onclick="closeModal('athApptsModal');openApptForm(null,'${athleteId}')">+ Nueva cita para ${esc(athleteName)}</button>
      <div id="athApptsBody"><p style="text-align:center;color:var(--grey);padding:20px;">Cargando...</p></div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) closeModal('athApptsModal'); };
  try {
    const {data} = await db.from('tss_appointments').select('*').eq('athlete_id',athleteId).order('date',{ascending:false}).limit(50);

    if(!data||!data.length){ body.innerHTML='<p style="text-align:center;color:var(--grey);padding:20px;font-size:12px;">Sin citas registradas</p>'; return; }
    const today = todayStr();
    const upcoming = data.filter(a=>a.date>=today && a.status!=='cancelada' && a.status!=='cumplida');
    const past = data.filter(a=>a.date<today || a.status==='cumplida' || a.status==='cancelada');
    let html='';
    if(upcoming.length){ html+=`<div class="sec-title">⏰ Próximas (${upcoming.length})</div>${upcoming.map(renderApptCard).join('')}`; }
    if(past.length){ html+=`<div class="sec-title" style="margin-top:14px;">📋 Historial (${past.length})</div>${past.map(renderApptCard).join('')}`; }
    body.innerHTML = html;

async function loadCoachGroupRanking(){
  const el=document.getElementById('coachGroupRanking'); if(!el) return;
  try {
    // Ranking oficial unificado: TODOS los atletas activos en una sola lista.
    // Periodo: desde OFFICIAL_START (miercoles 6 may 2026) hasta hoy.
    const allAthletes = (S.athletes||[]).filter(a=>a.active!==false);
    if(!allAthletes.length){ el.innerHTML=''; return; }
    const allAthIds = allAthletes.map(a=>a.id);

    // Ventana: ultimos 7 dias o desde OFFICIAL_START (lo mas reciente de los dos)
    const d7=new Date(); d7.setDate(d7.getDate()-7);
    const date7=d7.toISOString().split('T')[0];
    const floorDate=date7>OFFICIAL_START?date7:OFFICIAL_START;
    const{data:allCI}=await db.from('tss_daily_checkins')
      .select('athlete_id,date,progress_pct,energy_level,surf_hours,goal_achieved')
      .in('athlete_id',allAthIds).gte('date',floorDate);

    // Score per athlete (misma formula que el ranking del atleta)
    const scores={};
    allAthIds.forEach(aid=>{
      const ci=(allCI||[]).filter(c=>c.athlete_id===aid);
      const days=ci.length;
      const avgPct=days?Math.round(ci.reduce((s,c)=>s+(c.progress_pct||0),0)/days):0;
      const surfH=ci.reduce((s,c)=>s+(parseFloat(c.surf_hours)||0),0);
      const goals=ci.filter(c=>c.goal_achieved==='Si').length;
      const compScore=Math.round(avgPct*0.4+Math.min(days/7*100,100)*0.2+(days?goals/days*100:0)*0.2+Math.min(surfH/10*100,100)*0.2);
      scores[aid]={compScore,avgPct,days,surfH,goals};
    });

    const ranked=[...allAthIds].sort((a,b)=>(scores[b]?.compScore||0)-(scores[a]?.compScore||0));
    const teamAvg=ranked.length?Math.round(ranked.reduce((s,id)=>s+(scores[id]?.compScore||0),0)/ranked.length):0;
    const medals=['🥇','🥈','🥉'];
    const TOP_N = 10;
    const showAll = !!window._coachRankShowAll;
    const visible = showAll ? ranked : ranked.slice(0, TOP_N);
    const hidden = ranked.length - visible.length;

    let html=`<div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--amber);margin-bottom:10px;">🏆 RANKING OFICIAL · ${showAll?'EQUIPO COMPLETO':'TOP '+TOP_N}</div>
      <div class="card" style="margin-bottom:10px;border:1px solid rgba(245,158,11,.15);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:800;color:var(--amber);">🏆 Cumplimiento últimos 7 días</div>
          <span style="font-size:10px;padding:3px 8px;border-radius:12px;background:rgba(245,158,11,.1);color:var(--amber);font-weight:700;">Prom: ${teamAvg}% · ${ranked.length} atletas</span>
        </div>`;

    visible.forEach((aid,i)=>{
      const ath=allAthletes.find(a=>a.id===aid);
      const sc=scores[aid]||{};
      const medal=i<3?medals[i]:'';
      const barColor=sc.compScore>=80?'var(--green)':sc.compScore>=50?'var(--amber)':'var(--red)';
      html+=`<div onclick="openAthProfile('${aid}','${esc(ath?.name||'')}')" style="display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:3px;border-radius:8px;cursor:pointer;background:${i===0?'rgba(245,158,11,.06)':'rgba(255,255,255,.02)'};">
        <span style="font-size:${i<3?'15':'12'}px;width:22px;text-align:center;font-weight:900;color:${i===0?'var(--amber)':i<3?'var(--green)':'var(--grey)'};">${medal||'#'+(i+1)}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${ath?.name||'Atleta'}</div>
          <div style="height:4px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:3px;">
            <div style="height:100%;width:${sc.compScore||0}%;border-radius:3px;background:${barColor};transition:width .5s;"></div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:16px;font-weight:900;color:${barColor};font-family:'Space Mono',monospace;">${sc.compScore||0}%</div>
          <div style="font-size:8px;color:var(--grey);">${sc.days||0}d · ${sc.surfH?.toFixed(1)||0}h</div>
        </div>
      </div>`;
    });

    if(hidden > 0){
      html+=`<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px;font-size:11px;" onclick="window._coachRankShowAll=true;loadCoachGroupRanking();">Ver los ${hidden} restantes ↓</button>`;
    } else if(showAll && ranked.length > TOP_N){
      html+=`<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px;font-size:11px;" onclick="window._coachRankShowAll=false;loadCoachGroupRanking();">Mostrar solo top ${TOP_N} ↑</button>`;
    }

    html+=`</div>`;
    el.innerHTML=html;
  } catch(e){ console.error('Coach ranking error',e); }
}

function resetEditUserPin(){
  // Genera un PIN aleatorio de 4 dígitos (no 0000)
  let p; do { p = String(Math.floor(1000+Math.random()*9000)); } while(p==='0000');
  const inp = document.getElementById('editUserPin'); if(inp) inp.value = p;
  toast('PIN nuevo generado: ' + p, 'info');
}

async function saveEditUser(){
  const userId = document.getElementById('editUserId').value;
  const originalRole = document.getElementById('editUserOriginalRole').value;
  const isHeadCoach = S.user.role==='coach';
  const updates = {};
  // Datos físicos (si los inputs existen, es atleta)
  const birthEl = document.getElementById('editBirthDate');
  if(birthEl){
    updates.birth_date = birthEl.value || null;
    updates.weight_kg = parseFloat(document.getElementById('editWeight').value) || null;
    updates.height_cm = parseFloat(document.getElementById('editHeight').value) || null;
    updates.stance = document.getElementById('stanceGoofy').classList.contains('btn-cyan') ? 'Goofy' : 'Regular';
  }
  // Campos de gestión (solo head coach)
  if(isHeadCoach){
    const name = document.getElementById('editUserName')?.value?.trim();
    const pin = document.getElementById('editUserPin')?.value?.trim();
    const newRole = document.getElementById('editUserRole')?.value || originalRole;
    if(!name){ toast('El nombre no puede quedar vacío','error'); return; }
    if(!pin || pin.length !== 4 || isNaN(pin)){ toast('El PIN debe ser 4 dígitos','error'); return; }
    if(pin==='0000'){ toast('Ese PIN no se permite','error'); return; }
    // PIN único (excluyendo el propio usuario)
    try {
      const{data:exists}=await db.from('tss_profiles').select('id').eq('pin',pin).neq('id',userId).neq('active',false).limit(1);
      if(exists && exists.length){ toast('Ese PIN ya está en uso por otro usuario','error'); return; }
    } catch(e){}
    if(newRole !== originalRole){
      const labels={athlete:'Atleta', acoach:'Coach Manager', coach:'Head Coach'};
      if(!confirm(`¿Confirmás cambiar el rol de ${name}\n\nde "${labels[originalRole]}" a "${labels[newRole]}"?\n\nEsto modifica sus permisos y la vista que ve al iniciar sesión.`)) return;
    }
    updates.name = name;
    updates.pin = pin;
    updates.role = newRole;
  }
  showLoad(true);
  try {
    const{error} = await db.from('tss_profiles').update(updates).eq('id', userId);
    if(error) throw error;
    // Refrescar caches locales
    const ai = S.athletes.findIndex(a=>a.id===userId);
    if(ai>=0){
      // Si cambió de rol y ya no es atleta, sacarlo de athletes
      if(updates.role && updates.role!=='athlete'){
        const moved = {...S.athletes[ai], ...updates};
        S.athletes.splice(ai,1);
        if(updates.role==='coach'||updates.role==='acoach'){ (S.coaches=S.coaches||[]).push(moved); S.coaches.sort((a,b)=>a.name.localeCompare(b.name)); }
      } else {
        S.athletes[ai] = {...S.athletes[ai], ...updates};
      }
    }
    const ci = (S.coaches||[]).findIndex(c=>c.id===userId);
    if(ci>=0){
      // Si cambió a atleta, mover a athletes
      if(updates.role==='athlete'){
        const moved = {...S.coaches[ci], ...updates};
        S.coaches.splice(ci,1);
        S.athletes.push(moved); S.athletes.sort((a,b)=>a.name.localeCompare(b.name));
      } else {
        S.coaches[ci] = {...S.coaches[ci], ...updates};
      }
    }
    toast('✅ Datos actualizados','success');
    closeModal('editUserModal');
    vAtletas();
  } catch(e){ toast('Error: '+e.message,'error'); console.error(e); }
  finally{ showLoad(false); }
}

/* ════════════════════════════════════════════════════════════════════
   PROFILE EXTRAS: Banner Info Incompleta + Radar de Pilares
   ════════════════════════════════════════════════════════════════════ */
function getInfoCompletenessGaps(prof){
  // Devuelve { missing: [...labels], critical: [...labels] }
  const groups = {
    'Datos personales (email, teléfono)': prof.email && prof.phone,
    'Datos físicos (peso, altura, stance)': prof.weight_kg && prof.height_cm && prof.stance,
    'Información médica (tipo de sangre)': prof.blood_type,
    'Contacto de emergencia': prof.emergency_name && prof.emergency_phone,
    'Metas (corto, mediano, largo)': prof.goal_short_term || prof.goal_mid_term || prof.goal_long_term,
  };
  const missing = Object.keys(groups).filter(k=>!groups[k]);
  const criticalKeys = ['Información médica (tipo de sangre)','Contacto de emergencia'];
  const critical = missing.filter(k => criticalKeys.includes(k));
  return { missing, critical };
}

function injectProfileExtras(athleteId, prof, evals){
  // Banner info incompleta
  const gaps = getInfoCompletenessGaps(prof);
  const perfilEl = document.getElementById('perfilContent');
  if(!perfilEl) return;
  const isOwner = S.user.id === athleteId;
  const isCoach = S.user.role==='coach' || S.user.role==='acoach';
  const canEdit = isOwner || isCoach;

  // Card de cinta (solo coach puede cambiarla)
  let beltCardHtml = '';
  if(isCoach){
    const belt = prof.current_belt ? getBelt(prof.current_belt) : null;
    if(belt){
      beltCardHtml = `<div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid ${belt.color};">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:32px;height:32px;border-radius:50%;background:${belt.color};box-shadow:0 0 10px ${belt.glow};border:2px solid var(--bg2);"></div>
          <div>
            <div style="font-size:10px;color:var(--grey);letter-spacing:.5px;text-transform:uppercase;">Cinta actual</div>
            <div style="font-size:14px;font-weight:800;color:var(--white);">${belt.name}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-xs" onclick="openBeltModal('${athleteId}')">✏️ Cambiar</button>
      </div>`;
    } else {
      beltCardHtml = `<div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--amber);background:rgba(245,158,11,.05);">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;">🎗</div>
          <div>
            <div style="font-size:10px;color:var(--grey);letter-spacing:.5px;text-transform:uppercase;">Cinta</div>
            <div style="font-size:13px;font-weight:700;color:var(--amber);">Sin asignar</div>
          </div>
        </div>
        <button class="btn btn-amber btn-xs" onclick="openBeltModal('${athleteId}')">🎗 Asignar</button>
      </div>`;
    }
  }

  let bannerHtml = '';
  if(gaps.missing.length && canEdit){
    const isCritical = gaps.critical.length > 0;
    const color = isCritical ? 'red' : 'amber';
    bannerHtml = `<div class="card anim-up" style="margin-bottom:12px;background:rgba(${isCritical?'239,68,68':'245,158,11'},.08);border:1px solid rgba(${isCritical?'239,68,68':'245,158,11'},.3);">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <span style="font-size:22px;">${isCritical?'⚠️':'📋'}</span>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:800;color:var(--${color});">${isCritical?'Info crítica incompleta':'Info personal incompleta'}</div>
          <div style="font-size:11px;color:var(--grey);margin-top:3px;">${isOwner?'Te':'Le'} faltan ${gaps.missing.length} sección(es): ${gaps.missing.slice(0,3).join(' · ')}${gaps.missing.length>3?'…':''}</div>
        </div>
      </div>
      <button class="btn btn-${color}" style="width:100%;margin-top:10px;" onclick="openInfoCompletaModal('${athleteId}')">📝 ${isOwner?'Completar mi información':'Completar información'}</button>
    </div>`;
  } else if(canEdit){
    bannerHtml = `<button class="btn btn-ghost btn-sm" style="margin-bottom:12px;width:100%;" onclick="openInfoCompletaModal('${athleteId}')">📝 Ver / Editar información completa</button>`;
  }

  // Gráfico de barras de pilares (basado en última eval o promedio)

  // Inyectar al inicio del perfilContent
  perfilEl.insertAdjacentHTML('afterbegin', beltCardHtml + bannerHtml + pillarHtml);
